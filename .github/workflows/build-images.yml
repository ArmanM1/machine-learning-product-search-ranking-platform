name: Build immutable AWS images

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type PUSH AWS IMAGES after reviewing the ECR storage estimate
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-financial-operations
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ALLOW_HELDOUT_EVAL: "0"
  CAMPAIGN_BUDGET_USD: "40"
  REQUIRED_CREDIT_RESERVE_USD: "40"
  MAXIMUM_OUT_OF_POCKET_USD: "0"

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: aws-images
    env:
      AUTHORIZATION: ${{ inputs.authorization }}
      CAMPAIGN_SPEND_TO_DATE_USD: ${{ secrets.AWS_CAMPAIGN_SPEND_TO_DATE_USD }}
      REMAINING_APPLICABLE_CREDIT_USD: ${{ secrets.AWS_REMAINING_APPLICABLE_CREDIT_USD }}
      FINANCIAL_SNAPSHOT_OBSERVED_AT: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_OBSERVED_AT }}
      FINANCIAL_SNAPSHOT_RECEIPT_SHA256: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_RECEIPT_SHA256 }}
      FINANCIAL_SNAPSHOT_HMAC_KEY: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_HMAC_KEY }}
      FINANCIAL_RESERVATION_MAX_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_MAX_USD }}
      FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD }}
      FINANCIAL_RESERVATION_CPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_CPU_HOURS }}
      FINANCIAL_RESERVATION_GPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_GPU_HOURS }}
      FINANCIAL_CPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_CPU_HOURS_USED_TO_DATE }}
      FINANCIAL_GPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_GPU_HOURS_USED_TO_DATE }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_WORKFLOW: build-images
      FINANCIAL_SNAPSHOT_AUTHORIZATION_INPUTS_JSON: ${{ toJSON(inputs) }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_COMMIT_SHA: ${{ github.sha }}
      FINANCIAL_SNAPSHOT_SOURCE: "aws_billing_and_cost_management_console"
      FINANCIAL_SNAPSHOT_MAX_AGE_SECONDS: "21600"
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the protected financial snapshot validator dependency
        run: python -m pip install --disable-pip-version-check pydantic==2.13.5 PyYAML==6.0.3
      - name: Enforce explicit authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${AUTHORIZATION}" = "PUSH AWS IMAGES"
          test "${ALLOW_HELDOUT_EVAL}" = "0"
          python - <<'PY'
          import os
          from decimal import Decimal, InvalidOperation

          from scripts.validate_financial_reservation import validate_reservation_coverage

          def amount(name: str) -> Decimal:
              try:
                  value = Decimal(os.environ[name])
              except (InvalidOperation, KeyError) as exc:
                  raise SystemExit(f"{name} must be a decimal number") from exc
              if not value.is_finite() or value < 0:
                  raise SystemExit(f"{name} must be finite and non-negative")
              return value

          # The PRD allocates at most USD 1 to private ECR storage.
          allowance = Decimal("1.00")
          if amount("MAXIMUM_OUT_OF_POCKET_USD") != 0:
              raise SystemExit("Out-of-pocket limit must remain zero")
          if amount("CAMPAIGN_SPEND_TO_DATE_USD") + allowance > amount("CAMPAIGN_BUDGET_USD"):
              raise SystemExit("Image push would breach the campaign envelope")
          if amount("REMAINING_APPLICABLE_CREDIT_USD") < allowance + amount("REQUIRED_CREDIT_RESERVE_USD"):
              raise SystemExit("Applicable credit cannot cover image storage allowance and reserve")
          validate_reservation_coverage(
              os.environ,
              required_max_usd=allowance,
              required_remaining_committed_usd=0,
              required_cpu_hours=0,
              required_gpu_hours=0,
          )
          print("ECR cost guard passed with the conservative USD 1 storage allowance.")
          PY
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-images-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Atomically reserve the signed campaign capacity
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Missing AWS_TERRAFORM_STATE_BUCKET variable}"
          python -m pip install --disable-pip-version-check pydantic==2.13.5 PyYAML==6.0.3
          PYTHONPATH=src python scripts/reserve_financial_capacity.py reserve \
            --bucket "${TF_STATE_BUCKET}" \
            --output financial-capacity-reservation.json
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Build, push, and capture immutable digests
        shell: bash
        env:
          TRAIN_REPOSITORY: ${{ vars.AWS_TRAIN_ECR_REPOSITORY_URL }}
          EVAL_REPOSITORY: ${{ vars.AWS_EVAL_ECR_REPOSITORY_URL }}
          SERVE_REPOSITORY: ${{ vars.AWS_SERVE_ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          : "${TRAIN_REPOSITORY:?Missing repository variable}"
          : "${EVAL_REPOSITORY:?Missing repository variable}"
          : "${SERVE_REPOSITORY:?Missing repository variable}"
          [[ "${TRAIN_REPOSITORY}" =~ ^[0-9]{12}\.dkr\.ecr\.us-east-1\.amazonaws\.com/[a-z0-9/_-]+$ ]]
          [[ "${EVAL_REPOSITORY}" =~ ^[0-9]{12}\.dkr\.ecr\.us-east-1\.amazonaws\.com/[a-z0-9/_-]+$ ]]
          [[ "${SERVE_REPOSITORY}" =~ ^[0-9]{12}\.dkr\.ecr\.us-east-1\.amazonaws\.com/[a-z0-9/_-]+$ ]]
          : > image-digests.txt
          context_hash="sha256:$(python - <<'PY'
          import hashlib
          import subprocess

          paths = sorted(
              path
              for path in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
              if path
          )
          digest = hashlib.sha256()
          for raw_path in paths:
              content = open(raw_path, "rb").read()
              digest.update(len(raw_path).to_bytes(8, "big"))
              digest.update(raw_path)
              digest.update(len(content).to_bytes(8, "big"))
              digest.update(content)
          print(digest.hexdigest())
          PY
          )"
          [[ "${context_hash}" =~ ^sha256:[0-9a-f]{64}$ ]]

          verify_remote_binding() {
            local repository="$1"
            local digest="$2"
            local dockerfile_hash="$3"
            docker pull "${repository}@${digest}" >/dev/null
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${repository}@${digest}")" = "${GITHUB_SHA}"
            test "$(docker image inspect --format '{{ index .Config.Labels "io.product-search.source-tree-sha256" }}' "${repository}@${digest}")" = "${context_hash}"
            test "$(docker image inspect --format '{{ index .Config.Labels "io.product-search.dockerfile-sha256" }}' "${repository}@${digest}")" = "${dockerfile_hash}"
          }

          for kind in train eval serve; do
            variable_name="${kind^^}_REPOSITORY"
            repository="${!variable_name}"
            tag="sha-${GITHUB_SHA}"
            repository_name="${repository#*/}"
            dockerfile_hash="sha256:$(sha256sum "Dockerfile.${kind}" | cut -d' ' -f1)"
            set +e
            aws ecr describe-images \
              --repository-name "${repository_name}" \
              --image-ids imageTag="${tag}" \
              > "${kind}-existing-image.json" 2> "${kind}-existing-image.error"
            existing_status=$?
            set -e
            if [[ "${existing_status}" -eq 0 ]]; then
              digest="$(jq -er '.imageDetails | if length == 1 then .[0].imageDigest else error("unexpected image count") end' "${kind}-existing-image.json")"
              verify_remote_binding "${repository}" "${digest}" "${dockerfile_hash}"
              echo "Reusing the exact immutable ${kind} image bound to this source tree."
            else
              grep -q 'ImageNotFoundException' "${kind}-existing-image.error" || {
                cat "${kind}-existing-image.error" >&2
                exit "${existing_status}"
              }
              docker build \
                --file "Dockerfile.${kind}" \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --label "io.product-search.source-tree-sha256=${context_hash}" \
                --label "io.product-search.dockerfile-sha256=${dockerfile_hash}" \
                --tag "${repository}:${tag}" .
              PYTHONPATH=src python scripts/validate_financial_snapshot.py emit --output /dev/null
              set +e
              docker push "${repository}:${tag}" > "${kind}-push.log" 2>&1
              push_status=$?
              set -e
              if [[ "${push_status}" -ne 0 ]]; then
                # An immutable-tag race is acceptable only when the winner has the exact labels.
                aws ecr describe-images \
                  --repository-name "${repository_name}" \
                  --image-ids imageTag="${tag}" \
                  > "${kind}-race-image.json" 2>/dev/null || {
                    cat "${kind}-push.log" >&2
                    exit "${push_status}"
                  }
                digest="$(jq -er '.imageDetails | if length == 1 then .[0].imageDigest else error("unexpected image count") end' "${kind}-race-image.json")"
              else
                digest="$(aws ecr describe-images \
                  --repository-name "${repository_name}" \
                  --image-ids imageTag="${tag}" \
                  --query 'imageDetails[0].imageDigest' \
                  --output text)"
              fi
              verify_remote_binding "${repository}" "${digest}" "${dockerfile_hash}"
            fi
            test "${digest#sha256:}" != "${digest}"
            printf '%s=%s\n' "${kind}" "${digest}" | tee -a image-digests.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-${{ github.sha }}
          path: image-digests.txt
          retention-days: 30
