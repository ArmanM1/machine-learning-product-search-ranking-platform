          cmp --silent previous-promotion-pointer.json current-pointer-before-activation.json
          test "$(jq -er '.ETag' current-pointer-before-activation-head.json)" = \
            "$(cat previous-promotion-pointer-etag.txt)"
          test "$(jq -er '.VersionId' current-pointer-before-activation-head.json)" = \
            "$(cat previous-promotion-pointer-version.txt)"

          activated=0
          printf '0' > pointer-advanced.txt
