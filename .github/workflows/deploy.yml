          [[ "${previous_version}" =~ ^[1-9][0-9]*$ ]]
          [[ "${candidate_version}" =~ ^[1-9][0-9]*$ ]]
          [[ "${previous_revision}" =~ ^[A-Za-z0-9-]{1,128}$ ]]
          printf '%s' "${previous_version}" > previous-lambda-version.txt
          printf '%s' "${previous_revision}" > previous-lambda-alias-revision.txt
          printf '%s' "${candidate_version}" > candidate-lambda-version.txt
          previous_static_release_id="$(jq -er '.release_id' previous-promotion-pointer.json)"
          [[ "${previous_static_release_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,99}$ ]]
          printf '%s' "${previous_static_release_id}" > previous-static-release-id.txt
