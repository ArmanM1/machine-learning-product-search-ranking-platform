          fi
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            restored-promotion-pointer.json >/dev/null
          cmp --silent previous-promotion-pointer.json restored-promotion-pointer.json
          aws lambda get-alias --function-name "${function_name}" --name production \
            > alias-after-automatic-rollback.json
          test "$(jq -er '.FunctionVersion' alias-after-automatic-rollback.json)" = \
            "$(cat previous-lambda-version.txt)"
          test "$(jq -er '.RevisionId' alias-after-automatic-rollback.json)" = \
            "$(cat workflow-restored-alias-revision.txt)"
          aws cloudfront create-invalidation \
            --distribution-id "$(cat cloudfront-distribution-id.txt)" \
            --paths "/*" >/dev/null
          jq -n \
            --arg failed_release "${RELEASE_ID}" \
            --arg restored_lambda_version "$(cat previous-lambda-version.txt)" \
            --arg restored_pointer_version "${restored_pointer_version}" \
            --arg service_disabled "$(if [[ "$(cat previous-index-present.txt)" == "1" ]]; then echo false; else echo true; fi)" \
            '{schema_version: "1.0.0", artifact_type: "automatic_deployment_rollback",
              status: "automatically_rolled_back", rollback_trigger: "production_verification_failed",
              failed_release_id: $failed_release,
              restored_lambda_version: $restored_lambda_version,
              restored_pointer_version_id: $restored_pointer_version,
              service_disabled: ($service_disabled == "true")}' > failed-deployment-rollback.json
          docker run --rm -i \
            --entrypoint /opt/search-rank-venv/bin/python \
            --mount "type=bind,source=$(pwd),target=/evidence,readonly" \
            "$(cat serving-image-uri.txt)" - <<'PY'
          from pathlib import Path

          from search_rank.schemas.workflow import AutomaticDeploymentRollback

          AutomaticDeploymentRollback.model_validate_json(
              Path("/evidence/failed-deployment-rollback.json").read_text(encoding="utf-8")
          )
          PY
          touch rollback-complete.txt
      - name: Refuse a release that failed production verification
        if: steps.production_verification.outcome == 'failure'
        run: |
          echo "Production verification failed and the prior healthy alias/static index/pointer were restored." >&2
          exit 1
      - name: Advance the live pointer only after production verification passes
        if: steps.production_verification.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            > pointer-before-advance-head.json
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            pointer-before-advance.json >/dev/null
          cmp --silent previous-promotion-pointer.json pointer-before-advance.json
          test "$(jq -er '.ETag' pointer-before-advance-head.json)" = \
            "$(cat previous-promotion-pointer-etag.txt)"
          test "$(jq -er '.VersionId' pointer-before-advance-head.json)" = \
            "$(cat previous-promotion-pointer-version.txt)"
          if [[ -f promotion-decision-version.txt ]]; then
            aws s3api head-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "promoted/decisions/${RELEASE_ID}.json" \
              > promotion-decision-before-advance-head.json
            test "$(jq -er '.ETag' promotion-decision-before-advance-head.json)" = \
              "$(cat promotion-decision-etag.txt)"
            test "$(jq -er '.VersionId' promotion-decision-before-advance-head.json)" = \
              "$(cat promotion-decision-version.txt)"
          fi
          docker run --rm -i \
            --entrypoint /opt/search-rank-venv/bin/python \
            --mount "type=bind,source=$(pwd),target=/evidence,readonly" \
            "$(cat serving-image-uri.txt)" - <<'PY'
          from pathlib import Path

          from search_rank.schemas.release import PromotionPointer

          root = Path("/evidence")
          PromotionPointer.model_validate_json(
              (root / "previous-promotion-pointer.json").read_text(encoding="utf-8")
          )
          PromotionPointer.model_validate_json(
              (root / "promotion-pointer.json").read_text(encoding="utf-8")
          )
          PY
          if [[ "$(cat pointer-requires-advance.txt)" == "1" ]]; then
            aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key promoted/current.json \
              --body promotion-pointer.json \
              --content-type application/json \
              --checksum-algorithm SHA256 \
              --tagging "RetentionClass=promoted" \
              --if-match "$(cat previous-promotion-pointer-etag.txt)" \
              > active-pointer-put.json
            printf '1' > pointer-advanced.txt
          fi
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            > active-promotion-pointer-head.json
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            active-promotion-pointer.json >/dev/null
          cmp --silent promotion-pointer.json active-promotion-pointer.json
          active_pointer_etag="$(jq -er '.ETag' active-promotion-pointer-head.json)"
          active_pointer_version="$(jq -er '.VersionId' active-promotion-pointer-head.json)"
          [[ "${active_pointer_etag}" =~ ^\"[0-9a-f]{32}\"$ ]]
          ((${#active_pointer_version} >= 1 && ${#active_pointer_version} <= 1024))
          [[ "${active_pointer_version}" =~ ^[A-Za-z0-9._=+/-]+$ ]]
          if [[ "$(cat pointer-advanced.txt)" == "1" ]]; then
            test "$(jq -er '.ETag' active-pointer-put.json)" = "${active_pointer_etag}"
            test "$(jq -er '.VersionId' active-pointer-put.json)" = "${active_pointer_version}"
          else
            test "${active_pointer_etag}" = "$(cat previous-promotion-pointer-etag.txt)"
            test "${active_pointer_version}" = "$(cat previous-promotion-pointer-version.txt)"
          fi
          printf '%s' "${active_pointer_etag}" > active-promotion-pointer-etag.txt
          printf '%s' "${active_pointer_version}" > active-promotion-pointer-version.txt
      - name: Publish deployment evidence only after production verification passes
        shell: bash
        run: |
          set -euo pipefail
          cloudfront_url="$(cat cloudfront-url.txt)"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 "${cloudfront_url}/readyz" > production-ready.json
          jq -e --arg model "${MODEL_ID}" '.status == "ready" and .model_id == $model' production-ready.json >/dev/null
          previous_version="$(cat previous-lambda-version.txt)"
          candidate_version="$(cat candidate-lambda-version.txt)"
          cloudfront_url="$(cat cloudfront-url.txt)"
          aws lambda get-alias \
            --function-name "$(cat lambda-function-name.txt)" \
            --name production > deployment-production-alias.json
          test "$(jq -er '.FunctionVersion' deployment-production-alias.json)" = \
            "${candidate_version}"
          test "$(jq -er '.RevisionId' deployment-production-alias.json)" = \
            "$(cat activated-lambda-alias-revision.txt)"
          aws lambda get-function \
            --function-name "$(cat lambda-function-name.txt)" \
            --qualifier "${candidate_version}" > deployment-production-function.json
          jq -e \
            --arg version "${candidate_version}" \
            --arg commit "${GITHUB_SHA}" \
            --arg nonce "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_ID}" \
            --arg image "$(cat serving-image-uri.txt)" \
            '.Configuration.Version == $version and
             .Configuration.Environment.Variables.SEARCH_RANK_SERVICE_VERSION == $commit and
             .Configuration.Environment.Variables.SEARCH_RANK_DEPLOYMENT_NONCE == $nonce and
             .Code.ResolvedImageUri == $image' \
            deployment-production-function.json >/dev/null
          serving_image_digest="$(cut -d@ -f2 serving-image-uri.txt)"
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            > deployment-pointer-head.json
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            deployment-pointer.json >/dev/null
          cmp --silent promotion-pointer.json deployment-pointer.json
          test "$(jq -er '.ETag' deployment-pointer-head.json)" = \
            "$(cat active-promotion-pointer-etag.txt)"
          pointer_version="$(jq -er '.VersionId' deployment-pointer-head.json)"
          test "${pointer_version}" = "$(cat active-promotion-pointer-version.txt)"
          jq -n \
            --arg release "${RELEASE_ID}" \
            --arg model "${MODEL_ID}" \
            --arg commit "${GITHUB_SHA}" \
            --arg image_digest "${serving_image_digest}" \
            --arg previous "${previous_version}" \
            --arg current "${candidate_version}" \
            --arg pointer "${pointer_version}" \
            --slurpfile controlled_cold_start candidate-cold-start.json \
            --slurpfile candidate_smoke candidate-smoke.json \
            --slurpfile production_smoke production-api-smoke.json \
            '{schema_version: "1.0.0", artifact_type: "deployment_evidence",
              release_id: $release, model_id: $model, code_commit: $commit,
              serving_image_digest: $image_digest,
              previous_lambda_version: $previous, production_lambda_version: $current,
              promoted_pointer_version_id: $pointer, smoke_tests_passed: true,
              controlled_cold_start: $controlled_cold_start[0],
              candidate_api_gate: $candidate_smoke[0], production_api_smoke: $production_smoke[0],
              browser_smoke: {desktop: true, mobile: true, keyboard: true}}' \
            > deployment-evidence.json
          docker run --rm -i \
            --entrypoint /opt/search-rank-venv/bin/python \
            --mount "type=bind,source=$(pwd),target=/evidence,readonly" \
            "$(cat serving-image-uri.txt)" - <<'PY'
          from pathlib import Path

          from pydantic import TypeAdapter

          from search_rank.schemas.api import (
              ComparisonResponse,
              CuratedQuerySummary,
              HealthResponse,
              ModelSummary,
              PublicEvidenceEnvelope,
              RankResponse,
              ReadyResponse,
          )
          from search_rank.schemas.performance import ColdStartEvidence
          from search_rank.schemas.workflow import (
              CandidateApiGate,
              DeploymentEvidence,
              SmokeTestEvidence,
          )

          root = Path("/evidence")
          HealthResponse.model_validate_json((root / "candidate-health.json").read_text())
          HealthResponse.model_validate_json((root / "staged-candidate-health.json").read_text())
          HealthResponse.model_validate_json((root / "production-health.json").read_text())
          ReadyResponse.model_validate_json((root / "candidate-ready.json").read_text())
          ReadyResponse.model_validate_json((root / "production-ready.json").read_text())
          TypeAdapter(list[ModelSummary]).validate_json(
              (root / "candidate-models.json").read_text()
          )
          TypeAdapter(list[CuratedQuerySummary]).validate_json(
              (root / "candidate-queries.json").read_text()
          )
          ComparisonResponse.model_validate_json(
              (root / "candidate-comparison.json").read_text()
          )
          PublicEvidenceEnvelope.model_validate_json((root / "candidate-run.json").read_text())
          RankResponse.model_validate_json((root / "candidate-cold-response.json").read_text())
          ColdStartEvidence.model_validate_json((root / "candidate-cold-start.json").read_text())
          CandidateApiGate.model_validate_json((root / "candidate-smoke.json").read_text())
          SmokeTestEvidence.model_validate_json((root / "production-api-smoke.json").read_text())
          DeploymentEvidence.model_validate_json((root / "deployment-evidence.json").read_text())
          PY
          deployment_key="public/${RELEASE_ID}/deployment-evidence.json"
          if [[ -f prior-deployment-evidence-absent.txt ]]; then
            aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${deployment_key}" \
              --body deployment-evidence.json \
              --content-type application/json \
              --checksum-algorithm SHA256 \
              --if-none-match '*' \
              > deployment-evidence-put.json
          else
            aws s3api head-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${deployment_key}" \
              > deployment-evidence-before-cas-head.json
            test "$(jq -er '.ETag' deployment-evidence-before-cas-head.json)" = \
              "$(cat prior-deployment-evidence-etag.txt)"
            test "$(jq -er '.VersionId' deployment-evidence-before-cas-head.json)" = \
              "$(cat prior-deployment-evidence-version.txt)"
            aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${deployment_key}" \
              --body deployment-evidence.json \
              --content-type application/json \
              --checksum-algorithm SHA256 \
              --if-match "$(cat prior-deployment-evidence-etag.txt)" \
              > deployment-evidence-put.json
          fi
          # A successful conditional PutObject is the commit boundary. All
          # validation happened before it, and no fallible command follows it;
          # S3 versioning preserves every prior successful deployment record.
      - name: Compensate any failure or cancellation after a production mutation
        if: failure() || cancelled()
        shell: bash
        run: |
          set -Eeuo pipefail
          function_name=""
          fail_closed_on_compensation_error() {
            local status=$?
            if [[ "${status}" -ne 0 ]]; then
              local target_function="${function_name}"
              if [[ -z "${target_function}" && -s lambda-function-name.txt ]]; then
                target_function="$(cat lambda-function-name.txt 2>/dev/null || true)"
              fi
              if [[ -n "${target_function}" ]]; then
                aws lambda put-function-concurrency \
                  --function-name "${target_function}" \
                  --reserved-concurrent-executions 0 >/dev/null 2>&1 || true
              fi
            fi
          }
          trap fail_closed_on_compensation_error EXIT
          disable_first_publication() {
            if [[ -f public-serving-creation-started.txt ]]; then
              function_name="$(cat lambda-function-name.txt)"
              aws lambda put-function-concurrency \
                --function-name "${function_name}" \
                --reserved-concurrent-executions 0 >/dev/null
              touch first-publication-service-disabled.txt
            fi
          }
          if [[ -f rollback-complete.txt ]]; then
            exit 0
          fi
          if [[ ! -f activation-started.txt ]]; then
            if [[ ! -f staged-canary-transition-started.txt || -f staged-canary-restored.txt ]]; then
              disable_first_publication
              exit 0
            fi
            function_name="$(cat lambda-function-name.txt)"
            previous_version="$(cat pre-staged-canary-version.txt)"
            previous_revision="$(cat pre-staged-canary-revision.txt)"
            candidate_version="$(cat staged-canary-candidate-version.txt)"
            expected_revision="$(cat staged-canary-active-revision.txt 2>/dev/null || true)"
            if [[ -z "${expected_revision}" && -f staged-canary-alias-active.json ]]; then
              expected_revision="$(jq -er '.RevisionId' staged-canary-alias-active.json)"
            fi
            safe_previous_revision="${previous_revision}"
            if [[ -f staged-canary-restored-revision.txt ]]; then
              safe_previous_revision="$(cat staged-canary-restored-revision.txt)"
            fi
            aws lambda get-alias --function-name "${function_name}" --name production \
              > canary-alias-before-final-compensation.json
            current_version="$(jq -er '.FunctionVersion' canary-alias-before-final-compensation.json)"
            current_revision="$(jq -er '.RevisionId' canary-alias-before-final-compensation.json)"
            if [[ "${current_version}" == "${candidate_version}" && \
              "${current_revision}" == "${expected_revision}" ]]; then
              aws lambda update-alias \
                --function-name "${function_name}" \
                --name production \
                --function-version "${previous_version}" \
                --revision-id "${current_revision}" \
                > canary-alias-final-compensation.json
              test "$(jq -er '.FunctionVersion' canary-alias-final-compensation.json)" = \
                "${previous_version}"
              safe_previous_revision="$(jq -er '.RevisionId' canary-alias-final-compensation.json)"
              printf '%s' "${safe_previous_revision}" > staged-canary-restored-revision.txt
            elif [[ "${current_version}" == "${previous_version}" && \
              "${current_revision}" == "${safe_previous_revision}" ]]; then
              :
            else
              aws lambda put-function-concurrency --function-name "${function_name}" \
                --reserved-concurrent-executions 0 >/dev/null 2>&1 || true
              echo "Production alias changed concurrently; refusing unsafe canary compensation." >&2
              exit 1
            fi
            aws lambda get-alias --function-name "${function_name}" --name production \
              > canary-alias-after-final-compensation.json
            test "$(jq -er '.FunctionVersion' canary-alias-after-final-compensation.json)" = \
              "${previous_version}"
            test "$(jq -er '.RevisionId' canary-alias-after-final-compensation.json)" = \
              "${safe_previous_revision}"
            if [[ -f staged-canary-service-disabled.txt ]]; then
              aws lambda put-function-concurrency \
                --function-name "${function_name}" \
                --reserved-concurrent-executions 2 >/dev/null
            fi
            touch staged-canary-restored.txt
            disable_first_publication
            exit 0
          fi
          function_name="$(cat lambda-function-name.txt)"
          previous_version="$(cat previous-lambda-version.txt)"
          previous_revision="$(cat previous-lambda-alias-revision.txt)"
          candidate_version="$(cat candidate-lambda-version.txt)"
          expected_active_revision="$(cat activated-lambda-alias-revision.txt 2>/dev/null || true)"
          if [[ -z "${expected_active_revision}" && -f activated-lambda-alias.json ]]; then
            expected_active_revision="$(jq -er '.RevisionId' activated-lambda-alias.json)"
          fi
          safe_previous_revision="${previous_revision}"
          if [[ -f workflow-restored-alias-revision.txt ]]; then
            safe_previous_revision="$(cat workflow-restored-alias-revision.txt)"
          fi
          aws lambda get-alias --function-name "${function_name}" --name production \
            > alias-before-final-compensation.json
          current_version="$(jq -er '.FunctionVersion' alias-before-final-compensation.json)"
          current_revision="$(jq -er '.RevisionId' alias-before-final-compensation.json)"
          if [[ "${current_version}" == "${candidate_version}" && \
            "${current_revision}" == "${expected_active_revision}" ]]; then
            aws lambda update-alias \
              --function-name "${function_name}" \
              --name production \
              --function-version "${previous_version}" \
              --revision-id "${current_revision}" > alias-final-compensation-result.json
            test "$(jq -er '.FunctionVersion' alias-final-compensation-result.json)" = \
              "${previous_version}"
            safe_previous_revision="$(jq -er '.RevisionId' alias-final-compensation-result.json)"
            printf '%s' "${safe_previous_revision}" > workflow-restored-alias-revision.txt
          elif [[ "${current_version}" == "${previous_version}" && \
            "${current_revision}" == "${safe_previous_revision}" ]]; then
            :
          else
            aws lambda put-function-concurrency --function-name "${function_name}" \
              --reserved-concurrent-executions 0 >/dev/null 2>&1 || true
            echo "Production alias changed concurrently; refusing unsafe final compensation." >&2
            exit 1
          fi
          if [[ "$(cat previous-index-present.txt)" == "1" ]]; then
            aws s3 sync \
              "s3://${SITE_BUCKET}/releases/$(cat previous-static-release-id.txt)/" \
              "s3://${SITE_BUCKET}/" \
              --delete --exclude "releases/*" --exclude "index.html" --no-progress
            aws s3 cp previous-index.html "s3://${SITE_BUCKET}/index.html" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --content-type "text/html" \
              --metadata-directive REPLACE \
              --no-progress
          else
            aws s3 rm "s3://${SITE_BUCKET}/index.html" --no-progress
            aws lambda put-function-concurrency \
              --function-name "${function_name}" \
              --reserved-concurrent-executions 0 >/dev/null
          fi

          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            > pointer-before-final-compensation-head.json
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            pointer-before-final-compensation.json >/dev/null
          if cmp --silent previous-promotion-pointer.json pointer-before-final-compensation.json; then
            restored_pointer_version="$(jq -er '.VersionId' pointer-before-final-compensation-head.json)"
          else
            if ! cmp --silent promotion-pointer.json pointer-before-final-compensation.json; then
              echo "Live promotion pointer is neither the prior nor candidate pointer; refusing unsafe compensation." >&2
              exit 1
            fi
            docker run --rm -i \
              --entrypoint /opt/search-rank-venv/bin/python \
              --mount "type=bind,source=$(pwd),target=/evidence,readonly" \
              "$(cat serving-image-uri.txt)" - <<'PY'
          from pathlib import Path

          from search_rank.schemas.release import PromotionPointer

          PromotionPointer.model_validate_json(
              Path("/evidence/previous-promotion-pointer.json").read_text(encoding="utf-8")
          )
          PY
            aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key promoted/current.json \
              --body previous-promotion-pointer.json \
              --content-type application/json \
              --checksum-algorithm SHA256 \
              --tagging "RetentionClass=promoted" \
              --if-match "$(jq -er '.ETag' pointer-before-final-compensation-head.json)" \
              > final-pointer-restore.json
            restored_pointer_version="$(jq -er '.VersionId' final-pointer-restore.json)"
          fi
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            pointer-after-final-compensation.json >/dev/null
          cmp --silent previous-promotion-pointer.json pointer-after-final-compensation.json
          aws lambda get-alias --function-name "${function_name}" --name production \
            > alias-after-final-compensation.json
          test "$(jq -er '.FunctionVersion' alias-after-final-compensation.json)" = \
            "${previous_version}"
          test "$(jq -er '.RevisionId' alias-after-final-compensation.json)" = \
            "${safe_previous_revision}"
          aws cloudfront create-invalidation \
            --distribution-id "$(cat cloudfront-distribution-id.txt)" \
            --paths "/*" >/dev/null
          if [[ ! -f failed-deployment-rollback.json ]]; then
            jq -n \
              --arg failed_release "${RELEASE_ID}" \
              --arg restored_lambda_version "${previous_version}" \
              --arg restored_pointer_version "${restored_pointer_version}" \
              --arg service_disabled "$(if [[ "$(cat previous-index-present.txt)" == "1" ]]; then echo false; else echo true; fi)" \
              '{schema_version: "1.0.0", artifact_type: "automatic_deployment_rollback",
                status: "automatically_rolled_back", rollback_trigger: "post_activation_failure",
                failed_release_id: $failed_release,
                restored_lambda_version: $restored_lambda_version,
                restored_pointer_version_id: $restored_pointer_version,
                service_disabled: ($service_disabled == "true")}' \
              > failed-deployment-rollback.json
          fi
          docker run --rm -i \
            --entrypoint /opt/search-rank-venv/bin/python \
            --mount "type=bind,source=$(pwd),target=/evidence,readonly" \
            "$(cat serving-image-uri.txt)" - <<'PY'
          from pathlib import Path

          from search_rank.schemas.workflow import AutomaticDeploymentRollback

          AutomaticDeploymentRollback.model_validate_json(
              Path("/evidence/failed-deployment-rollback.json").read_text(encoding="utf-8")
          )
          PY
          touch rollback-complete.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: |
            candidate-health.json
            candidate-ready.json
            candidate-models.json
            candidate-queries.json
            candidate-comparison.json
            candidate-run.json
            candidate-cold-start.json
            candidate-cold-response.json
            candidate-rank-samples.tsv
            candidate-smoke.json
            candidate-static-desktop.png
            candidate-static-mobile.png
            staged-candidate-health.json
            production-api-smoke.json
            production-health.json
            production-browser-desktop.png
            production-browser-mobile.png
            production-static-verification.json
            production-ready.json
            deployment-evidence.json
            failed-deployment-rollback.json
            promotion-pointer.json
            previous-promotion-pointer.json
            active-promotion-pointer.json
          if-no-files-found: warn
          retention-days: 90

  rollback:
    if: github.ref == 'refs/heads/main' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      ROLLBACK_LAMBDA_VERSION: ${{ inputs.rollback_lambda_version }}
      ROLLBACK_POINTER_VERSION: ${{ inputs.rollback_model_pointer_version_id }}
      AUTHORIZATION: ${{ inputs.authorization }}
      ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      SITE_BUCKET: ${{ vars.AWS_SITE_BUCKET }}
      SERVE_REPOSITORY: ${{ vars.AWS_SERVE_ECR_REPOSITORY_URL }}
      LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      CLOUDFRONT_URL: ${{ vars.AWS_CLOUDFRONT_URL }}
      CAMPAIGN_SPEND_TO_DATE_USD: ${{ secrets.AWS_CAMPAIGN_SPEND_TO_DATE_USD }}
      REMAINING_APPLICABLE_CREDIT_USD: ${{ secrets.AWS_REMAINING_APPLICABLE_CREDIT_USD }}
      FINANCIAL_SNAPSHOT_OBSERVED_AT: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_OBSERVED_AT }}
      FINANCIAL_SNAPSHOT_RECEIPT_SHA256: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_RECEIPT_SHA256 }}
      FINANCIAL_SNAPSHOT_HMAC_KEY: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_HMAC_KEY }}
      FINANCIAL_RESERVATION_MAX_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_MAX_USD }}
      FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD }}
      FINANCIAL_RESERVATION_CPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_CPU_HOURS }}
      FINANCIAL_RESERVATION_GPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_GPU_HOURS }}
      FINANCIAL_CPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_CPU_HOURS_USED_TO_DATE }}
      FINANCIAL_GPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_GPU_HOURS_USED_TO_DATE }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_WORKFLOW: deploy
      FINANCIAL_SNAPSHOT_AUTHORIZATION_INPUTS_JSON: ${{ toJSON(inputs) }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_COMMIT_SHA: ${{ github.sha }}
      FINANCIAL_SNAPSHOT_SOURCE: "aws_billing_and_cost_management_console"
      FINANCIAL_SNAPSHOT_MAX_AGE_SECONDS: "21600"
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the protected AWS mutation gate
        shell: bash
        run: |
          set -euo pipefail
          gate_dir="${RUNNER_TEMP}/financial-aws-gate"
          mkdir -p "${gate_dir}"
          install -m 0755 scripts/aws_financial_gate.sh "${gate_dir}/aws"
          printf 'REAL_AWS_CLI=%s\n' "$(command -v aws)" >> "${GITHUB_ENV}"
          printf '%s\n' "${gate_dir}" >> "${GITHUB_PATH}"
      - name: Prepare rollback browser verification
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate explicit rollback target
        shell: bash
        run: |
          set -euo pipefail
          test "${AUTHORIZATION}" = "ROLL BACK PUBLIC AWS DEMO"
          test "${ALLOW_HELDOUT_EVAL}" = "0"
          [[ "${RELEASE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,62}$ ]]
          [[ "${ROLLBACK_LAMBDA_VERSION}" =~ ^[1-9][0-9]*$ ]]
          ((${#ROLLBACK_POINTER_VERSION} >= 1 && ${#ROLLBACK_POINTER_VERSION} <= 1024))
          [[ "${ROLLBACK_POINTER_VERSION}" =~ ^[A-Za-z0-9._=+/-]+$ ]]
          : "${ARTIFACT_BUCKET:?Missing AWS_ARTIFACT_BUCKET variable}"
          : "${SITE_BUCKET:?Missing AWS_SITE_BUCKET variable}"
          : "${SERVE_REPOSITORY:?Missing AWS_SERVE_ECR_REPOSITORY_URL variable}"
          : "${LAMBDA_FUNCTION_NAME:?Missing AWS_LAMBDA_FUNCTION_NAME variable}"
          : "${CLOUDFRONT_DISTRIBUTION_ID:?Missing AWS_CLOUDFRONT_DISTRIBUTION_ID variable}"
          : "${CLOUDFRONT_URL:?Missing AWS_CLOUDFRONT_URL variable}"
          python - <<'PY'
          import os
          from decimal import Decimal, InvalidOperation

          from scripts.validate_financial_reservation import validate_reservation_coverage

          def amount(name: str) -> Decimal:
              try:
                  value = Decimal(os.environ[name])
              except (InvalidOperation, KeyError) as exc:
                  raise SystemExit(f"{name} must be a decimal number") from exc
              if not value.is_finite() or value < 0:
                  raise SystemExit(f"{name} must be finite and non-negative")
              return value

          rollback_allowance = Decimal("0.10")
          if amount("MAXIMUM_OUT_OF_POCKET_USD") != 0:
              raise SystemExit("Out-of-pocket limit must remain zero")
          if amount("CAMPAIGN_SPEND_TO_DATE_USD") + rollback_allowance > amount("CAMPAIGN_BUDGET_USD"):
              raise SystemExit("Rollback requests would breach the campaign envelope")
          if amount("REMAINING_APPLICABLE_CREDIT_USD") < rollback_allowance + amount("REQUIRED_CREDIT_RESERVE_USD"):
              raise SystemExit("Applicable credit cannot cover rollback requests and reserve")
          validate_reservation_coverage(
              os.environ,
              required_max_usd=rollback_allowance,
              required_remaining_committed_usd=0,
              required_cpu_hours=0,
              required_gpu_hours=0,
          )
          print("Rollback cost guard passed with a conservative USD 0.10 request allowance.")
          PY
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-rollback-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Atomically reserve the signed campaign capacity
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Missing AWS_TERRAFORM_STATE_BUCKET variable}"
          python -m pip install --disable-pip-version-check pydantic==2.13.5 PyYAML==6.0.3
          PYTHONPATH=src python scripts/reserve_financial_capacity.py reserve \
            --bucket "${TF_STATE_BUCKET}" \
            --output financial-capacity-reservation.json
      - name: Restore model pointer, Lambda alias, and static release
        shell: bash
        run: |
          set -Eeuo pipefail

          # Resolve and cross-bind every target object before changing any live state.
          aws lambda get-function \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --qualifier "${ROLLBACK_LAMBDA_VERSION}" \
            > rollback-target-function.json
          aws lambda get-alias \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --name production > pre-manual-rollback-alias.json
          current_version="$(jq -er '.FunctionVersion' pre-manual-rollback-alias.json)"
          current_alias_revision="$(jq -er '.RevisionId' pre-manual-rollback-alias.json)"
          [[ "${current_version}" =~ ^[1-9][0-9]*$ ]]
          [[ "${current_alias_revision}" =~ ^[A-Za-z0-9-]{1,128}$ ]]
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            > pre-manual-rollback-pointer-head.json
          previous_pointer_version="$(jq -er '.VersionId' pre-manual-rollback-pointer-head.json)"
          previous_pointer_etag="$(jq -er '.ETag' pre-manual-rollback-pointer-head.json)"
          ((${#previous_pointer_version} >= 1 && ${#previous_pointer_version} <= 1024))
          [[ "${previous_pointer_version}" =~ ^[A-Za-z0-9._=+/-]+$ ]]
          [[ "${previous_pointer_etag}" =~ ^\"[0-9a-f]{32}\"$ ]]
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            --version-id "${previous_pointer_version}" \
            pre-manual-rollback-pointer.json \
            > pre-manual-rollback-pointer-get.json
          jq -e \
            --arg version "${previous_pointer_version}" \
            --arg etag "${previous_pointer_etag}" \
            '.VersionId == $version and .ETag == $etag' \
            pre-manual-rollback-pointer-get.json >/dev/null
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            --version-id "${ROLLBACK_POINTER_VERSION}" \
            rollback-current.json > rollback-pointer-get.json
          jq -e --arg version "${ROLLBACK_POINTER_VERSION}" \
            '.VersionId == $version' rollback-pointer-get.json >/dev/null
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "public/${RELEASE_ID}/deployment-evidence.json" \
            > rollback-deployment-evidence-head.json
          rollback_deployment_version="$(jq -er '.VersionId' rollback-deployment-evidence-head.json)"
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "public/${RELEASE_ID}/deployment-evidence.json" \
            --version-id "${rollback_deployment_version}" \
            rollback-deployment-evidence.json \
            > rollback-deployment-evidence-get.json
          jq -e --arg version "${rollback_deployment_version}" \
            '.VersionId == $version' rollback-deployment-evidence-get.json >/dev/null
          jq -e --arg release "${RELEASE_ID}" \
            '.release_id == $release and (.model_id | type == "string" and length > 0) and
             ((.evidence_mode == "validation_only" and
               .bundle_s3_key == ("promoted/" + .model_id + "/")) or
              (.evidence_mode == "verified" and
               .bundle_s3_key == ("promoted/releases/" + .release_id + "/")))' \
            rollback-current.json >/dev/null
          rollback_model_id="$(jq -r '.model_id' rollback-current.json)"
          rollback_bundle_key="$(jq -er '.bundle_s3_key' rollback-current.json)"
          [[ "${rollback_bundle_key}" =~ ^promoted/[A-Za-z0-9._@/-]+/$ ]]
          [[ "${rollback_bundle_key}" != *".."* ]]
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${rollback_bundle_key}release-manifest.json" \
            rollback-target-release-manifest.json >/dev/null
          previous_release_id="$(jq -er '.release_id' pre-manual-rollback-pointer.json)"
          aws s3api head-object \
            --bucket "${SITE_BUCKET}" \
            --key "releases/${RELEASE_ID}/index.html" \
            > rollback-target-index-head.json
          aws s3api head-object \
            --bucket "${SITE_BUCKET}" \
            --key "releases/${previous_release_id}/index.html" \
            > pre-manual-rollback-index-head.json
          mkdir rollback-target-static
          aws s3 sync \
            "s3://${SITE_BUCKET}/releases/${RELEASE_ID}/" \
            rollback-target-static/ --no-progress
          test -f rollback-target-static/index.html
          cp rollback-target-static/index.html rollback-target-index.html
          aws s3api list-objects-v2 \
            --bucket "${SITE_BUCKET}" \
            --prefix "releases/${RELEASE_ID}/" > rollback-target-static-objects.json
          aws s3 cp \
            "s3://${SITE_BUCKET}/index.html" \
            pre-manual-rollback-index.html --no-progress
          uv run --frozen --no-dev python - <<'PY'
          import json
          import os
          from pathlib import Path

          from search_rank.schemas.evidence import ReleaseManifest
          from search_rank.schemas.release import PromotionPointer
          from search_rank.schemas.workflow import DeploymentEvidence

          previous = PromotionPointer.model_validate_json(
              Path("pre-manual-rollback-pointer.json").read_text(encoding="utf-8")
          )
          target = PromotionPointer.model_validate_json(
              Path("rollback-current.json").read_text(encoding="utf-8")
          )
          deployment = DeploymentEvidence.model_validate_json(
              Path("rollback-deployment-evidence.json").read_text(encoding="utf-8")
          )
          release = ReleaseManifest.model_validate_json(
              Path("rollback-target-release-manifest.json").read_text(encoding="utf-8")
          )
          static_response = json.loads(
              Path("rollback-target-static-objects.json").read_text(encoding="utf-8")
          )
          if static_response.get("IsTruncated"):
              raise SystemExit("manual rollback target static inventory was truncated")
          expected_static = {
              item["Key"].removeprefix(f"releases/{os.environ['RELEASE_ID']}/")
              for item in static_response.get("Contents", [])
              if isinstance(item, dict) and isinstance(item.get("Key"), str)
          }
          static_root = Path("rollback-target-static")
          observed_static = {
              path.relative_to(static_root).as_posix()
              for path in static_root.rglob("*")
              if path.is_file()
          }
          if not expected_static or observed_static != expected_static:
              raise SystemExit("manual rollback target static inventory differs from S3")
          function = json.loads(Path("rollback-target-function.json").read_text(encoding="utf-8"))
          configuration = function.get("Configuration", {})
          code = function.get("Code", {})
          environment = configuration.get("Environment", {}).get("Variables", {})
          resolved_image = code.get("ResolvedImageUri")
          expected_release = os.environ["RELEASE_ID"]
          expected_version = os.environ["ROLLBACK_LAMBDA_VERSION"]
          expected_pointer_version = os.environ["ROLLBACK_POINTER_VERSION"]
          expected_function = os.environ["LAMBDA_FUNCTION_NAME"]
          expected_image = os.environ["SERVE_REPOSITORY"] + "@" + deployment.serving_image_digest
          bindings = {
              "target pointer release": target.release_id == expected_release,
              "deployment release": deployment.release_id == target.release_id,
              "deployment model": deployment.model_id == target.model_id,
              "release manifest release": release.release_id == target.release_id,
              "release manifest model": release.promoted_model_id == target.model_id,
              "release manifest evidence mode": release.evidence_mode == target.evidence_mode,
              "release manifest evaluation": (
                  release.evaluation_report_id == target.evaluation_report_id
              ),
              "deployment pointer version": (
                  deployment.promoted_pointer_version_id == expected_pointer_version
              ),
              "deployment Lambda version": deployment.production_lambda_version == expected_version,
              "queried Lambda version": configuration.get("Version") == expected_version,
              "release bundle Git SHA": release.git_sha == target.git_sha,
              "live service Git SHA": (
                  environment.get("SEARCH_RANK_SERVICE_VERSION") == deployment.code_commit
              ),
              "resolved image URI": resolved_image == expected_image,
              "cold-start function": (
                  deployment.controlled_cold_start.identifiers.function_name == expected_function
              ),
              "previous pointer release is restorable": bool(previous.release_id),
          }
          failures = [name for name, matches in bindings.items() if not matches]
          if failures:
              raise SystemExit("manual rollback target binding failed: " + ", ".join(failures))
          PY

          transition_started=0
          restore_previous_state() {
            local original_status="$1"
            local restoration_failed=0
            local alias_restoration_safe=0
            local active_pointer_version
            local active_pointer_etag
            local active_alias_version
            local active_alias_revision
            local expected_transition_revision
            trap - EXIT
            trap '' INT TERM
            set +e
            if [[ "${transition_started}" -eq 1 ]]; then
              if aws lambda get-alias \
                --function-name "${LAMBDA_FUNCTION_NAME}" \
                --name production > manual-alias-before-compensation.json; then
                active_alias_version="$(jq -er '.FunctionVersion' manual-alias-before-compensation.json)" \
                  || restoration_failed=1
                active_alias_revision="$(jq -er '.RevisionId' manual-alias-before-compensation.json)" \
                  || restoration_failed=1
                expected_transition_revision="$(cat manual-rollback-active-alias-revision.txt 2>/dev/null || true)"
                if [[ -z "${expected_transition_revision}" && \
                  -f manual-rollback-active-alias.json ]]; then
                  expected_transition_revision="$(jq -er '.RevisionId' manual-rollback-active-alias.json)" \
                    || restoration_failed=1
                fi
                if [[ "${restoration_failed}" -eq 0 && \
                  "${active_alias_version}" == "${current_version}" && \
                  "${active_alias_revision}" == "${current_alias_revision}" ]]; then
                  alias_restoration_safe=1
                elif [[ "${restoration_failed}" -eq 0 && \
                  "${active_alias_version}" == "${ROLLBACK_LAMBDA_VERSION}" && \
                  -n "${expected_transition_revision}" && \
                  "${active_alias_revision}" == "${expected_transition_revision}" ]]; then
                  aws lambda update-alias \
                    --function-name "${LAMBDA_FUNCTION_NAME}" \
                    --name production \
                    --function-version "${current_version}" \
                    --revision-id "${active_alias_revision}" \
                    > manual-alias-compensation-result.json \
                    || restoration_failed=1
                  if [[ "${restoration_failed}" -eq 0 ]]; then
                    test "$(jq -er '.FunctionVersion' manual-alias-compensation-result.json)" = \
                      "${current_version}" || restoration_failed=1
                    test -n "$(jq -er '.RevisionId' manual-alias-compensation-result.json)" \
                      || restoration_failed=1
                    if [[ "${restoration_failed}" -eq 0 ]]; then
                      alias_restoration_safe=1
                    fi
                  fi
                else
                  echo "Production alias changed concurrently; compensation refused to overwrite it." >&2
                  restoration_failed=1
                fi
              else
                restoration_failed=1
              fi
              if [[ "${alias_restoration_safe}" -eq 1 ]]; then
                aws s3 sync \
                  "s3://${SITE_BUCKET}/releases/${previous_release_id}/" \
                  "s3://${SITE_BUCKET}/" \
                  --delete --exclude "releases/*" --exclude "index.html" --no-progress \
                  || restoration_failed=1
                aws s3 cp pre-manual-rollback-index.html \
                  "s3://${SITE_BUCKET}/index.html" \
                  --cache-control "no-cache, no-store, must-revalidate" \
                  --content-type "text/html" \
                  --metadata-directive REPLACE \
                  --no-progress \
                  || restoration_failed=1

                if aws s3api head-object \
                  --bucket "${ARTIFACT_BUCKET}" \
                  --key promoted/current.json \
                  > compensation-pointer-head.json; then
                  active_pointer_version="$(jq -er '.VersionId' compensation-pointer-head.json)"
                  active_pointer_etag="$(jq -er '.ETag' compensation-pointer-head.json)"
                  if aws s3api get-object \
                    --bucket "${ARTIFACT_BUCKET}" \
                    --key promoted/current.json \
                    --version-id "${active_pointer_version}" \
                    compensation-active-pointer.json >/dev/null; then
                    if cmp --silent rollback-current.json compensation-active-pointer.json; then
                      aws s3api put-object \
                        --bucket "${ARTIFACT_BUCKET}" \
                        --key promoted/current.json \
                        --body pre-manual-rollback-pointer.json \
                        --content-type application/json \
                        --checksum-algorithm SHA256 \
                        --tagging "RetentionClass=promoted" \
                        --if-match "${active_pointer_etag}" \
                        > compensation-pointer-put.json \
                        || restoration_failed=1
                    elif ! cmp --silent \
                      pre-manual-rollback-pointer.json compensation-active-pointer.json; then
                      echo "Live promotion pointer changed concurrently; compensation refused to overwrite it." >&2
                      restoration_failed=1
                    fi
                  else
                    restoration_failed=1
                  fi
                else
                  restoration_failed=1
                fi
                aws cloudfront create-invalidation \
                  --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
                  --paths "/*" >/dev/null \
                  || restoration_failed=1
              else
                restoration_failed=1
              fi
            fi
            if [[ "${restoration_failed}" -ne 0 ]]; then
              aws lambda put-function-concurrency \
                --function-name "${LAMBDA_FUNCTION_NAME}" \
                --reserved-concurrent-executions 0 >/dev/null 2>&1 || true
              echo "Manual rollback failed and compensating restoration was incomplete." >&2
            fi
            exit "${original_status}"
          }
          trap 'restore_previous_state "$?"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # The pointer remains unchanged until the target alias/static release pass smoke.
          PYTHONPATH=src uv run --frozen --no-dev python \
            scripts/validate_financial_snapshot.py emit --output /dev/null
          transition_started=1
          aws lambda update-alias \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --name production \
            --function-version "${ROLLBACK_LAMBDA_VERSION}" \
            --revision-id "${current_alias_revision}" > manual-rollback-active-alias.json
          test "$(jq -er '.FunctionVersion' manual-rollback-active-alias.json)" = \
            "${ROLLBACK_LAMBDA_VERSION}"
          manual_active_revision="$(jq -er '.RevisionId' manual-rollback-active-alias.json)"
          [[ "${manual_active_revision}" =~ ^[A-Za-z0-9-]{1,128}$ ]]
          printf '%s' "${manual_active_revision}" > manual-rollback-active-alias-revision.txt
          aws s3 sync \
            "s3://${SITE_BUCKET}/releases/${RELEASE_ID}/" \
            "s3://${SITE_BUCKET}/" \
            --exclude "index.html" --no-progress
          aws s3 cp "s3://${SITE_BUCKET}/releases/${RELEASE_ID}/index.html" "s3://${SITE_BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html" \
            --metadata-directive REPLACE \
            --no-progress
          rollback_root_readback="$(mktemp -d)"
          while IFS= read -r -d '' source_file; do
            relative="${source_file#rollback-target-static/}"
            [[ "${relative}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,1023}$ ]]
            [[ "${relative}" != releases/* && "${relative}" != *".."* ]]
            mkdir -p "${rollback_root_readback}/$(dirname "${relative}")"
            aws s3api get-object \
              --bucket "${SITE_BUCKET}" \
              --key "${relative}" \
              --checksum-mode ENABLED \
              "${rollback_root_readback}/${relative}" >/dev/null
            cmp -s "${source_file}" "${rollback_root_readback}/${relative}"
          done < <(find rollback-target-static -type f -print0 | sort -z)
          aws s3api list-objects-v2 \
            --bucket "${SITE_BUCKET}" > rollback-root-before-cleanup.json
          python scripts/static_root_manifest.py plan \
            --source-root rollback-target-static \
            --inventory rollback-root-before-cleanup.json \
            --output rollback-stale-root-keys.json
          while IFS= read -r stale_key; do
            [[ "${stale_key}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,1023}$ ]]
            [[ "${stale_key}" != releases/* && "${stale_key}" != *".."* ]]
            aws s3api delete-object \
              --bucket "${SITE_BUCKET}" \
              --key "${stale_key}" >/dev/null
          done < <(jq -r '.[]' rollback-stale-root-keys.json)
          aws s3api list-objects-v2 \
            --bucket "${SITE_BUCKET}" > rollback-root-after-cleanup.json
          python scripts/static_root_manifest.py verify \
            --source-root rollback-target-static \
            --inventory rollback-root-after-cleanup.json
          rm -rf -- "${rollback_root_readback}"
          aws s3 cp "s3://${SITE_BUCKET}/index.html" active-manual-rollback-index.html --no-progress
          cmp --silent rollback-target-index.html active-manual-rollback-index.html
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" >/dev/null
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          public_index_ready=0
          for _ in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --header "Cache-Control: no-cache" \
              "${CLOUDFRONT_URL}/index.html" > rollback-public-index.html \
              && cmp --silent rollback-target-index.html rollback-public-index.html; then
              public_index_ready=1
              break
            fi
            sleep 10
          done
          test "${public_index_ready}" -eq 1
          export ROLLBACK_STATIC_ORIGIN="${CLOUDFRONT_URL}" RELEASE_ID
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          uv run --frozen --no-dev python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path("rollback-target-static")
          files = sorted(path for path in root.rglob("*") if path.is_file())
          if not files:
              raise SystemExit("rollback static verification found no target files")
          index_path = root / "index.html"
          if not index_path.is_file():
              raise SystemExit("rollback static verification found no index.html")
          targets = [
              (path.relative_to(root).as_posix(), path)
              for path in files
          ] + [("<root>", index_path)]
          failures: list[str] = []
          for attempt in range(1, 13):
              failures = []
              for relative, path in targets:
                  suffix = "" if relative == "<root>" else urllib.parse.quote(relative, safe="/")
                  url = os.environ["ROLLBACK_STATIC_ORIGIN"].rstrip("/") + "/" + suffix
                  request = urllib.request.Request(
                      url,
                      headers={"Cache-Control": "no-cache", "User-Agent": "rollback-static-verify/1.0"},
                  )
                  expected = path.read_bytes()
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          observed = response.read(len(expected) + 1)
                  except (OSError, urllib.error.URLError) as error:
                      failures.append(f"{relative}: {error}")
                      continue
                  if observed != expected:
                      failures.append(f"{relative}: CloudFront bytes differ")
              if not failures:
                  break
              if attempt < 12:
                  time.sleep(10)
          if failures:
              raise SystemExit("rollback static verification failed: " + "; ".join(failures))
          inventory = {
              path.relative_to(root).as_posix(): "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              for path in files
          }
          digest = hashlib.sha256(
              json.dumps(inventory, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          Path("rollback-static-verification.json").write_text(
              json.dumps(
                  {
                      "schema_version": "1.0.0",
                      "release_id": os.environ["RELEASE_ID"],
                      "file_count": len(files),
                      "inventory_sha256": "sha256:" + digest,
                      "cloudfront_bytes_verified": True,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 \
            "${CLOUDFRONT_URL}/healthz" > rollback-health.json
          jq -e --arg version "$(jq -er '.code_commit' rollback-deployment-evidence.json)" \
            '.status == "ok" and .service_version == $version' rollback-health.json >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 "${CLOUDFRONT_URL}/readyz" > rollback-ready.json
          jq -e --arg model "${rollback_model_id}" \
            '.status == "ready" and .model_id == $model' rollback-ready.json >/dev/null
          uv run --frozen --no-dev python scripts/smoke_test.py \
            "${CLOUDFRONT_URL}" --repeat 5 --output rollback-api-smoke.json
          jq -e \
            --arg model "${rollback_model_id}" \
            --arg candidate "$(jq -er '.production_api_smoke.evaluated_candidate_model_id' rollback-deployment-evidence.json)" \
            '.status == "passed" and .model_id == $model and
             .evaluated_candidate_model_id == $candidate and .error_count == 0' \
            rollback-api-smoke.json >/dev/null
          uv run --frozen --no-dev python - <<'PY'
          from pathlib import Path

          from search_rank.schemas.api import HealthResponse, ReadyResponse
          from search_rank.schemas.workflow import SmokeTestEvidence

          HealthResponse.model_validate_json(Path("rollback-health.json").read_text(encoding="utf-8"))
          ReadyResponse.model_validate_json(Path("rollback-ready.json").read_text(encoding="utf-8"))
          SmokeTestEvidence.model_validate_json(
              Path("rollback-api-smoke.json").read_text(encoding="utf-8")
          )
          PY
          ROLLBACK_EVIDENCE_MODE="$(jq -er '.evidence_mode' rollback-current.json)"
          if jq -e 'any(.models[]; .kind == "fine_tuned")' \
            rollback-target-release-manifest.json >/dev/null; then
            ROLLBACK_HAS_FINE_TUNED_CANDIDATE=1
          else
            ROLLBACK_HAS_FINE_TUNED_CANDIDATE=0
          fi
          export ROLLBACK_EVIDENCE_MODE ROLLBACK_HAS_FINE_TUNED_CANDIDATE
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          node - <<'JS'
          const { chromium } = require('./web/node_modules/playwright')

          const expectedStatusByMode = {
            verified: 'Verified release',
            validation_only: 'Validation-only evidence',
          }
          const expectedStatus = expectedStatusByMode[process.env.ROLLBACK_EVIDENCE_MODE]
          if (!expectedStatus) throw new Error('rollback evidence mode is unsupported')

          async function requireNoFailurePanel(page) {
            const failure = page.locator('.status-panel.error, .status-panel.not-ready, .status-panel.conflict')
            if (await failure.count()) throw new Error(`rollback page rendered an evidence failure: ${await failure.first().innerText()}`)
          }

          async function fullFlow(viewport, screenshot) {
            const browser = await chromium.launch({ headless: true })
            const page = await browser.newPage({ viewport })
            const pageErrors = []
            const failedRequests = []
            const failedResponses = []
            page.on('pageerror', (error) => pageErrors.push(String(error)))
            page.on('requestfailed', (request) => failedRequests.push(`${request.url()}: ${request.failure()?.errorText}`))
            page.on('response', (response) => {
              if (response.status() >= 400) failedResponses.push(`${response.url()}: ${response.status()}`)
            })
            const response = await page.goto(process.env.CLOUDFRONT_URL, {
              waitUntil: 'networkidle',
              timeout: 120000,
            })
            if (!response || !response.ok()) throw new Error('rollback CloudFront root failed')
            await page.getByRole('heading', { name: /Machine Learning Product Search Ranking Platform/i }).waitFor()
            await page.getByText(expectedStatus, { exact: true }).waitFor()
            await requireNoFailurePanel(page)
            await page.keyboard.press('Tab')
            const skipLink = page.getByRole('link', { name: /skip to content/i })
            if (!(await skipLink.evaluate((node) => node === document.activeElement))) {
              throw new Error('rollback browser did not focus the skip link')
            }
            await page.keyboard.press('Enter')
            if (!(await page.locator('#main-content').evaluate((node) => node === document.activeElement))) {
              throw new Error('rollback skip link did not focus main content')
            }
            const compare = page.getByRole('link', { name: /Compare a query/i })
            if (process.env.ROLLBACK_HAS_FINE_TUNED_CANDIDATE === '1') {
              await compare.waitFor()
              await compare.click()
              await page.locator('.comparison-summary').waitFor({ timeout: 120000 })
              await page.locator('.rankings-grid').waitFor()
              const labels = page.getByRole('checkbox', { name: /show benchmark labels/i })
              await labels.uncheck()
              await labels.check()
              await page.getByRole('link', { name: 'Evaluation', exact: true }).click()
              await page.locator('main h1, main h2').first().waitFor()
              await requireNoFailurePanel(page)
              await page.getByRole('link', { name: 'Failures', exact: true }).click()
              await page.locator('main h1, main h2').first().waitFor()
              await requireNoFailurePanel(page)
              await page.getByRole('link', { name: 'Experiment', exact: true }).click()
              await page.locator('main h1, main h2').first().waitFor()
              await requireNoFailurePanel(page)
            }
            await page.screenshot({ path: screenshot, fullPage: true })
            if (pageErrors.length) throw new Error(`rollback page errors: ${pageErrors.join('; ')}`)
            if (failedRequests.length) throw new Error(`rollback request failures: ${failedRequests.join('; ')}`)
            if (failedResponses.length) throw new Error(`rollback HTTP failures: ${failedResponses.join('; ')}`)
            await browser.close()
          }

          ;(async () => {
            await fullFlow({ width: 1440, height: 1000 }, 'rollback-browser-desktop.png')
            await fullFlow({ width: 360, height: 800 }, 'rollback-browser-mobile.png')
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          JS

          # Recheck the captured ETag immediately before the only pointer mutation.
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            > pointer-before-manual-rollback-head.json
          test "$(jq -er '.VersionId' pointer-before-manual-rollback-head.json)" = \
            "${previous_pointer_version}"
          test "$(jq -er '.ETag' pointer-before-manual-rollback-head.json)" = \
            "${previous_pointer_etag}"
          aws s3api put-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            --body rollback-current.json \
            --content-type application/json \
            --checksum-algorithm SHA256 \
            --tagging "RetentionClass=promoted" \
            --if-match "${previous_pointer_etag}" \
            > manual-rollback-pointer-put.json
          restored_pointer_version="$(jq -er '.VersionId' manual-rollback-pointer-put.json)"
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            > active-manual-rollback-pointer-head.json
          test "$(jq -er '.VersionId' active-manual-rollback-pointer-head.json)" = \
            "${restored_pointer_version}"
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            --version-id "${restored_pointer_version}" \
            active-manual-rollback-pointer.json >/dev/null
          cmp --silent rollback-current.json active-manual-rollback-pointer.json
          jq -n \
            --arg restored_release "${RELEASE_ID}" \
            --arg from_version "${current_version}" \
            --arg to_version "${ROLLBACK_LAMBDA_VERSION}" \
            --arg pointer "${restored_pointer_version}" \
            --arg model "${rollback_model_id}" \
            --arg commit "${GITHUB_SHA}" \
            '{schema_version: "1.0.0", artifact_type: "manual_rollback_evidence",
              restored_release_id: $restored_release, restored_model_id: $model,
              from_lambda_version: $from_version, to_lambda_version: $to_version,
              restored_pointer_version_id: $pointer, workflow_commit: $commit,
              smoke_test_passed: true}' \
            > rollback-evidence.json
          uv run --frozen --no-dev python - <<'PY'
          from pathlib import Path

          from search_rank.schemas.api import ReadyResponse
          from search_rank.schemas.workflow import ManualRollbackEvidence, SmokeTestEvidence

          ReadyResponse.model_validate_json(Path("rollback-ready.json").read_text(encoding="utf-8"))
          SmokeTestEvidence.model_validate_json(
              Path("rollback-api-smoke.json").read_text(encoding="utf-8")
          )
          ManualRollbackEvidence.model_validate_json(
              Path("rollback-evidence.json").read_text(encoding="utf-8")
          )
          PY
          rollback_evidence_key="public/${RELEASE_ID}/rollback-evidence-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.json"
          set +e
          aws s3api put-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${rollback_evidence_key}" \
            --body rollback-evidence.json \
            --content-type application/json \
            --checksum-algorithm SHA256 \
            --if-none-match '*' \
            > rollback-evidence-put.json 2>rollback-evidence-put-error.txt
          rollback_evidence_status=$?
          set -e
          if [[ "${rollback_evidence_status}" -ne 0 ]]; then
            if ! grep -Eq 'PreconditionFailed|412' rollback-evidence-put-error.txt; then
              cat rollback-evidence-put-error.txt >&2
              false
            fi
            aws s3api get-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${rollback_evidence_key}" \
              existing-rollback-evidence.json >/dev/null
            cmp --silent rollback-evidence.json existing-rollback-evidence.json
          fi
          transition_started=0
          trap - EXIT INT TERM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rollback-evidence-${{ github.run_id }}
          path: |
            rollback-ready.json
            rollback-api-smoke.json
            rollback-static-verification.json
            rollback-browser-desktop.png
            rollback-browser-mobile.png
            rollback-evidence.json
          if-no-files-found: warn
          retention-days: 90
