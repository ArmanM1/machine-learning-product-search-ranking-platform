              'ResourceNotFoundException|ProvisionedConcurrencyConfigNotFoundException' \
              "candidate-provisioned-${qualifier}.error"; then
              cat "candidate-provisioned-${qualifier}.error" >&2
              exit 1
            fi
          done

          readarray -t cold_window < <(python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          payload = json.loads(Path("candidate-function-private.json").read_text(encoding="utf-8"))
          modified = payload.get("Configuration", {}).get("LastModified")
          if not isinstance(modified, str):
              raise SystemExit("candidate function LastModified is unavailable")
          parsed = datetime.fromisoformat(modified.replace("Z", "+00:00"))
          published_ms = int(parsed.timestamp() * 1000)
          apply_started_ms = int(Path("terraform-apply-start-ms.txt").read_text(encoding="utf-8"))
          if published_ms < apply_started_ms:
              raise SystemExit("candidate version was not newly published by this deployment apply")
          print(max(0, published_ms - 1000))
          print(published_ms)
          PY
          )
          cold_window_start_ms="${cold_window[0]}"
          candidate_published_ms="${cold_window[1]}"
          pre_request_boundary_ms="$(date -u +%s%3N)"
          log_group="/aws/lambda/${function_name}"
          aws logs filter-log-events \
            --log-group-name "${log_group}" \
            --start-time "${cold_window_start_ms}" \
            --end-time "${pre_request_boundary_ms}" \
            --no-interleaved > candidate-cold-prior-events-private.json

          query_id="$(jq -er \
            '.queries | map(select((.products | length) == 40)) | sort_by(.query_id) | .[0].query_id' \
            .release/model/curated-queries.json)"
          candidate_count=40
          dataset_hash="$(jq -er '.dataset_manifest_hash' .release/model/release-manifest.json)"
          model_checksum="$(jq -er --arg model "${MODEL_ID}" \
            '.models[] | select(.model_id == $model) | .artifact_checksum' \
            .release/model/release-manifest.json)"
          cold_request_id="cold-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-v${candidate_version}"
          ((${#cold_request_id} <= 128))
          cold_payload="$(jq -cn \
            --arg query "${query_id}" \
            --arg model "${MODEL_ID}" \
            --argjson top_k "${candidate_count}" \
            '{query_id: $query, model_id: $model, top_k: $top_k}')"
          cold_request_started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          cold_result="$(curl \
            --silent --show-error --connect-timeout 10 --max-time 30 \
            --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
            --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
            --header "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
            --header "x-request-id: ${cold_request_id}" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --request POST \
            --data-binary "${cold_payload}" \
            --output candidate-cold-response.json \
            --write-out $'%{http_code}\t%{time_total}' \
            "${candidate_url%/}/api/v1/rank")"
          test "${cold_result%%$'\t'*}" = "200"
          cold_seconds="${cold_result#*$'\t'}"
          cold_end_to_end_ms="$(python -c \
            'import sys; value=float(sys.argv[1]); assert value > 0; print(value * 1000.0)' \
            "${cold_seconds}")"
          jq -e \
            --arg request "${cold_request_id}" \
            --arg query "${query_id}" \
            --arg model "${MODEL_ID}" \
            --arg dataset "${dataset_hash}" \
            --arg checksum "${model_checksum}" \
            --argjson count "${candidate_count}" \
            '.request_id == $request and .query_id == $query and .model_id == $model and
             .dataset_manifest_hash == $dataset and .model_artifact_checksum == $checksum and
             .candidate_count == $count and .top_k == $count and (.results | length) == $count' \
            candidate-cold-response.json >/dev/null

          evidence_ready=0
          for _ in $(seq 1 20); do
            post_request_boundary_ms="$(date -u +%s%3N)"
            aws logs filter-log-events \
              --log-group-name "${log_group}" \
              --start-time "${cold_window_start_ms}" \
              --end-time "${post_request_boundary_ms}" \
              --no-interleaved > candidate-cold-observed-events-private.json
            if python scripts/cold_start_evidence.py \
              --function-metadata candidate-function-private.json \
              --prior-events candidate-cold-prior-events-private.json \
              --observed-events candidate-cold-observed-events-private.json \
              --response candidate-cold-response.json \
              --function-name "${function_name}" \
              --alias candidate \
              --version "${candidate_version}" \
              --previous-version "${previous_candidate_version}" \
              --release-id "${RELEASE_ID}" \
              --model-id "${MODEL_ID}" \
              --dataset-manifest-hash "${dataset_hash}" \
              --model-artifact-checksum "${model_checksum}" \
              --request-id "${cold_request_id}" \
              --request-started-at "${cold_request_started_at}" \
              --end-to-end-ms "${cold_end_to_end_ms}" \
              --candidate-count "${candidate_count}" \
              --apply-started-epoch-ms "${apply_started_epoch_ms}" \
              --output candidate-cold-start.json; then
              evidence_ready=1
              break
            fi
            sleep 3
          done
          test "${evidence_ready}" -eq 1
          jq -e \
            --arg version "${candidate_version}" \
            --argjson published "${candidate_published_ms}" \
            '.controlled_cold_start == true and .sample_count == 1 and
             .excluded_from_warm_samples == true and
             .identifiers.function_version == $version and
             .control_proof.provisioned_concurrency == 0 and
             .lambda_report.init_duration_ms > 0 and
             .structured_startup.model_load_duration_ms > 0 and
             .lambda_report.max_memory_used_mb > 0 and
             .structured_request.process_peak_memory_mb > 0 and $published > 0' \
            candidate-cold-start.json >/dev/null
      - name: Run the candidate API contract, error-rate, and primary latency gates
        shell: bash
        run: |
          set -euo pipefail
          candidate_url="$(cat candidate-api-url.txt)"
          signed_call() {
            local method="$1"
            local path="$2"
            local output="$3"
            local payload="${4:-}"
            local arguments=(
              --silent --show-error --connect-timeout 10 --max-time 30
              --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api"
              --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}"
              --header "x-amz-security-token: ${AWS_SESSION_TOKEN}"
              --header "accept: application/json"
              --output "${output}"
              --write-out $'%{http_code}\t%{time_total}'
            )
            if [[ "${method}" == "POST" ]]; then
              arguments+=(--request POST --header "content-type: application/json" --data-binary "${payload}")
            fi
            curl "${arguments[@]}" "${candidate_url%/}${path}"
          }

          assert_200() {
            local path="$1"
            local output="$2"
            local result
            result="$(signed_call GET "${path}" "${output}")"
            test "${result%%$'\t'*}" = "200"
          }

          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          assert_200 /healthz candidate-health.json
          assert_200 /readyz candidate-ready.json
          assert_200 /api/v1/models candidate-models.json
          assert_200 '/api/v1/queries?limit=50' candidate-queries.json
          jq -e --arg version "${GITHUB_SHA}" \
            '.status == "ok" and .service_version == $version' candidate-health.json >/dev/null
          jq -e --arg model "${MODEL_ID}" '.status == "ready" and .model_id == $model' candidate-ready.json >/dev/null
          jq -e --arg model "${MODEL_ID}" 'map(.model_id) | index($model) != null' candidate-models.json >/dev/null
          query_id="$(jq -er 'max_by(.candidate_count) | .query_id' candidate-queries.json)"
          candidate_count="$(jq -er 'max_by(.candidate_count) | .candidate_count' candidate-queries.json)"
          test "${candidate_count}" -eq 40
          public_run_id="$(jq -er '.run.run_id' .release/model/public-evidence.json)"
          if [[ "${RELEASE_HAS_FINE_TUNED_CANDIDATE}" == "1" ]]; then
            baseline_id="$(jq -er '.evaluation.strongest_baseline_model_id' .release/model/public-evidence.json)"
            evaluated_candidate_id="$(jq -er '.evaluation.candidate_model_id' .release/model/public-evidence.json)"
          else
            baseline_id="$(jq -er --arg promoted "${MODEL_ID}" '[.[] | select(.model_id != $promoted) | .model_id][0]' candidate-models.json)"
            evaluated_candidate_id="${MODEL_ID}"
          fi
          encoded_query="$(jq -rn --arg value "${query_id}" '$value | @uri')"
          encoded_baseline="$(jq -rn --arg value "${baseline_id}" '$value | @uri')"
          encoded_model="$(jq -rn --arg value "${evaluated_candidate_id}" '$value | @uri')"
          encoded_run="$(jq -rn --arg value "${public_run_id}" '$value | @uri')"
          assert_200 "/api/v1/comparisons/${encoded_query}?baseline=${encoded_baseline}&candidate=${encoded_model}&include_judgments=true" candidate-comparison.json
          assert_200 "/api/v1/runs/${encoded_run}" candidate-run.json
          jq -e --arg baseline "${baseline_id}" --arg candidate "${evaluated_candidate_id}" \
            '.baseline_model_id == $baseline and .candidate_model_id == $candidate and
             (.benchmark_judgments | type == "array" and length > 0)' candidate-comparison.json >/dev/null
          expected_evidence_mode="validation_only"
          if [[ "${RELEASE_HAS_FINE_TUNED_CANDIDATE}" == "1" ]]; then
            expected_evidence_mode="verified"
          fi
          jq -e --arg run "${public_run_id}" --arg mode "${expected_evidence_mode}" \
            '.schema_version == "1.0.0" and .evidence_mode == $mode and
             .run.run_id == $run and .evaluation.run_id == $run and
             .failure_analysis.run_id == $run' candidate-run.json >/dev/null

          payload="$(jq -cn --arg query "${query_id}" --arg model "${MODEL_ID}" \
            '{query_id: $query, model_id: $model, top_k: 10}')"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          for warmup in $(seq 1 10); do
            result="$(signed_call POST /api/v1/rank "candidate-warmup-${warmup}.json" "${payload}")"
            test "${result%%$'\t'*}" = "200"
            jq -e --arg model "${MODEL_ID}" '.model_id == $model and (.results | length == 10)' \
              "candidate-warmup-${warmup}.json" >/dev/null
          done

          : > candidate-rank-samples.tsv
          for sample in $(seq 1 200); do
            response="candidate-rank-response.json"
            if result="$(signed_call POST /api/v1/rank "${response}" "${payload}")"; then
              status="${result%%$'\t'*}"
              elapsed="${result#*$'\t'}"
            else
              status="000"
              elapsed="30"
            fi
            model_latency=""
            if [[ "${status}" == "200" ]] && jq -e --arg model "${MODEL_ID}" \
              '.model_id == $model and (.results | length == 10) and (.latency_ms | type == "number")' \
              "${response}" >/dev/null 2>&1; then
              model_latency="$(jq -r '.latency_ms' "${response}")"
            fi
            printf '%s\t%s\t%s\t%s\n' "${sample}" "${status}" "${elapsed}" "${model_latency}" \
              >> candidate-rank-samples.tsv
          done

          invalid_payload="$(jq -cn --arg model "${MODEL_ID}" \
            '{query_id: "deliberately-unknown-query", model_id: $model, top_k: 10}')"
          invalid_result="$(signed_call POST /api/v1/rank candidate-intentional-error.json "${invalid_payload}")"
          test "${invalid_result%%$'\t'*}" = "404"
          jq -e '.code == "unknown_query" and (.request_id | type == "string") and
            (tostring | test("stack|traceback|arn:aws|[0-9]{12}"; "i") | not)' \
            candidate-intentional-error.json >/dev/null

          python - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path

          rows = list(csv.DictReader(
              Path("candidate-rank-samples.tsv").open(encoding="utf-8"),
              fieldnames=("sample", "status", "seconds", "model_ms"),
              delimiter="\t",
          ))
          failures = [row for row in rows if row["status"] != "200" or not row["model_ms"]]
          if len(rows) != 200:
              raise SystemExit("primary latency gate requires exactly 200 measured requests")
          error_rate = len(failures) / len(rows)
          if error_rate >= 0.01:
              raise SystemExit(f"candidate API error rate {error_rate:.3%} is not below 1 percent")

          def percentile(values: list[float], probability: float) -> float:
              values = sorted(values)
              position = (len(values) - 1) * probability
              lower = math.floor(position)
              upper = math.ceil(position)
              if lower == upper:
                  return values[lower]
              return values[lower] * (upper - position) + values[upper] * (position - lower)

          model_ms = [float(row["model_ms"]) for row in rows if row["model_ms"]]
          end_to_end_ms = [float(row["seconds"]) * 1000 for row in rows if row["model_ms"]]
          warm_p95 = percentile(end_to_end_ms, 0.95)
          if warm_p95 > 1500:
              raise SystemExit(f"warm end-to-end p95 {warm_p95:.1f} ms exceeds 1500 ms")
          report = {
              "schema_version": "1.0.0",
              "status": "passed",
              "scope": "candidate_alias_primary_release_gate",
              "valid_request_count": len(rows),
              "failure_count": len(failures),
              "error_rate": error_rate,
              "error_rate_target": "less_than_0.01",
              "warmup_request_count": 10,
              "candidate_count": 40,
              "concurrency": 1,
              "end_to_end_latency_ms": {
                  "p50": percentile(end_to_end_ms, 0.50),
                  "p95": warm_p95,
                  "p99": percentile(end_to_end_ms, 0.99),
              },
              "model_latency_ms": {
                  "p50": percentile(model_ms, 0.50),
                  "p95": percentile(model_ms, 0.95),
                  "p99": percentile(model_ms, 0.99),
              },
              "lambda_memory_mb": 4096,
              "architecture": "x86_64",
              "region": "us-east-1",
              "reserved_concurrency": 2,
              "provisioned_concurrency": 0,
              "measurement_phase": "warm_after_ten_explicit_warmups",
              "controlled_cold_start_evidence_file": "candidate-cold-start.json",
              "controlled_cold_sample_included": False,
              "limitations": [
                  "This primary gate measures concurrency one only.",
                  "The separate release benchmark records concurrency 1, 4, and 8.",
              ],
          }
          Path("candidate-smoke.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Publish the public route only after the private candidate gates pass
        working-directory: infra/terraform/environments/prod
        shell: bash
        run: |
          set -Eeuo pipefail
          function_name="$(cat ../../../../lambda-function-name.txt)"
          public_transition_started=0
          fail_closed_first_publication() {
            local original_status="$1"
            trap - EXIT
            trap '' INT TERM
            if [[ "${original_status}" -ne 0 && "${public_transition_started}" -eq 1 ]]; then
              if aws lambda put-function-concurrency \
                --function-name "${function_name}" \
                --reserved-concurrent-executions 0 >/dev/null 2>&1; then
                touch ../../../../first-publication-service-disabled.txt
                echo "First public publication was interrupted; Lambda traffic was disabled." >&2
              else
                echo "First public publication was interrupted and traffic disablement failed." >&2
              fi
            fi
            exit "${original_status}"
          }
          trap 'fail_closed_first_publication "$?"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          public_serving_existed="$(cat ../../../../public-serving-existed.txt)"
          [[ "${public_serving_existed}" == "true" || "${public_serving_existed}" == "false" ]]
          if [[ "${public_serving_existed}" == "false" ]]; then
            public_transition_started=1
            touch ../../../../public-serving-creation-started.txt
            PYTHONPATH=../../../../src uv run --frozen --no-dev python \
              ../../../../scripts/validate_financial_snapshot.py emit --output /dev/null
            terraform plan -input=false -out=public.tfplan \
              -var="owner_alias=${TF_OWNER_ALIAS}" \
              -var="github_repository=${TF_GITHUB_REPOSITORY}" \
              -var="github_repository_owner_id=${TF_GITHUB_REPOSITORY_OWNER_ID}" \
              -var="github_repository_id=${TF_GITHUB_REPOSITORY_ID}" \
              -var="create_github_oidc_provider=${TF_CREATE_GITHUB_OIDC_PROVIDER}" \
              -var="existing_github_oidc_provider_arn=${TF_GITHUB_OIDC_PROVIDER_ARN}" \
              -var="enable_budgets=${TF_ENABLE_BUDGETS}" \
              -var="budget_notification_email=${TF_BUDGET_NOTIFICATION_EMAIL}" \
              -var="alarm_notification_email=${TF_ALARM_NOTIFICATION_EMAIL}" \
              -var="enable_serving=true" \
              -var="enable_public_serving=true" \
              -var="serving_image_uri=$(cat ../../../../serving-image-uri.txt)" \
              -var="serving_git_sha=${GITHUB_SHA}" \
              -var="serving_deployment_nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_ID}"
            terraform show -json public.tfplan > public-plan.private.json
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("public-plan.private.json").read_text(encoding="utf-8"))
          changes = {
              item.get("address"): item.get("change", {}).get("actions", [])
              for item in payload.get("resource_changes", [])
          }
          destructive = [
              {"address": address, "actions": actions}
              for address, actions in changes.items()
              if "delete" in actions
          ]
          if destructive:
              raise SystemExit(
                  "public-serving plan unexpectedly deletes or replaces resources: "
                  + json.dumps(destructive, sort_keys=True)
              )
          private_addresses = {
              "module.platform.aws_lambda_function.api[0]",
              "module.platform.aws_lambda_alias.candidate[0]",
              "module.platform.aws_lambda_alias.production[0]",
              "module.platform.aws_apigatewayv2_api.candidate[0]",
              "module.platform.aws_apigatewayv2_stage.candidate[0]",
          }
          changed_private = [
              {"address": address, "actions": changes.get(address)}
              for address in sorted(private_addresses)
              if changes.get(address) != ["no-op"]
          ]
          if changed_private:
              raise SystemExit(
                  "public-serving plan would mutate already-gated private resources: "
                  + json.dumps(changed_private, sort_keys=True)
              )
          PY
            PYTHONPATH=../../../../src uv run --frozen --no-dev python \
              ../../../../scripts/validate_financial_snapshot.py emit --output /dev/null
            terraform apply -input=false -auto-approve public.tfplan
            touch ../../../../public-serving-created-this-run.txt
          fi

          terraform output -raw production_api_url > ../../../../production-api-url.txt
          terraform output -raw cloudfront_distribution_id \
            > ../../../../cloudfront-distribution-id.txt
          terraform output -raw cloudfront_url > ../../../../cloudfront-url.txt
          grep -Eq '^https://[^/]+/?$' ../../../../production-api-url.txt
          grep -Eq '^https://[^/]+/?$' ../../../../cloudfront-url.txt
          test -s ../../../../cloudfront-distribution-id.txt
          public_transition_started=0
          trap - EXIT INT TERM
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and stage the immutable static release
        working-directory: web
        env:
          VITE_API_BASE_URL: ""
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          publish_static_file_immutable() {
            local source_file="$1"
            local object_key="$2"
            local content_type="$3"
            local cache_control="public,max-age=31536000,immutable"
            local status
            set +e
            aws s3api put-object \
              --bucket "${SITE_BUCKET}" \
              --key "${object_key}" \
              --body "${source_file}" \
              --content-type "${content_type}" \
              --cache-control "${cache_control}" \
              --checksum-algorithm SHA256 \
              --if-none-match '*' \
              >static-put-object.json 2>static-put-object-error.txt
            status=$?
            set -e
            if [[ "${status}" -eq 0 ]]; then
              return 0
            fi
            if ! grep -Eq 'PreconditionFailed|412' static-put-object-error.txt; then
              cat static-put-object-error.txt >&2
              return "${status}"
            fi
            aws s3api get-object \
              --bucket "${SITE_BUCKET}" \
              --key "${object_key}" \
              existing-static-object.bin >existing-static-object-metadata.json
            if ! cmp --silent "${source_file}" existing-static-object.bin; then
              echo "Immutable static release object already exists with different bytes: ${object_key}" >&2
              return 1
            fi
            aws s3api head-object \
              --bucket "${SITE_BUCKET}" \
              --key "${object_key}" >existing-static-object-head.json
            jq -e --arg content_type "${content_type}" --arg cache_control "${cache_control}" \
              '.ContentType == $content_type and .CacheControl == $cache_control' \
              existing-static-object-head.json >/dev/null
          }
          : > expected-static-release-keys.txt
          while IFS= read -r -d '' source_file; do
            relative="${source_file#dist/}"
            object_key="releases/${RELEASE_ID}/${relative}"
            case "${relative}" in
              *.html) content_type="text/html" ;;
              *.css) content_type="text/css" ;;
              *.js|*.mjs) content_type="text/javascript" ;;
              *.json|*.map) content_type="application/json" ;;
              *.svg) content_type="image/svg+xml" ;;
              *.png) content_type="image/png" ;;
              *.ico) content_type="image/x-icon" ;;
              *.woff2) content_type="font/woff2" ;;
              *) content_type="application/octet-stream" ;;
            esac
            publish_static_file_immutable "${source_file}" "${object_key}" "${content_type}"
            printf '%s\n' "${object_key}" >> expected-static-release-keys.txt
          done < <(find dist -type f -print0 | sort -z)
          test -s expected-static-release-keys.txt
          aws s3api list-objects-v2 \
            --bucket "${SITE_BUCKET}" \
            --prefix "releases/${RELEASE_ID}/" > static-release-objects.json
          python - <<'PY'
          import json
          from pathlib import Path

          expected = set(
              Path("expected-static-release-keys.txt").read_text(encoding="utf-8").splitlines()
          )
          response = json.loads(Path("static-release-objects.json").read_text(encoding="utf-8"))
          if response.get("IsTruncated"):
              raise SystemExit("static release object inventory was unexpectedly truncated")
          observed = {
              item["Key"]
              for item in response.get("Contents", [])
              if isinstance(item, dict) and isinstance(item.get("Key"), str)
          }
          if observed != expected:
              raise SystemExit("immutable static release inventory differs from the local build")
          PY
          # Do not copy even stable-name assets into the live root before the
          # candidate is accepted. The staged browser remaps static requests to
          # this immutable release prefix while leaving API requests same-origin.
          distribution_id="$(cat ../cloudfront-distribution-id.txt)"
          aws cloudfront create-invalidation --distribution-id "${distribution_id}" --paths "/releases/${RELEASE_ID}/*" >/dev/null
          cloudfront_url="$(cat ../cloudfront-url.txt)"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 \
            "${cloudfront_url}/releases/${RELEASE_ID}/index.html" >/dev/null
      - name: Browser-smoke the staged static candidate through CloudFront
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          STAGED_ORIGIN="$(cat ../cloudfront-url.txt)"
          export STAGED_ORIGIN RELEASE_ID
          function_name="$(cat ../lambda-function-name.txt)"
          aws lambda get-alias --function-name "${function_name}" --name production \
            > ../pre-staged-canary-alias.json
          previous_version="$(jq -er '.FunctionVersion' ../pre-staged-canary-alias.json)"
          previous_revision="$(jq -er '.RevisionId' ../pre-staged-canary-alias.json)"
          candidate_version="$(aws lambda get-alias --function-name "${function_name}" --name candidate --query FunctionVersion --output text)"
          [[ "${previous_version}" =~ ^[1-9][0-9]*$ ]]
          [[ "${candidate_version}" =~ ^[1-9][0-9]*$ ]]
          [[ "${previous_revision}" =~ ^[A-Za-z0-9-]{1,128}$ ]]
          printf '%s' "${previous_version}" > ../pre-staged-canary-version.txt
          printf '%s' "${previous_revision}" > ../pre-staged-canary-revision.txt
