      - name: Verify the activated API and complete browser flow through CloudFront
        id: production_verification
        continue-on-error: true
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          cloudfront_url="$(cat ../cloudfront-url.txt)"
          export CLOUDFRONT_ORIGIN="${cloudfront_url}" RELEASE_ID
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path("dist")
          files = sorted(path for path in root.rglob("*") if path.is_file())
          if not files:
              raise SystemExit("production static verification found no local build files")
          index_path = root / "index.html"
          if not index_path.is_file():
              raise SystemExit("production static verification found no index.html")
          targets = [
              (path.relative_to(root).as_posix(), path)
              for path in files
          ] + [("<root>", index_path)]
          failures: list[str] = []
          for attempt in range(1, 13):
              failures = []
              for relative, path in targets:
                  suffix = "" if relative == "<root>" else urllib.parse.quote(relative, safe="/")
                  url = os.environ["CLOUDFRONT_ORIGIN"].rstrip("/") + "/" + suffix
                  request = urllib.request.Request(
                      url,
                      headers={"Cache-Control": "no-cache", "User-Agent": "deploy-static-verify/1.0"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          observed = response.read(len(path.read_bytes()) + 1)
                  except (OSError, urllib.error.URLError) as error:
                      failures.append(f"{relative}: {error}")
                      continue
                  if observed != path.read_bytes():
                      failures.append(f"{relative}: CloudFront bytes differ")
              if not failures:
                  break
              if attempt < 12:
                  time.sleep(10)
          if failures:
              raise SystemExit("production static verification failed: " + "; ".join(failures))

          inventory = {
              path.relative_to(root).as_posix(): "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              for path in files
          }
          inventory_digest = hashlib.sha256(
              json.dumps(inventory, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          Path("../production-static-verification.json").write_text(
              json.dumps(
                  {
                      "schema_version": "1.0.0",
                      "release_id": os.environ["RELEASE_ID"],
                      "file_count": len(inventory),
                      "inventory_sha256": "sha256:" + inventory_digest,
                      "cloudfront_bytes_verified": True,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          production_health_verified=0
          for _ in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "${cloudfront_url}/healthz" > ../production-health.json \
              && jq -e --arg version "${GITHUB_SHA}" \
                '.status == "ok" and .service_version == $version' \
                ../production-health.json >/dev/null; then
              production_health_verified=1
              break
            fi
            sleep 5
          done
          test "${production_health_verified}" = "1"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
