              if [[ "${restoration_failed}" -eq 0 ]]; then
                aws lambda get-alias --function-name "${function_name}" --name production \
                  > ../staged-canary-alias-after-restore.json \
                  || restoration_failed=1
                test "$(jq -er '.FunctionVersion' ../staged-canary-alias-after-restore.json)" = \
                  "${previous_version}" || restoration_failed=1
                test "$(jq -er '.RevisionId' ../staged-canary-alias-after-restore.json)" = \
                  "${expected_restored_revision}" || restoration_failed=1
              fi
