                # traffic enabled. The final compensation step retries the CAS
                # restore and re-enables the configured concurrency on success.
                aws lambda put-function-concurrency \
                  --function-name "${function_name}" \
                  --reserved-concurrent-executions 0 >/dev/null 2>&1 || true
                touch ../staged-canary-service-disabled.txt
                exit 1
