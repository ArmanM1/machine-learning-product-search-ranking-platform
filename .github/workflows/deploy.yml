            --name production \
            --function-version "${candidate_version}" \
            --revision-id "${previous_revision}" > activated-lambda-alias.json
          test "$(jq -er '.FunctionVersion' activated-lambda-alias.json)" = "${candidate_version}"
          activated_revision="$(jq -er '.RevisionId' activated-lambda-alias.json)"
          [[ "${activated_revision}" =~ ^[A-Za-z0-9-]{1,128}$ ]]
          printf '%s' "${activated_revision}" > activated-lambda-alias-revision.txt
          aws s3 sync \
            "s3://${SITE_BUCKET}/releases/${RELEASE_ID}/" \
            "s3://${SITE_BUCKET}/" \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable" \
            --no-progress
          aws s3 cp "s3://${SITE_BUCKET}/releases/${RELEASE_ID}/index.html" "s3://${SITE_BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html" \
            --metadata-directive REPLACE \
