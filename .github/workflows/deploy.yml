                  || restoration_failed=1
                aws lambda put-function-concurrency --function-name "${function_name}" \
                  --reserved-concurrent-executions 0 >/dev/null \
                  || restoration_failed=1
              fi
              aws s3api get-object \
                --bucket "${ARTIFACT_BUCKET}" \
                --key promoted/current.json \
                pointer-during-partial-rollback.json >/dev/null \
                || restoration_failed=1
              if [[ "${restoration_failed}" -eq 0 ]] && \
                ! cmp --silent previous-promotion-pointer.json pointer-during-partial-rollback.json; then
                if cmp --silent promotion-pointer.json pointer-during-partial-rollback.json; then
                  aws s3api head-object \
                    --bucket "${ARTIFACT_BUCKET}" \
                    --key promoted/current.json \
                    > pointer-during-partial-rollback-head.json \
                    || restoration_failed=1
                  if [[ "${restoration_failed}" -eq 0 ]]; then
                    aws s3api put-object \
                      --bucket "${ARTIFACT_BUCKET}" \
                      --key promoted/current.json \
                      --body previous-promotion-pointer.json \
                      --content-type application/json \
                      --checksum-algorithm SHA256 \
                      --tagging "RetentionClass=promoted" \
                      --if-match "$(jq -er '.ETag' pointer-during-partial-rollback-head.json)" \
                      > partial-pointer-restore.json \
                      || restoration_failed=1
                  fi
                else
                  echo "Live promotion pointer changed unexpectedly; refusing to overwrite it during compensation." >&2
                  restoration_failed=1
                fi
              fi
            else
              if [[ "${activated}" == "1" ]]; then
                restoration_failed=1
              fi
            fi
            if [[ "${restoration_failed}" -ne 0 ]]; then
              aws lambda put-function-concurrency --function-name "${function_name}" \
                --reserved-concurrent-executions 0 >/dev/null 2>&1 || true
              echo "Partial activation compensation was incomplete; public Lambda traffic was disabled." >&2
            fi
            exit "${original_status}"
          }
          trap 'restore_partial_activation "$?"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
