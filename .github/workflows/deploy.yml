name: Deploy or roll back the public comparison product

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy a promoted release or restore the prior healthy release
        required: true
        type: choice
        options: [deploy, rollback]
      release_id:
        description: Immutable release ID to deploy, or prior static release ID to restore
        required: true
        type: string
      model_id:
        description: Promoted model ID (required for deploy)
        required: false
        type: string
      rollback_lambda_version:
        description: Prior healthy numeric Lambda version (required for rollback)
        required: false
        type: string
      rollback_model_pointer_version_id:
        description: Prior S3 version ID of promoted/current.json (required for rollback)
        required: false
        type: string
      authorization:
        description: Type DEPLOY PUBLIC AWS DEMO or ROLL BACK PUBLIC AWS DEMO
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-financial-operations
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ALLOW_HELDOUT_EVAL: "0"
  CAMPAIGN_BUDGET_USD: "40"
  REQUIRED_CREDIT_RESERVE_USD: "40"
  MAXIMUM_OUT_OF_POCKET_USD: "0"

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      MODEL_ID: ${{ inputs.model_id }}
      AUTHORIZATION: ${{ inputs.authorization }}
      CAMPAIGN_SPEND_TO_DATE_USD: ${{ secrets.AWS_CAMPAIGN_SPEND_TO_DATE_USD }}
      REMAINING_APPLICABLE_CREDIT_USD: ${{ secrets.AWS_REMAINING_APPLICABLE_CREDIT_USD }}
      FINANCIAL_SNAPSHOT_OBSERVED_AT: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_OBSERVED_AT }}
      FINANCIAL_SNAPSHOT_RECEIPT_SHA256: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_RECEIPT_SHA256 }}
      FINANCIAL_SNAPSHOT_HMAC_KEY: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_HMAC_KEY }}
      FINANCIAL_RESERVATION_MAX_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_MAX_USD }}
      FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD }}
      FINANCIAL_RESERVATION_CPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_CPU_HOURS }}
      FINANCIAL_RESERVATION_GPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_GPU_HOURS }}
      FINANCIAL_CPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_CPU_HOURS_USED_TO_DATE }}
      FINANCIAL_GPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_GPU_HOURS_USED_TO_DATE }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_WORKFLOW: deploy
      FINANCIAL_SNAPSHOT_AUTHORIZATION_INPUTS_JSON: ${{ toJSON(inputs) }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_COMMIT_SHA: ${{ github.sha }}
      FINANCIAL_SNAPSHOT_SOURCE: "aws_billing_and_cost_management_console"
      FINANCIAL_SNAPSHOT_MAX_AGE_SECONDS: "21600"
      ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      SITE_BUCKET: ${{ vars.AWS_SITE_BUCKET }}
      SERVE_REPOSITORY: ${{ vars.AWS_SERVE_ECR_REPOSITORY_URL }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_OWNER_ALIAS: ${{ vars.TF_OWNER_ALIAS }}
      TF_GITHUB_REPOSITORY: ${{ github.repository }}
      TF_GITHUB_REPOSITORY_OWNER_ID: ${{ vars.TF_GITHUB_REPOSITORY_OWNER_ID }}
      TF_GITHUB_REPOSITORY_ID: ${{ vars.TF_GITHUB_REPOSITORY_ID }}
      TF_GITHUB_OIDC_PROVIDER_ARN: ${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}
      TF_CREATE_GITHUB_OIDC_PROVIDER: ${{ vars.TF_CREATE_GITHUB_OIDC_PROVIDER || 'false' }}
      TF_ENABLE_BUDGETS: ${{ vars.TF_ENABLE_BUDGETS || 'false' }}
      TF_BUDGET_NOTIFICATION_EMAIL: ${{ secrets.AWS_BUDGET_NOTIFICATION_EMAIL }}
      TF_ALARM_NOTIFICATION_EMAIL: ${{ secrets.AWS_ALARM_NOTIFICATION_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install the protected AWS mutation gate
        shell: bash
        run: |
          set -euo pipefail
          gate_dir="${RUNNER_TEMP}/financial-aws-gate"
          mkdir -p "${gate_dir}"
          install -m 0755 scripts/aws_financial_gate.sh "${gate_dir}/aws"
          printf 'REAL_AWS_CLI=%s\n' "$(command -v aws)" >> "${GITHUB_ENV}"
          printf '%s\n' "${gate_dir}" >> "${GITHUB_PATH}"
      - name: Enforce public-deployment and zero-out-of-pocket gates
        shell: bash
        run: |
          set -euo pipefail
          test "${AUTHORIZATION}" = "DEPLOY PUBLIC AWS DEMO"
          test "${ALLOW_HELDOUT_EVAL}" = "0"
          [[ "${TF_GITHUB_REPOSITORY_OWNER_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${TF_GITHUB_REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${RELEASE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,62}$ ]]
          ((${#MODEL_ID} >= 3 && ${#MODEL_ID} <= 100))
          [[ "${MODEL_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*(@[A-Za-z0-9][A-Za-z0-9._-]*)?$ ]]
          : "${ARTIFACT_BUCKET:?Missing AWS_ARTIFACT_BUCKET variable}"
          : "${SITE_BUCKET:?Missing AWS_SITE_BUCKET variable}"
          : "${SERVE_REPOSITORY:?Missing AWS_SERVE_ECR_REPOSITORY_URL variable}"
          : "${TF_STATE_BUCKET:?Missing AWS_TERRAFORM_STATE_BUCKET variable}"
          python - <<'PY'
          import os
          from decimal import Decimal, InvalidOperation

          from scripts.validate_financial_reservation import validate_reservation_coverage

          def amount(name: str) -> Decimal:
              try:
                  value = Decimal(os.environ[name])
              except (InvalidOperation, KeyError) as exc:
                  raise SystemExit(f"{name} must be a decimal number") from exc
              if not value.is_finite() or value < 0:
                  raise SystemExit(f"{name} must be finite and non-negative")
              return value

          # PRD allowance for S3, ECR, Lambda, API Gateway, and CloudFront combined.
          conservative_serving_allowance = Decimal("3.00")
          spent = amount("CAMPAIGN_SPEND_TO_DATE_USD")
          credit = amount("REMAINING_APPLICABLE_CREDIT_USD")
          campaign = amount("CAMPAIGN_BUDGET_USD")
          reserve = amount("REQUIRED_CREDIT_RESERVE_USD")
          if amount("MAXIMUM_OUT_OF_POCKET_USD") != 0:
              raise SystemExit("Owner-approved out-of-pocket limit must be exactly zero")
          if spent + conservative_serving_allowance > campaign:
              raise SystemExit("Deployment would breach the USD 40 campaign envelope")
          if credit < conservative_serving_allowance + reserve:
              raise SystemExit("Applicable credit cannot cover serving allowance and required reserve")
          validate_reservation_coverage(
              os.environ,
              required_max_usd=conservative_serving_allowance,
              required_remaining_committed_usd=0,
              required_cpu_hours=0,
              required_gpu_hours=0,
          )
          print("Zero-out-of-pocket deployment guard passed with the conservative USD 3 serving allowance.")
          PY
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Atomically reserve the signed campaign capacity
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Missing AWS_TERRAFORM_STATE_BUCKET variable}"
          python -m pip install --disable-pip-version-check pydantic==2.13.5 PyYAML==6.0.3
          PYTHONPATH=src python scripts/reserve_financial_capacity.py reserve \
            --bucket "${TF_STATE_BUCKET}" \
            --output financial-capacity-reservation.json
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Verify promotion and build immutable serving image
        shell: bash
        run: |
          set -euo pipefail
          current_pointer_key="promoted/current.json"
          decision_pointer_key="promoted/decisions/${RELEASE_ID}.json"
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${current_pointer_key}" \
            > previous-promotion-pointer-head.json
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${current_pointer_key}" \
            previous-promotion-pointer.json >/dev/null
          previous_pointer_etag="$(jq -er '.ETag' previous-promotion-pointer-head.json)"
          previous_pointer_version="$(jq -er '.VersionId' previous-promotion-pointer-head.json)"
          [[ "${previous_pointer_etag}" =~ ^\"[0-9a-f]{32}\"$ ]]
          ((${#previous_pointer_version} >= 1 && ${#previous_pointer_version} <= 1024))
          [[ "${previous_pointer_version}" =~ ^[A-Za-z0-9._=+/-]+$ ]]
          printf '%s' "${previous_pointer_etag}" > previous-promotion-pointer-etag.txt
          printf '%s' "${previous_pointer_version}" > previous-promotion-pointer-version.txt

          # The canonical deployment-evidence key is a versioned CAS pointer to
          # the newest successful deployment of this release. Capture its exact
          # pre-run state now so a retry can publish a fresh Lambda-version
          # observation without overwriting a concurrent deployment.
          deployment_evidence_key="public/${RELEASE_ID}/deployment-evidence.json"
          set +e
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${deployment_evidence_key}" \
            > prior-deployment-evidence-head.json \
            2> prior-deployment-evidence-head-error.txt
          prior_deployment_evidence_status=$?
          set -e
          if [[ "${prior_deployment_evidence_status}" -eq 0 ]]; then
            prior_deployment_evidence_etag="$(jq -er '.ETag' prior-deployment-evidence-head.json)"
            prior_deployment_evidence_version="$(jq -er '.VersionId' prior-deployment-evidence-head.json)"
            [[ "${prior_deployment_evidence_etag}" =~ ^\"[0-9a-f]{32}\"$ ]]
            ((${#prior_deployment_evidence_version} >= 1 && ${#prior_deployment_evidence_version} <= 1024))
            [[ "${prior_deployment_evidence_version}" =~ ^[A-Za-z0-9._=+/-]+$ ]]
            printf '%s' "${prior_deployment_evidence_etag}" > prior-deployment-evidence-etag.txt
            printf '%s' "${prior_deployment_evidence_version}" > prior-deployment-evidence-version.txt
          else
            if ! grep -Eq 'NoSuchKey|Not Found|404' prior-deployment-evidence-head-error.txt; then
              cat prior-deployment-evidence-head-error.txt >&2
              exit "${prior_deployment_evidence_status}"
            fi
            touch prior-deployment-evidence-absent.txt
          fi

          set +e
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${decision_pointer_key}" \
            promotion-pointer.json \
            > promotion-decision-get.json 2>promotion-decision-get-error.txt
          decision_get_status=$?
          set -e
          if [[ "${decision_get_status}" -eq 0 ]]; then
            decision_pointer_etag="$(jq -er '.ETag' promotion-decision-get.json)"
            decision_pointer_version="$(jq -er '.VersionId' promotion-decision-get.json)"
            [[ "${decision_pointer_etag}" =~ ^\"[0-9a-f]{32}\"$ ]]
            ((${#decision_pointer_version} >= 1 && ${#decision_pointer_version} <= 1024))
            [[ "${decision_pointer_version}" =~ ^[A-Za-z0-9._=+/-]+$ ]]
            printf '%s' "${decision_pointer_etag}" > promotion-decision-etag.txt
            printf '%s' "${decision_pointer_version}" > promotion-decision-version.txt
            # A rerun of an already activated release is a safe no-op at the
            # pointer boundary. A first activation must still be based on the
            # exact version captured by the release decision.
            if cmp --silent promotion-pointer.json previous-promotion-pointer.json; then
              pointer_requires_advance=0
            else
              pointer_requires_advance=1
              jq -e \
                --arg release "$(jq -er '.release_id' previous-promotion-pointer.json)" \
                --arg model "$(jq -er '.model_id' previous-promotion-pointer.json)" \
                --arg version "${previous_pointer_version}" \
                '.evidence_mode == "verified" and
                 .previous.release_id == $release and
                 .previous.model_id == $model and
                 .previous.pointer_version_id == $version' \
                promotion-pointer.json >/dev/null
            fi
          else
            if ! grep -Eq 'NoSuchKey|Not Found|404' promotion-decision-get-error.txt; then
              cat promotion-decision-get-error.txt >&2
              exit "${decision_get_status}"
            fi
            # The bootstrap baseline predates staged decisions. It is the only
            # deployable release allowed to use the live pointer as its input.
            cp previous-promotion-pointer.json promotion-pointer.json
            pointer_requires_advance=0
            jq -e \
              --arg release "${RELEASE_ID}" \
              --arg model "${MODEL_ID}" \
              '.release_id == $release and .model_id == $model and
               .evidence_mode == "validation_only" and
               .release_decision == "validation_baseline" and .previous == null' \
              promotion-pointer.json >/dev/null
          fi
          printf '%s' "${pointer_requires_advance}" > pointer-requires-advance.txt
          jq -e \
            --arg release "${RELEASE_ID}" \
            --arg model "${MODEL_ID}" \
            '.schema_version == "1.0.0" and
             .release_id == $release and .model_id == $model and
             ((.evidence_mode == "validation_only" and
               .bundle_s3_key == ("promoted/" + $model + "/") and
               .release_decision == "validation_baseline" and
               .gate_passed == null and .evaluated_candidate_model_id == null) or
              (.evidence_mode == "verified" and
               .bundle_s3_key == ("promoted/releases/" + $release + "/") and
               ((.gate_passed == true and .release_decision == "promote_candidate" and
                 .evaluated_candidate_model_id == $model) or
                (.gate_passed == false and .release_decision == "retain_baseline" and
                 .evaluated_candidate_model_id != $model and .previous.model_id == $model))))' \
            promotion-pointer.json >/dev/null
          bundle_s3_key="$(jq -er '.bundle_s3_key' promotion-pointer.json)"
          [[ "${bundle_s3_key}" =~ ^promoted/[A-Za-z0-9._@/-]+/$ ]]
          [[ "${bundle_s3_key}" != *".."* ]]
          mkdir -p .release/model
          aws s3 sync "s3://${ARTIFACT_BUCKET}/${bundle_s3_key}" .release/model/ --no-progress
          test -f .release/model/release-manifest.json
          test -f .release/model/curated-queries.json
          test -f .release/model/public-evidence.json
          test -f .release/model/bundle-checksums.json
          test -f .release/model/LICENSE
          test -f .release/model/NOTICE
          if [[ "$(jq -er '.evidence_mode' promotion-pointer.json)" == "verified" ]]; then
            test -f .release/model/candidate-model-artifact.json
          else
            test ! -e .release/model/candidate-model-artifact.json
          fi
          jq -e \
            --arg model "${MODEL_ID}" \
            --arg release "${RELEASE_ID}" \
            --arg mode "$(jq -r '.evidence_mode' promotion-pointer.json)" \
            --arg release_git "$(jq -er '.git_sha' promotion-pointer.json)" \
            '.promoted_model_id == $model and .release_id == $release and
             .evidence_mode == $mode and .git_sha == $release_git' \
            .release/model/release-manifest.json >/dev/null
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".release/model").resolve()
          manifest = json.loads((root / "bundle-checksums.json").read_text(encoding="utf-8"))
          expected_files = set(manifest.get("files", {}))
          actual_files = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file() and path.name != "bundle-checksums.json"
          }
          if expected_files != actual_files:
              raise SystemExit("release checksum inventory does not exactly cover the bundle")
          for relative, expected in manifest["files"].items():
              path = (root / relative).resolve()
              if root not in path.parents or not path.is_file():
                  raise SystemExit(f"release checksum entry is unsafe or absent: {relative}")
              hasher = hashlib.sha256()
              with path.open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      hasher.update(chunk)
              digest = hasher.hexdigest()
              if expected != "sha256:" + digest:
                  raise SystemExit(f"release artifact checksum mismatch: {relative}")
          release = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          bound = release.get("artifact_checksums")
          source_names = {"evaluation-report.json", "baseline-summary.json"} & actual_files
          if release.get("evidence_mode") == "verified":
              mode_files = {
                  "candidate-model-artifact.json",
                  "evaluation-report.json",
                  "evaluation-provenance.json",
              }
              expected_source_names = {"evaluation-report.json"}
          elif release.get("evidence_mode") == "validation_only":
              mode_files = {"baseline-summary.json"}
              expected_source_names = {"baseline-summary.json"}
          else:
              raise SystemExit("release manifest has an unsupported evidence mode")
          required = {
              "public-evidence.json",
              "curated-queries.json",
              "LICENSE",
              "NOTICE",
              *mode_files,
          }
          if (
              source_names != expected_source_names
              or not isinstance(bound, dict)
              or set(bound) != required
          ):
              raise SystemExit("release manifest has no exact mode-specific public evidence binding")
          for relative in required:
              if bound[relative] != manifest["files"][relative]:
                  raise SystemExit(f"release manifest checksum differs for {relative}")
          PY
          uv run --frozen --no-dev python scripts/verify_release.py \
            .release/model \
            --metadata-only \
            --output deployment-release-verification.json
          public_run_id="$(jq -er '.run.run_id | select(test("^[A-Za-z0-9._-]{3,100}$"))' .release/model/public-evidence.json)"
          default_query_id="$(jq -er '.queries[0].query_id | select(test("^[A-Za-z0-9._-]{1,200}$"))' .release/model/curated-queries.json)"
          promoted_model_id="$(jq -er '.promoted_model_id' .release/model/release-manifest.json)"
          test "${promoted_model_id}" = "${MODEL_ID}"
          if jq -e 'any(.models[]; .kind == "fine_tuned")' .release/model/release-manifest.json >/dev/null; then
            echo "RELEASE_HAS_FINE_TUNED_CANDIDATE=1" >> "${GITHUB_ENV}"
            expected_evidence_mode="verified"
          else
            echo "RELEASE_HAS_FINE_TUNED_CANDIDATE=0" >> "${GITHUB_ENV}"
            expected_evidence_mode="validation_only"
          fi
          printf 'RELEASE_EVIDENCE_MODE=%s\n' "${expected_evidence_mode}" >> "${GITHUB_ENV}"
          jq -e --arg mode "${expected_evidence_mode}" \
            --slurpfile release .release/model/release-manifest.json \
            --slurpfile pointer promotion-pointer.json \
            '($release[0]) as $manifest |
             .schema_version == "1.0.0" and .evidence_mode == $mode and
             $manifest.evidence_mode == $mode and $pointer[0].evidence_mode == $mode and
             .run.dataset_manifest_hash == $manifest.dataset_manifest_hash and
             .run.split_manifest_hash == $manifest.split_manifest_hash and
             ([.run.run_id, .evaluation.run_id, .failure_analysis.run_id] | unique | length) == 1 and
             (if $mode == "verified" then
                .evaluation.report_id == $manifest.evaluation_report_id and
                (.run.training_provenance |
                  with_entries(select(.value != null))) == $manifest.provenance.training and
                (.run.evaluation_provenance |
                  with_entries(select(.value != null))) == $manifest.provenance.evaluation and
                (.run.training_provenance.trial_selection_id |
                  test("^trial-selection-[0-9a-f]{20}$")) and
                (.run.training_provenance.trial_selection_sha256 |
                  test("^sha256:[0-9a-f]{64}$")) and
                (.run.training_provenance.run_manifest_sha256 |
                  test("^sha256:[0-9a-f]{64}$")) and
                .run.training_provenance.selected_model_id ==
                  .evaluation.candidate_model_id and
                .run.training_provenance.selected_model_artifact_checksum ==
                  .run.evaluation_provenance.candidate_model_artifact_checksum and
                .run.evaluation_provenance.clean_execution_count == 2 and
                ((.evaluation.release_status == "passed" and
                  .evaluation.candidate_model_id == $manifest.promoted_model_id and
                  $pointer[0].gate_passed == true and
                  $pointer[0].release_decision == "promote_candidate") or
                 (.evaluation.release_status == "failed" and
                  .evaluation.strongest_baseline_model_id == $manifest.promoted_model_id and
                  .evaluation.candidate_model_id != $manifest.promoted_model_id and
                  $pointer[0].gate_passed == false and
                  $pointer[0].release_decision == "retain_baseline"))
              else
                .evaluation.evidence_id == $manifest.evaluation_report_id and
                .evaluation.selected_model_id == $manifest.promoted_model_id and
                .run.test_access_count == 0 and .evaluation.test_access_count == 0
              end)' .release/model/public-evidence.json >/dev/null
          candidate_model_id="$(jq -r '[.models[] | select(.kind == "fine_tuned") | .model_id][0] // .promoted_model_id' .release/model/release-manifest.json)"
          baseline_model_id="$(jq -r --arg candidate "${candidate_model_id}" \
            '[.models[] | select(.model_id != $candidate) | .model_id][0] // .promoted_model_id' \
            .release/model/release-manifest.json)"
          [[ "${baseline_model_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]{2,99}$ ]]
          [[ "${candidate_model_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]{2,99}$ ]]
          {
            echo "VITE_DATA_MODE=api"
            echo "VITE_API_BASE_URL="
            echo "VITE_PUBLIC_RUN_ID=${public_run_id}"
            echo "VITE_DEFAULT_QUERY_ID=${default_query_id}"
            echo "VITE_BASELINE_MODEL_ID=${baseline_model_id}"
            echo "VITE_CANDIDATE_MODEL_ID=${candidate_model_id}"
          } >> "${GITHUB_ENV}"
          release_manifest_sha256="$(sha256sum .release/model/release-manifest.json | cut -d' ' -f1)"
          [[ "${release_manifest_sha256}" =~ ^[0-9a-f]{64}$ ]]
          model_hash="${release_manifest_sha256:0:12}"
          model_identity_hash="$(printf '%s' "${MODEL_ID}" | sha256sum | cut -c1-12)"
          model_slug="${MODEL_ID//@/-at-}"
          model_slug="${model_slug:0:80}"
          release_tag="release-${RELEASE_ID}"
          sha_tag="sha-${GITHUB_SHA}-${model_hash}"
          # The repository is immutable. Include the release-manifest hash so a
          # negative result can safely redeploy the retained baseline model ID.
          # The model slug is readable, while the full-identity hash prevents a
          # collision if an unusually long ID is truncated. `@` is never legal
          # in a Docker tag, so pinned model revisions use the explicit `-at-`.
          model_tag="model-${model_slug}-${model_identity_hash}-${model_hash}"
          validate_ecr_tag() {
            local tag="$1"
            ((${#tag} >= 1 && ${#tag} <= 128))
            [[ "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          }
          for tag in "${release_tag}" "${sha_tag}" "${model_tag}"; do
            if ! validate_ecr_tag "${tag}"; then
              echo "Derived ECR tag is not Docker-safe: ${tag}" >&2
              exit 1
            fi
          done
          repository_name="${SERVE_REPOSITORY#*/}"
          lookup_tag_digest() {
            local tag="$1"
            local output
            local status
            set +e
            output="$(aws ecr describe-images \
              --repository-name "${repository_name}" \
              --image-ids imageTag="${tag}" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>ecr-describe-error.txt)"
            status=$?
            set -e
            if [[ "${status}" -eq 0 ]]; then
              if [[ ! "${output}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "ECR returned a non-canonical digest for tag ${tag}." >&2
                return 1
              fi
              printf '%s' "${output}"
              return 0
            fi
            if grep -q 'ImageNotFoundException' ecr-describe-error.txt; then
              return 0
            fi
            cat ecr-describe-error.txt >&2
            return "${status}"
          }
          verify_registry_image_content() {
            local digest="$1"
            local image_ref="${SERVE_REPOSITORY}@${digest}"
            local container_id
            test ! -e registry-image-release
            test ! -e registry-image-web-config.json
            docker pull "${image_ref}" >/dev/null
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image_ref}")" = "${GITHUB_SHA}"
            test "$(docker image inspect --format '{{ index .Config.Labels "io.product-search.model-id" }}' "${image_ref}")" = "${MODEL_ID}"
            test "$(docker image inspect --format '{{ index .Config.Labels "io.product-search.release-id" }}' "${image_ref}")" = "${RELEASE_ID}"
            test "$(docker image inspect --format '{{ index .Config.Labels "io.product-search.release-manifest-sha256" }}' "${image_ref}")" = "sha256:${release_manifest_sha256}"
            container_id="$(docker create --entrypoint /bin/true "${image_ref}")"
            mkdir registry-image-release
            if ! docker cp "${container_id}:/var/task/release/." registry-image-release/; then
              docker rm -f "${container_id}" >/dev/null 2>&1 || true
              return 1
            fi
            if ! docker cp \
              "${container_id}:/var/task/web/dist/build-config.json" \
              registry-image-web-config.json; then
              docker rm -f "${container_id}" >/dev/null 2>&1 || true
              return 1
            fi
            docker rm -f "${container_id}" >/dev/null
            jq -e \
              --arg mode "${VITE_DATA_MODE}" \
              --arg base_url "${VITE_API_BASE_URL}" \
              --arg run_id "${VITE_PUBLIC_RUN_ID}" \
              --arg query_id "${VITE_DEFAULT_QUERY_ID}" \
              --arg baseline_id "${VITE_BASELINE_MODEL_ID}" \
              --arg candidate_id "${VITE_CANDIDATE_MODEL_ID}" \
              '.data_mode == $mode and .data_mode == "api" and
               .api_base_url == $base_url and .public_run_id == $run_id and
               .default_query_id == $query_id and
               .baseline_model_id == $baseline_id and
               .candidate_model_id == $candidate_id' \
              registry-image-web-config.json >/dev/null
            python - <<'PY'
          import hashlib
          from pathlib import Path

          def inventory(root: Path) -> dict[str, str]:
              result = {}
              for path in root.rglob("*"):
                  if path.is_symlink():
                      raise SystemExit(f"image release contains a symbolic link: {path}")
                  if path.is_file():
                      result[path.relative_to(root).as_posix()] = hashlib.sha256(
                          path.read_bytes()
                      ).hexdigest()
                  elif not path.is_dir():
                      raise SystemExit(f"image release contains a non-regular entry: {path}")
              return result

          expected = inventory(Path(".release/model"))
          observed = inventory(Path("registry-image-release"))
          if observed != expected:
              raise SystemExit("existing ECR image does not embed the exact release bundle")
          PY
          }
          ensure_immutable_tag() {
            local tag="$1"
            local digest="$2"
            local observed
            local status
            observed="$(lookup_tag_digest "${tag}")"
            if [[ -n "${observed}" ]]; then
              test "${observed}" = "${digest}"
              return 0
            fi
            PYTHONPATH=src uv run --frozen --no-dev python \
              scripts/validate_financial_snapshot.py emit --output /dev/null
            set +e
            aws ecr put-image \
              --repository-name "${repository_name}" \
              --image-tag "${tag}" \
              --image-manifest file://registry-image-manifest.json \
              --image-manifest-media-type "${registry_manifest_media_type}" \
              >ecr-put-image.json 2>ecr-put-image-error.txt
            status=$?
            set -e
            observed="$(lookup_tag_digest "${tag}")"
            if [[ "${status}" -ne 0 && "${observed}" != "${digest}" ]]; then
              cat ecr-put-image-error.txt >&2
              return "${status}"
            fi
            test "${observed}" = "${digest}"
          }

          digest=""
          existing_tag_count=0
          for tag in "${release_tag}" "${sha_tag}" "${model_tag}"; do
            observed="$(lookup_tag_digest "${tag}")"
            if [[ -n "${observed}" ]]; then
              existing_tag_count=$((existing_tag_count + 1))
              if [[ -n "${digest}" && "${observed}" != "${digest}" ]]; then
                echo "Immutable ECR tags disagree on image digest; refusing reuse." >&2
                exit 1
              fi
              digest="${observed}"
            fi
          done
          if [[ "${existing_tag_count}" -eq 0 ]]; then
            docker build \
              --file Dockerfile.serve \
              --build-arg MODEL_ARTIFACT_DIR=.release/model \
              --build-arg VITE_DATA_MODE="${VITE_DATA_MODE}" \
              --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL}" \
              --build-arg VITE_PUBLIC_RUN_ID="${VITE_PUBLIC_RUN_ID}" \
              --build-arg VITE_DEFAULT_QUERY_ID="${VITE_DEFAULT_QUERY_ID}" \
              --build-arg VITE_BASELINE_MODEL_ID="${VITE_BASELINE_MODEL_ID}" \
              --build-arg VITE_CANDIDATE_MODEL_ID="${VITE_CANDIDATE_MODEL_ID}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "io.product-search.model-id=${MODEL_ID}" \
              --label "io.product-search.release-id=${RELEASE_ID}" \
              --label "io.product-search.release-manifest-sha256=sha256:${release_manifest_sha256}" \
              --tag "${SERVE_REPOSITORY}:${release_tag}" .
            PYTHONPATH=src uv run --frozen --no-dev python \
              scripts/validate_financial_snapshot.py emit --output /dev/null
            set +e
            docker push "${SERVE_REPOSITORY}:${release_tag}"
            push_status=$?
            set -e
            digest="$(lookup_tag_digest "${release_tag}")"
            if [[ "${push_status}" -ne 0 && -z "${digest}" ]]; then
              echo "Initial immutable ECR push failed without publishing the release tag." >&2
              exit "${push_status}"
            fi
          fi
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          verify_registry_image_content "${digest}"
          docker run --rm -i \
            --entrypoint /opt/search-rank-venv/bin/python \
            --mount "type=bind,source=$(pwd)/.release/model,target=/evidence,readonly" \
            "${SERVE_REPOSITORY}@${digest}" - <<'PY'
          import hashlib
          from pathlib import Path

          from search_rank.schemas.api import PublicEvidenceEnvelope
          from search_rank.schemas.evaluation import EvaluationReport
          from search_rank.schemas.evidence import BundleChecksums, ReleaseManifest
          from search_rank.schemas.model import ModelArtifact

          root = Path("/evidence")

          def sha256(path: Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          release = ReleaseManifest.model_validate_json(
              (root / "release-manifest.json").read_text(encoding="utf-8")
          )
          evidence = PublicEvidenceEnvelope.model_validate_json(
              (root / "public-evidence.json").read_text(encoding="utf-8")
          )
          checksums = BundleChecksums.model_validate_json(
              (root / "bundle-checksums.json").read_text(encoding="utf-8")
          )
          actual = {
              path.relative_to(root).as_posix(): sha256(path)
              for path in root.rglob("*")
              if path.is_file() and path.name != "bundle-checksums.json"
          }
          if checksums.files != actual:
              raise SystemExit("Pydantic-validated bundle checksum inventory differs from disk")
          if evidence.run.split_manifest_hash != release.split_manifest_hash:
              raise SystemExit("public run and release split identities differ")

          artifact_path = root / "candidate-model-artifact.json"
          if release.evidence_mode == "validation_only":
              if artifact_path.exists():
                  raise SystemExit("validation-only baseline cannot fabricate a trained artifact")
          else:
              artifact = ModelArtifact.model_validate_json(
                  artifact_path.read_text(encoding="utf-8")
              )
              report_path = root / "evaluation-report.json"
              report = EvaluationReport.model_validate_json(
                  report_path.read_text(encoding="utf-8")
              )
              if release.provenance is None:
                  raise SystemExit("verified release is missing execution provenance")
              candidates = [model for model in release.models if model.kind == "fine_tuned"]
              if len(candidates) != 1:
                  raise SystemExit("verified release must contain exactly one fine-tuned candidate")
              candidate = candidates[0]
              training = release.provenance.training
              evaluation = release.provenance.evaluation
              public_run = evidence.run
              public_evaluation = evidence.evaluation
              bindings = {
                  "candidate model ID": (
                      artifact.model_id
                      == candidate.model_id
                      == training.selected_model_id
                      == evaluation.candidate_model_id
                      == report.candidate_model_id
                      == public_evaluation.candidate_model_id
                  ),
                  "candidate artifact checksum": (
                      artifact.artifact_checksum
                      == candidate.artifact_checksum
                      == training.selected_model_artifact_checksum
                      == evaluation.candidate_model_artifact_checksum
                  ),
                  "training run": artifact.run_id == training.run_id,
                  "training config": (
                      artifact.config_hash == training.config_hash == public_run.config_hash
                  ),
                  "training Git SHA": (
                      artifact.git_sha == training.git_sha == release.git_sha == public_run.git_sha
                  ),
                  "training image": artifact.image_digest == training.image_digest,
                  "dataset": (
                      artifact.dataset_manifest_hash
                      == release.dataset_manifest_hash
                      == public_run.dataset_manifest_hash
                  ),
                  "split manifest": public_run.split_manifest_hash == release.split_manifest_hash,
                  "input contract": artifact.input_contract_version == candidate.text_template,
                  "base model": (
                      artifact.base_model_id == public_run.base_model_id
                      and candidate.public_summary.base_model_id == artifact.base_model_id
                      and artifact.base_model_revision == public_run.base_model_revision
                  ),
                  "evaluation report ID": (
                      artifact.evaluation_report_id
                      == release.evaluation_report_id
                      == report.report_id
                      == public_evaluation.report_id
                  ),
                  "evaluation report checksum": (
                      artifact.evaluation_report_sha256 == sha256(report_path)
                  ),
                  "selected run-manifest checksum": (
                      artifact.selected_training_run_manifest_sha256
                      == training.run_manifest_sha256
                  ),
                  "release artifact checksum": (
                      release.artifact_checksums["candidate-model-artifact.json"]
                      == sha256(artifact_path)
                  ),
                  "promotion outcome": (
                      artifact.promoted
                      == (release.promoted_model_id == candidate.model_id)
                      == report.release_gate_results.passed
                  ),
              }
              failures = [name for name, matches in bindings.items() if not matches]
              if failures:
                  raise SystemExit(
                      "candidate model artifact binding failed: " + ", ".join(failures)
                  )
          PY
          aws ecr batch-get-image \
            --repository-name "${repository_name}" \
            --image-ids imageDigest="${digest}" \
            --accepted-media-types \
              application/vnd.docker.distribution.manifest.v2+json \
              application/vnd.oci.image.manifest.v1+json \
            > registry-image.json
          jq -er --arg digest "${digest}" \
            '.images | map(select(.imageId.imageDigest == $digest)) | .[0].imageManifest' \
            registry-image.json > registry-image-manifest.json
          registry_manifest_media_type="$(jq -er --arg digest "${digest}" \
            '.images | map(select(.imageId.imageDigest == $digest)) | .[0].imageManifestMediaType' \
            registry-image.json)"
          for tag in "${release_tag}" "${sha_tag}" "${model_tag}"; do
            ensure_immutable_tag "${tag}" "${digest}"
          done
          for tag in "${release_tag}" "${sha_tag}" "${model_tag}"; do
            test "$(lookup_tag_digest "${tag}")" = "${digest}"
          done
          printf '%s@%s' "${SERVE_REPOSITORY}" "${digest}" > serving-image-uri.txt
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
      - name: Reconcile the private candidate serving infrastructure
        working-directory: infra/terraform/environments/prod
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=product-search-ranking/prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform_state="$(terraform state list)"
          public_serving_enabled=false
          for public_address in \
            'module.platform.aws_apigatewayv2_api.production[0]' \
            'module.platform.aws_cloudfront_distribution.site[0]' \
            'module.platform.aws_lambda_permission.production_api[0]' \
            'module.platform.aws_s3_bucket_policy.site[0]'; do
            if grep -Fqx "${public_address}" <<<"${terraform_state}"; then
              public_serving_enabled=true
              break
            fi
          done
          printf '%s' "${public_serving_enabled}" \
            > ../../../../public-serving-existed.txt
          PYTHONPATH=../../../../src uv run --frozen --no-dev python \
            ../../../../scripts/validate_financial_snapshot.py emit --output /dev/null
          terraform plan -input=false -out=deploy.tfplan \
            -var="owner_alias=${TF_OWNER_ALIAS}" \
            -var="github_repository=${TF_GITHUB_REPOSITORY}" \
            -var="github_repository_owner_id=${TF_GITHUB_REPOSITORY_OWNER_ID}" \
            -var="github_repository_id=${TF_GITHUB_REPOSITORY_ID}" \
            -var="create_github_oidc_provider=${TF_CREATE_GITHUB_OIDC_PROVIDER}" \
            -var="existing_github_oidc_provider_arn=${TF_GITHUB_OIDC_PROVIDER_ARN}" \
            -var="enable_budgets=${TF_ENABLE_BUDGETS}" \
            -var="budget_notification_email=${TF_BUDGET_NOTIFICATION_EMAIL}" \
            -var="alarm_notification_email=${TF_ALARM_NOTIFICATION_EMAIL}" \
            -var="enable_serving=true" \
            -var="enable_public_serving=${public_serving_enabled}" \
            -var="serving_image_uri=$(cat ../../../../serving-image-uri.txt)" \
            -var="serving_git_sha=${GITHUB_SHA}" \
            -var="serving_deployment_nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_ID}"
          terraform show -json deploy.tfplan > deploy-plan.private.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("deploy-plan.private.json").read_text(encoding="utf-8"))
          destructive = [
              {"address": item.get("address"), "actions": item.get("change", {}).get("actions", [])}
              for item in payload.get("resource_changes", [])
              if "delete" in item.get("change", {}).get("actions", [])
          ]
          if destructive:
              raise SystemExit(
                  "deployment plan unexpectedly deletes or replaces resources: "
                  + json.dumps(destructive, sort_keys=True)
              )
          PY
          previous_candidate_version="absent"
          if existing_function="$(terraform output -raw lambda_function_name 2>/dev/null)" \
            && [[ -n "${existing_function}" ]]; then
            set +e
            observed_previous="$(aws lambda get-alias \
              --function-name "${existing_function}" \
              --name candidate \
              --query FunctionVersion \
              --output text 2>/dev/null)"
            previous_status=$?
            set -e
            if [[ "${previous_status}" -eq 0 ]]; then
              [[ "${observed_previous}" =~ ^[1-9][0-9]*$ ]]
              previous_candidate_version="${observed_previous}"
            fi
          fi
          printf '%s' "${previous_candidate_version}" \
            > ../../../../candidate-version-before.txt
          PYTHONPATH=../../../../src uv run --frozen --no-dev python \
            ../../../../scripts/validate_financial_snapshot.py emit --output /dev/null
          date -u +%s%3N > ../../../../terraform-apply-start-ms.txt
          terraform apply -input=false -auto-approve deploy.tfplan
          terraform output -raw lambda_function_name > ../../../../lambda-function-name.txt
          terraform output -raw candidate_api_url > ../../../../candidate-api-url.txt
      - name: Measure the newly published candidate's first on-demand invocation
        shell: bash
        run: |
          set -euo pipefail
          function_name="$(cat lambda-function-name.txt)"
          candidate_url="$(cat candidate-api-url.txt)"
          apply_started_epoch_ms="$(cat terraform-apply-start-ms.txt)"
          [[ "${apply_started_epoch_ms}" =~ ^[0-9]{13}$ ]]
          candidate_version="$(aws lambda get-alias \
            --function-name "${function_name}" \
            --name candidate \
            --query FunctionVersion \
            --output text)"
          [[ "${candidate_version}" =~ ^[1-9][0-9]*$ ]]
          previous_candidate_version="$(cat candidate-version-before.txt)"
          if [[ "${previous_candidate_version}" != "absent" ]]; then
            [[ "${previous_candidate_version}" =~ ^[1-9][0-9]*$ ]]
            test "${candidate_version}" != "${previous_candidate_version}"
          fi
          aws lambda get-function \
            --function-name "${function_name}" \
            --qualifier candidate > candidate-function-private.json
          expected_runtime_image="$(cat serving-image-uri.txt)"
          jq -e \
            --arg version "${GITHUB_SHA}" \
            --arg nonce "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_ID}" \
            --arg image "${expected_runtime_image}" \
            '.Configuration.Environment.Variables.SEARCH_RANK_SERVICE_VERSION == $version and
             .Configuration.Environment.Variables.SEARCH_RANK_DEPLOYMENT_NONCE == $nonce and
             .Code.ResolvedImageUri == $image' \
            candidate-function-private.json >/dev/null

          for qualifier in candidate "${candidate_version}"; do
            set +e
            aws lambda get-provisioned-concurrency-config \
              --function-name "${function_name}" \
              --qualifier "${qualifier}" \
              > "candidate-provisioned-${qualifier}.json" \
              2> "candidate-provisioned-${qualifier}.error"
            provisioned_status=$?
            set -e
            if [[ "${provisioned_status}" -eq 0 ]]; then
              echo "Provisioned concurrency exists on ${qualifier}; refusing cold-start evidence." >&2
              exit 1
            fi
