                if [[ "${restoration_failed}" -eq 0 && \
                  "${current_version}" == "${previous_version}" && \
                  "${current_revision}" == "${previous_revision}" ]]; then
                  :
                elif [[ "${restoration_failed}" -eq 0 && \
                  "${current_version}" == "${candidate_version}" && \
                  -n "${expected_canary_revision}" && \
                  "${current_revision}" == "${expected_canary_revision}" ]]; then
                  aws lambda update-alias \
                    --function-name "${function_name}" \
                    --name production \
                    --function-version "${previous_version}" \
                    --revision-id "${current_revision}" \
                    > ../staged-canary-alias-restored.json \
                    || restoration_failed=1
                  if [[ "${restoration_failed}" -eq 0 ]]; then
                    test "$(jq -er '.FunctionVersion' ../staged-canary-alias-restored.json)" = \
                      "${previous_version}" || restoration_failed=1
                    expected_restored_revision="$(jq -er '.RevisionId' ../staged-canary-alias-restored.json)" \
                      || restoration_failed=1
                    printf '%s' "${expected_restored_revision}" \
                      > ../staged-canary-restored-revision.txt
