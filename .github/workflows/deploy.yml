          canary_active=0
          restore_canary_alias() {
            local original_status="$1"
            local restoration_failed=0
            local current_version
            local current_revision
            local expected_canary_revision=""
            local expected_restored_revision="${previous_revision}"
            trap - EXIT
            if [[ "${canary_active}" == "1" ]]; then
              set +e
              aws lambda get-alias --function-name "${function_name}" --name production \
                > ../staged-canary-alias-before-restore.json
              if [[ "$?" -ne 0 ]]; then
                restoration_failed=1
              else
                current_version="$(jq -er '.FunctionVersion' ../staged-canary-alias-before-restore.json)" \
                  || restoration_failed=1
                current_revision="$(jq -er '.RevisionId' ../staged-canary-alias-before-restore.json)" \
                  || restoration_failed=1
                if [[ -f ../staged-canary-alias-active.json ]]; then
                  expected_canary_revision="$(jq -er '.RevisionId' ../staged-canary-alias-active.json)" \
                    || restoration_failed=1
