          export PRODUCTION_URL="${cloudfront_url}"
          export RELEASE_HAS_FINE_TUNED_CANDIDATE
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          node - <<'JS'
          const { chromium } = require('playwright')

          const expectedStatusByMode = {
            verified: 'Verified release',
            validation_only: 'Validation-only evidence',
          }
          const expectedStatus = expectedStatusByMode[process.env.RELEASE_EVIDENCE_MODE]
          if (!expectedStatus) throw new Error('release evidence mode is absent or unsupported')

          async function requireNoFailurePanel(page) {
            const failure = page.locator('.status-panel.error, .status-panel.not-ready, .status-panel.conflict')
            if (await failure.count()) throw new Error(`public page rendered an evidence failure: ${await failure.first().innerText()}`)
          }

          async function fullFlow(viewport, screenshot) {
            const browser = await chromium.launch({ headless: true })
            const page = await browser.newPage({ viewport })
            const pageErrors = []
            const failedRequests = []
            const failedResponses = []
            page.on('pageerror', (error) => pageErrors.push(String(error)))
            page.on('requestfailed', (request) => failedRequests.push(`${request.url()}: ${request.failure()?.errorText}`))
            page.on('response', (response) => {
              if (response.status() >= 400) failedResponses.push(`${response.url()}: ${response.status()}`)
            })
            const response = await page.goto(process.env.PRODUCTION_URL, { waitUntil: 'networkidle', timeout: 120000 })
            if (!response || !response.ok()) throw new Error('CloudFront root did not load successfully')
            await page.getByRole('heading', { name: /Machine Learning Product Search Ranking Platform/i }).waitFor()
            await page.getByText(expectedStatus, { exact: true }).waitFor()
            await requireNoFailurePanel(page)

            await page.keyboard.press('Tab')
            const skipLink = page.getByRole('link', { name: /skip to content/i })
            if (!(await skipLink.evaluate((node) => node === document.activeElement))) {
              throw new Error('keyboard smoke did not focus the skip link first')
            }
            await page.keyboard.press('Enter')
            if (!(await page.locator('#main-content').evaluate((node) => node === document.activeElement))) {
              throw new Error('skip link did not focus main content')
            }

            if (process.env.RELEASE_HAS_FINE_TUNED_CANDIDATE === '1') {
              await page.getByRole('link', { name: /Compare a query/i }).click()
              await page.locator('.comparison-summary').waitFor({ timeout: 120000 })
              await page.locator('.rankings-grid').waitFor()
              const labels = page.getByRole('checkbox', { name: /show benchmark labels/i })
              await labels.uncheck()
              await labels.check()
              await page.getByRole('link', { name: 'Evaluation', exact: true }).click()
              await page.locator('main h1, main h2').first().waitFor()
              await requireNoFailurePanel(page)
              await page.getByRole('link', { name: 'Failures', exact: true }).click()
              await page.locator('main h1, main h2').first().waitFor()
              await requireNoFailurePanel(page)
              await page.getByRole('link', { name: 'Experiment', exact: true }).click()
              await page.locator('main h1, main h2').first().waitFor()
              await requireNoFailurePanel(page)
            }
            await page.screenshot({ path: screenshot, fullPage: true })
            if (pageErrors.length) throw new Error(`browser page errors: ${pageErrors.join('; ')}`)
            if (failedRequests.length) throw new Error(`browser request failures: ${failedRequests.join('; ')}`)
            if (failedResponses.length) throw new Error(`browser HTTP failures: ${failedResponses.join('; ')}`)
            await browser.close()
          }

          ;(async () => {
            await fullFlow({ width: 1440, height: 1000 }, '../production-browser-desktop.png')
            await fullFlow({ width: 360, height: 800 }, '../production-browser-mobile.png')
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          JS
      - name: Automatically restore the prior healthy revision after verification failure
        if: steps.production_verification.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          function_name="$(cat lambda-function-name.txt)"
          previous_version="$(cat previous-lambda-version.txt)"
          candidate_version="$(cat candidate-lambda-version.txt)"
          expected_active_revision="$(cat activated-lambda-alias-revision.txt)"
          aws lambda get-alias --function-name "${function_name}" --name production \
            > alias-before-automatic-rollback.json
          current_version="$(jq -er '.FunctionVersion' alias-before-automatic-rollback.json)"
          current_revision="$(jq -er '.RevisionId' alias-before-automatic-rollback.json)"
          if [[ "${current_version}" == "${candidate_version}" && \
            "${current_revision}" == "${expected_active_revision}" ]]; then
            aws lambda update-alias \
              --function-name "${function_name}" \
              --name production \
              --function-version "${previous_version}" \
              --revision-id "${current_revision}" > alias-automatic-rollback-result.json
            test "$(jq -er '.FunctionVersion' alias-automatic-rollback-result.json)" = \
              "${previous_version}"
            automatic_restored_revision="$(jq -er '.RevisionId' alias-automatic-rollback-result.json)"
            [[ "${automatic_restored_revision}" =~ ^[A-Za-z0-9-]{1,128}$ ]]
            printf '%s' "${automatic_restored_revision}" > workflow-restored-alias-revision.txt
          else
            aws lambda put-function-concurrency --function-name "${function_name}" \
              --reserved-concurrent-executions 0 >/dev/null 2>&1 || true
