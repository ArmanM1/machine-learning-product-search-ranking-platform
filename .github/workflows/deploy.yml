          canary_active=1
          touch ../staged-canary-transition-started.txt
          aws lambda update-alias --function-name "${function_name}" --name production \
            --function-version "${candidate_version}" \
            --revision-id "${previous_revision}" > ../staged-canary-alias-active.json
          test "$(jq -er '.FunctionVersion' ../staged-canary-alias-active.json)" = \
            "${candidate_version}"
          canary_revision="$(jq -er '.RevisionId' ../staged-canary-alias-active.json)"
          [[ "${canary_revision}" =~ ^[A-Za-z0-9-]{1,128}$ ]]
          printf '%s' "${canary_revision}" > ../staged-canary-active-revision.txt
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            uv run --project "${GITHUB_WORKSPACE}" --frozen --no-dev python \
            "${GITHUB_WORKSPACE}/scripts/validate_financial_snapshot.py" emit \
            --output /dev/null
          staged_health_verified=0
          for _ in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "$(cat ../cloudfront-url.txt)/healthz" > ../staged-candidate-health.json \
              && jq -e --arg version "${GITHUB_SHA}" \
