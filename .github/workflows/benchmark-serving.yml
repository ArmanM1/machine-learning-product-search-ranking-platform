name: Benchmark the promoted public Lambda release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable promoted release ID currently served in production
        required: true
        type: string
      model_id:
        description: Immutable promoted model ID currently served in production
        required: true
        type: string
      cloudfront_base_url:
        description: Generated HTTPS CloudFront base URL for the public deployment
        required: true
        type: string
      authorization:
        description: Type RUN PUBLIC SERVING BENCHMARK after reviewing the cost guard
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-financial-operations
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ALLOW_HELDOUT_EVAL: "0"
  CAMPAIGN_BUDGET_USD: "40"
  REQUIRED_CREDIT_RESERVE_USD: "40"
  MAXIMUM_OUT_OF_POCKET_USD: "0"
  BENCHMARK_COST_ALLOWANCE_USD: "0.50"

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-benchmark
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      MODEL_ID: ${{ inputs.model_id }}
      BASE_URL: ${{ inputs.cloudfront_base_url }}
      AUTHORIZATION: ${{ inputs.authorization }}
      CAMPAIGN_SPEND_TO_DATE_USD: ${{ secrets.AWS_CAMPAIGN_SPEND_TO_DATE_USD }}
      REMAINING_APPLICABLE_CREDIT_USD: ${{ secrets.AWS_REMAINING_APPLICABLE_CREDIT_USD }}
      FINANCIAL_SNAPSHOT_OBSERVED_AT: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_OBSERVED_AT }}
      FINANCIAL_SNAPSHOT_RECEIPT_SHA256: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_RECEIPT_SHA256 }}
      FINANCIAL_SNAPSHOT_HMAC_KEY: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_HMAC_KEY }}
      FINANCIAL_RESERVATION_MAX_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_MAX_USD }}
      FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD }}
      FINANCIAL_RESERVATION_CPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_CPU_HOURS }}
      FINANCIAL_RESERVATION_GPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_GPU_HOURS }}
      FINANCIAL_CPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_CPU_HOURS_USED_TO_DATE }}
      FINANCIAL_GPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_GPU_HOURS_USED_TO_DATE }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_WORKFLOW: benchmark-serving
      FINANCIAL_SNAPSHOT_AUTHORIZATION_INPUTS_JSON: ${{ toJSON(inputs) }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_COMMIT_SHA: ${{ github.sha }}
      FINANCIAL_SNAPSHOT_SOURCE: "aws_billing_and_cost_management_console"
      FINANCIAL_SNAPSHOT_MAX_AGE_SECONDS: "21600"
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
      BENCHMARK_RUN_ID: github-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the pinned runtime contract validator
        shell: bash
        run: python -m pip install --disable-pip-version-check pydantic==2.13.5
      - name: Enforce immutable inputs and the zero-out-of-pocket guard
        shell: bash
        run: |
          set -euo pipefail
          test "${AUTHORIZATION}" = "RUN PUBLIC SERVING BENCHMARK"
          test "${ALLOW_HELDOUT_EVAL}" = "0"
          [[ "${RELEASE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,62}$ ]]
          [[ "${MODEL_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]{2,99}$ ]]
          : "${ARTIFACT_BUCKET:?Missing AWS_ARTIFACT_BUCKET variable}"
          : "${LAMBDA_FUNCTION_NAME:?Missing AWS_LAMBDA_FUNCTION_NAME variable}"
          mkdir -p .benchmark-evidence
          PYTHONPATH=src python scripts/validate_financial_snapshot.py emit \
            --output .benchmark-evidence/financial-snapshot.json
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          from datetime import UTC, datetime
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          financial_snapshot = json.loads(
              Path(".benchmark-evidence/financial-snapshot.json").read_text(encoding="utf-8")
          )

          def amount(name: str) -> Decimal:
              try:
                  value = Decimal(os.environ[name])
              except (InvalidOperation, KeyError) as exc:
                  raise SystemExit(f"{name} must be a decimal number") from exc
              if not value.is_finite() or value < 0:
                  raise SystemExit(f"{name} must be finite and non-negative")
              return value

          parsed = urllib.parse.urlsplit(os.environ["BASE_URL"])
          host = parsed.hostname or ""
          if (
              parsed.scheme != "https"
              or not re.fullmatch(r"[a-z0-9-]+\.cloudfront\.net", host)
              or parsed.port is not None
              or parsed.username is not None
              or parsed.password is not None
              or parsed.path not in {"", "/"}
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("cloudfront_base_url must be a generated HTTPS *.cloudfront.net origin URL")

          allowance = amount("BENCHMARK_COST_ALLOWANCE_USD")
          spent = amount("CAMPAIGN_SPEND_TO_DATE_USD")
          credit = amount("REMAINING_APPLICABLE_CREDIT_USD")
          campaign = amount("CAMPAIGN_BUDGET_USD")
          reserve = amount("REQUIRED_CREDIT_RESERVE_USD")
          if amount("MAXIMUM_OUT_OF_POCKET_USD") != 0:
              raise SystemExit("Owner-approved out-of-pocket limit must be exactly zero")
          if campaign != Decimal("40") or reserve < Decimal("40"):
              raise SystemExit("The approved USD 40 campaign envelope and reserve must remain intact")
          if spent + allowance > campaign:
              raise SystemExit("Benchmark allowance would breach the USD 40 campaign envelope")
          if credit < reserve + allowance:
              raise SystemExit("Applicable credit cannot cover both the benchmark and required reserve")

          normalized = f"https://{host}"
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"BENCHMARK_BASE_URL={normalized}\n")
          Path(".benchmark-evidence/cost-preflight.json").write_text(
              json.dumps(
                  {
                      "schema_version": "1.0.0",
                      "artifact_type": "benchmark_cost_preflight",
                      "status": "passed",
                      "checked_at": datetime.now(UTC).isoformat(),
                      "benchmark_run_id": os.environ["BENCHMARK_RUN_ID"],
                      "release_id": os.environ["RELEASE_ID"],
                      "model_id": os.environ["MODEL_ID"],
                      "region": os.environ["AWS_REGION"],
                      "public_origin": normalized,
                      "maximum_out_of_pocket_usd": "0",
                      "campaign_envelope_usd": "40",
                      "required_credit_reserve_usd": "40",
                      "conservative_benchmark_allowance_usd": str(allowance),
                      "heldout_access_enabled": False,
                      "sensitive_balance_values_recorded": False,
                      "financial_snapshot": financial_snapshot,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          rm .benchmark-evidence/financial-snapshot.json
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_BENCHMARK_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-benchmark-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Atomically reserve the signed campaign capacity
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Missing AWS_TERRAFORM_STATE_BUCKET variable}"
          python -m pip install --disable-pip-version-check pydantic==2.13.5
          PYTHONPATH=src python scripts/reserve_financial_capacity.py reserve \
            --bucket "${TF_STATE_BUCKET}" \
            --output financial-capacity-reservation.json
      - name: Bind the benchmark to the current promoted release
        shell: bash
        run: |
          set -euo pipefail
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json > current-pointer-head.json
          pointer_version_id="$(jq -er '.VersionId' current-pointer-head.json)"
          pointer_etag="$(jq -er '.ETag' current-pointer-head.json)"
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            --version-id "${pointer_version_id}" \
            current-pointer.json > current-pointer-get.json
          jq -e \
            --arg version "${pointer_version_id}" \
            --arg etag "${pointer_etag}" \
            '.VersionId == $version and .ETag == $etag' \
            current-pointer-get.json >/dev/null
          jq -e \
            --arg release "${RELEASE_ID}" \
            --arg model "${MODEL_ID}" \
             '.release_id == $release and .model_id == $model and
               ((.evidence_mode == "validation_only" and
                 .bundle_s3_key == ("promoted/" + $model + "/")) or
                (.evidence_mode == "verified" and
                 .bundle_s3_key == ("promoted/releases/" + $release + "/"))) and
               (.git_sha | test("^[0-9a-f]{40}$"))' \
            current-pointer.json >/dev/null
          bundle_s3_key="$(jq -er '.bundle_s3_key' current-pointer.json)"
          [[ "${bundle_s3_key}" =~ ^promoted/[A-Za-z0-9._@/-]+/$ ]]
          [[ "${bundle_s3_key}" != *".."* ]]
          aws s3 cp \
            "s3://${ARTIFACT_BUCKET}/${bundle_s3_key}release-manifest.json" \
            release-manifest.json --no-progress
          aws s3 cp \
            "s3://${ARTIFACT_BUCKET}/${bundle_s3_key}bundle-checksums.json" \
            bundle-checksums.json --no-progress
          aws s3 cp \
            "s3://${ARTIFACT_BUCKET}/${bundle_s3_key}public-evidence.json" \
            public-evidence.json --no-progress
          aws s3 cp \
            "s3://${ARTIFACT_BUCKET}/${bundle_s3_key}curated-queries.json" \
            curated-queries.json --no-progress
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "public/${RELEASE_ID}/deployment-evidence.json" \
            > deployment-evidence-head.json
          deployment_version_id="$(jq -er '.VersionId' deployment-evidence-head.json)"
          deployment_etag="$(jq -er '.ETag' deployment-evidence-head.json)"
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "public/${RELEASE_ID}/deployment-evidence.json" \
            --version-id "${deployment_version_id}" \
            deployment-evidence.json > deployment-evidence-get.json
          jq -e \
            --arg version "${deployment_version_id}" \
            --arg etag "${deployment_etag}" \
            '.VersionId == $version and .ETag == $etag' \
            deployment-evidence-get.json >/dev/null
          aws s3 cp \
            "s3://${ARTIFACT_BUCKET}/${bundle_s3_key}LICENSE" \
            LICENSE --no-progress
          aws s3 cp \
            "s3://${ARTIFACT_BUCKET}/${bundle_s3_key}NOTICE" \
            NOTICE --no-progress
          evidence_mode="$(jq -r '.evidence_mode' current-pointer.json)"
          case "${evidence_mode}" in
            validation_only)
              aws s3 cp \
                "s3://${ARTIFACT_BUCKET}/${bundle_s3_key}baseline-summary.json" \
                baseline-summary.json --no-progress
              ;;
            verified)
              aws s3 cp \
                "s3://${ARTIFACT_BUCKET}/${bundle_s3_key}evaluation-report.json" \
                evaluation-report.json --no-progress
              aws s3 cp \
                "s3://${ARTIFACT_BUCKET}/${bundle_s3_key}evaluation-provenance.json" \
                evaluation-provenance.json --no-progress
              ;;
            *)
              echo "Unsupported release evidence mode" >&2
              exit 1
              ;;
          esac
          aws s3api list-objects-v2 \
            --bucket "${ARTIFACT_BUCKET}" \
            --prefix "${bundle_s3_key}" > promoted-bundle-objects.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          SHA256 = re.compile(r"^sha256:[0-9a-f]{64}$")

          def digest(path: Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          def require_sha256(value: object, label: str) -> str:
              if not isinstance(value, str) or SHA256.fullmatch(value) is None:
                  raise SystemExit(f"{label} is not a canonical SHA-256 identity")
              return value

          pointer = json.loads(Path("current-pointer.json").read_text(encoding="utf-8"))
          manifest_path = Path("release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          checksums = json.loads(Path("bundle-checksums.json").read_text(encoding="utf-8"))
          public = json.loads(Path("public-evidence.json").read_text(encoding="utf-8"))
          objects = json.loads(Path("promoted-bundle-objects.json").read_text(encoding="utf-8"))
          expected_release = os.environ["RELEASE_ID"]
          expected_model = os.environ["MODEL_ID"]
          if manifest.get("release_id") != expected_release:
              raise SystemExit("release manifest does not bind the requested immutable release")
          if manifest.get("promoted_model_id") != expected_model:
              raise SystemExit("release manifest does not bind the requested immutable model")
          expected_prefix = (
              f"promoted/{expected_model}/"
              if pointer.get("evidence_mode") == "validation_only"
              else f"promoted/releases/{expected_release}/"
          )
          if pointer.get("bundle_s3_key") != expected_prefix:
              raise SystemExit("promotion pointer bundle prefix is not canonical")
          mode = manifest.get("evidence_mode")
          if mode not in {"validation_only", "verified"}:
              raise SystemExit("release manifest has an unsupported evidence mode")
          if mode != pointer.get("evidence_mode") or mode != public.get("evidence_mode"):
              raise SystemExit("pointer, manifest, and public evidence modes differ")

          files = checksums.get("files")
          if checksums.get("schema_version") != "1.0.0" or not isinstance(files, dict):
              raise SystemExit("bundle checksum inventory has an invalid schema")
          if any(require_sha256(value, f"bundle checksum for {name}") != value for name, value in files.items()):
              raise SystemExit("bundle checksum inventory is invalid")
          prefix = expected_prefix
          if objects.get("IsTruncated"):
              raise SystemExit("promoted bundle inventory response was unexpectedly truncated")
          object_names = {
              item["Key"][len(prefix):]
              for item in objects.get("Contents", [])
              if isinstance(item.get("Key"), str) and item["Key"].startswith(prefix)
          }
          if object_names != set(files) | {"bundle-checksums.json"}:
              raise SystemExit("S3 object inventory differs from the checksummed release inventory")

          mode_files = (
              {"baseline-summary.json"}
              if mode == "validation_only"
              else {"evaluation-report.json", "evaluation-provenance.json"}
          )
          local_files = {
              "release-manifest.json",
              "public-evidence.json",
              "curated-queries.json",
              "LICENSE",
              "NOTICE",
              *mode_files,
          }
          for name in local_files:
              path = Path(name)
              if not path.is_file() or files.get(name) != digest(path):
                  raise SystemExit(f"release artifact checksum is absent or invalid: {name}")

          artifact_checksums = manifest.get("artifact_checksums")
          expected_artifacts = {
              "public-evidence.json",
              "curated-queries.json",
              "LICENSE",
              "NOTICE",
              *mode_files,
          }
          if not isinstance(artifact_checksums, dict) or set(artifact_checksums) != expected_artifacts:
              raise SystemExit("release manifest public artifact inventory is not exact")
          for name in expected_artifacts:
              if artifact_checksums[name] != files[name]:
                  raise SystemExit(f"release manifest and bundle checksum differ: {name}")

          dataset_hash = require_sha256(
              manifest.get("dataset_manifest_hash"), "release dataset content identity"
          )
          split_hash = require_sha256(
              manifest.get("split_manifest_hash"), "release split manifest identity"
          )
          models = manifest.get("models")
          if not isinstance(models, list) or not models:
              raise SystemExit("release manifest has no model inventory")
          selected = [item for item in models if item.get("model_id") == expected_model]
          if len(selected) != 1:
              raise SystemExit("promoted model is absent or duplicated in the release manifest")
          model_checksum = require_sha256(
              selected[0].get("artifact_checksum"), "promoted model artifact checksum"
          )

          run = public.get("run")
          evaluation = public.get("evaluation")
          analysis = public.get("failure_analysis")
          if public.get("schema_version") != "1.0.0" or not all(
              isinstance(item, dict) for item in (run, evaluation, analysis)
          ):
              raise SystemExit("public evidence envelope is incomplete")
          assert isinstance(run, dict) and isinstance(evaluation, dict) and isinstance(analysis, dict)
          run_id = run.get("run_id")
          if not isinstance(run_id, str) or not run_id or {
              run_id, evaluation.get("run_id"), analysis.get("run_id")
          } != {run_id}:
              raise SystemExit("public evidence sections do not share one run ID")
          if any(item.get("evidence_mode") != mode for item in (run, evaluation, analysis)):
              raise SystemExit("public evidence sections do not share the release mode")
          if run.get("dataset_manifest_hash") != dataset_hash:
              raise SystemExit("public run and release dataset identities differ")
          if run.get("split_manifest_hash") != split_hash:
              raise SystemExit("public run and release split identities differ")
          if run.get("git_sha") != manifest.get("git_sha"):
              raise SystemExit("public run and release Git identities differ")
          if run.get("model_artifact_checksum") != model_checksum:
              raise SystemExit("public run and promoted model checksums differ")
          if mode == "validation_only":
              if (
                  run.get("status") != "validation_only"
                  or run.get("selected_model_id") != expected_model
                  or run.get("test_access_count") != 0
                  or run.get("held_out_claims_allowed") is not False
                  or evaluation.get("status") != "validation_only"
                  or evaluation.get("selected_model_id") != expected_model
                  or evaluation.get("test_access_count") != 0
                  or evaluation.get("held_out") is not False
                  or evaluation.get("evidence_id") != manifest.get("evaluation_report_id")
                  or analysis.get("status") != "not_performed"
              ):
                  raise SystemExit("validation-only public evidence semantics are invalid")
          else:
              status = evaluation.get("release_status")
              decision_valid = (
                  status == "passed"
                  and evaluation.get("candidate_model_id") == expected_model
                  and pointer.get("gate_passed") is True
                  and pointer.get("release_decision") == "promote_candidate"
              ) or (
                  status == "failed"
                  and evaluation.get("strongest_baseline_model_id") == expected_model
                  and evaluation.get("candidate_model_id") != expected_model
                  and pointer.get("gate_passed") is False
                  and pointer.get("release_decision") == "retain_baseline"
                  and (pointer.get("previous") or {}).get("model_id") == expected_model
              )
              if (
                  run.get("status") != "complete"
                  or not isinstance(run.get("test_access_count"), int)
                  or run["test_access_count"] < 1
                  or evaluation.get("report_id") != manifest.get("evaluation_report_id")
                  or not decision_valid
              ):
                  raise SystemExit("verified public evidence semantics are invalid")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"PUBLIC_RUN_ID={run_id}\n")
              handle.write(f"EVIDENCE_MODE={mode}\n")
              handle.write(f"DATASET_MANIFEST_HASH={dataset_hash}\n")
              handle.write(f"SPLIT_MANIFEST_HASH={split_hash}\n")
              handle.write(f"MODEL_ARTIFACT_CHECKSUM={model_checksum}\n")
          PY
      - name: Verify the live bounded Lambda configuration
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-alias \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --name production > lambda-alias-raw.json
          aws lambda get-function \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --qualifier production > lambda-function-private.json

          set +e
          aws lambda get-provisioned-concurrency-config \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --qualifier production \
            > lambda-provisioned-raw.json 2> lambda-provisioned-error.txt
          provisioned_status=$?
          set -e
          if [[ "${provisioned_status}" -eq 0 ]]; then
            echo "A provisioned-concurrency configuration exists; the zero-provisioned invariant failed." >&2
            exit 1
          fi
          if ! grep -Eq 'ResourceNotFoundException|ProvisionedConcurrencyConfigNotFoundException' lambda-provisioned-error.txt; then
            cat lambda-provisioned-error.txt >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          alias = json.loads(Path("lambda-alias-raw.json").read_text(encoding="utf-8"))
          function = json.loads(Path("lambda-function-private.json").read_text(encoding="utf-8"))
          config = function.get("Configuration", {})
          concurrency = function.get("Concurrency", {})
          architectures = config.get("Architectures")
          if config.get("MemorySize") != 4096:
              raise SystemExit("live Lambda memory must remain exactly 4096 MB")
          if architectures != ["x86_64"]:
              raise SystemExit("live Lambda architecture must remain exactly x86_64")
          if concurrency.get("ReservedConcurrentExecutions") != 2:
              raise SystemExit("live Lambda reserved concurrency must remain exactly two")
          if alias.get("Name") != "production" or alias.get("FunctionVersion") != config.get("Version"):
              raise SystemExit("production alias and queried immutable Lambda version do not agree")
          deployment = json.loads(Path("deployment-evidence.json").read_text(encoding="utf-8"))
          cold = deployment.get("controlled_cold_start")
          if (
              deployment.get("release_id") != os.environ["RELEASE_ID"]
              or deployment.get("model_id") != os.environ["MODEL_ID"]
              or deployment.get("production_lambda_version") != config.get("Version")
              or not isinstance(cold, dict)
              or cold.get("controlled_cold_start") is not True
              or cold.get("excluded_from_warm_samples") is not True
              or cold.get("identifiers", {}).get("function_version") != config.get("Version")
              or cold.get("identifiers", {}).get("function_name")
              != os.environ["LAMBDA_FUNCTION_NAME"]
              or cold.get("control_proof", {}).get("provisioned_concurrency") != 0
          ):
              raise SystemExit("deployment cold-start evidence is not bound to the live release")
          sanitized = {
              "schema_version": "1.0.0",
              "checked_at": datetime.now(UTC).isoformat(),
              "benchmark_run_id": os.environ["BENCHMARK_RUN_ID"],
              "release_id": os.environ["RELEASE_ID"],
              "model_id": os.environ["MODEL_ID"],
              "function_name": os.environ["LAMBDA_FUNCTION_NAME"],
              "alias": "production",
              "function_version": config["Version"],
              "memory_mb": config["MemorySize"],
              "architecture": architectures[0],
              "reserved_concurrency": concurrency["ReservedConcurrentExecutions"],
              "provisioned_concurrency": 0,
              "provisioned_concurrency_verification": (
                  "live GetProvisionedConcurrencyConfig returned a not-found response"
              ),
              "region": os.environ["AWS_REGION"],
          }
          Path(".benchmark-evidence/lambda-configuration.json").write_text(
              json.dumps(sanitized, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Execute the fixed public performance matrix
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/validate_financial_snapshot.py verify \
            --cost-preflight .benchmark-evidence/cost-preflight.json
          python - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import json
          import math
          import os
          import statistics
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          from collections import Counter
          from datetime import UTC, datetime
          from pathlib import Path
          from typing import Any

          CANDIDATE_COUNTS = (10, 20, 40)
          OFFERED_CONCURRENCY = (1, 4, 8)
          WARMUP_REQUESTS = 10
          MEASURED_REQUESTS = 200
          MAX_RESPONSE_BYTES = 1_048_576
          REQUEST_TIMEOUT_SECONDS = 20
          BASE_URL = os.environ["BENCHMARK_BASE_URL"]
          MODEL_ID = os.environ["MODEL_ID"]
          PUBLIC_RUN_ID = os.environ["PUBLIC_RUN_ID"]
          EVIDENCE_MODE = os.environ["EVIDENCE_MODE"]
          DATASET_MANIFEST_HASH = os.environ["DATASET_MANIFEST_HASH"]
          SPLIT_MANIFEST_HASH = os.environ["SPLIT_MANIFEST_HASH"]
          MODEL_ARTIFACT_CHECKSUM = os.environ["MODEL_ARTIFACT_CHECKSUM"]

          def request_json(path: str, payload: dict[str, Any] | None = None) -> tuple[Any, float, int]:
              request = urllib.request.Request(
                  urllib.parse.urljoin(BASE_URL + "/", path.lstrip("/")),
                  data=None if payload is None else json.dumps(payload).encode("utf-8"),
                  method="GET" if payload is None else "POST",
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "Content-Type": "application/json",
                      "User-Agent": "search-rank-release-benchmark/1.0",
                  },
              )
              started = time.perf_counter()
              with urllib.request.urlopen(request, timeout=REQUEST_TIMEOUT_SECONDS) as response:
                  raw = response.read(MAX_RESPONSE_BYTES + 1)
                  status = int(response.status)
              elapsed = (time.perf_counter() - started) * 1000.0
              if len(raw) > MAX_RESPONSE_BYTES:
                  raise RuntimeError("response_too_large")
              return json.loads(raw), elapsed, status

          def percentile(values: list[float], probability: float) -> float:
              ordered = sorted(values)
              position = (len(ordered) - 1) * probability
              lower = math.floor(position)
              upper = math.ceil(position)
              if lower == upper:
                  return ordered[lower]
              fraction = position - lower
              return ordered[lower] * (1.0 - fraction) + ordered[upper] * fraction

          def latency_summary(values: list[float]) -> dict[str, float] | None:
              if not values:
                  return None
              return {
                  "p50": percentile(values, 0.50),
                  "p95": percentile(values, 0.95),
                  "p99": percentile(values, 0.99),
                  "mean": statistics.fmean(values),
                  "minimum": min(values),
                  "maximum": max(values),
              }

          def rank_once(query_id: str, candidate_count: int, ordinal: int) -> dict[str, Any]:
              payload = {"query_id": query_id, "model_id": MODEL_ID, "top_k": candidate_count}
              request = urllib.request.Request(
                  urllib.parse.urljoin(BASE_URL + "/", "api/v1/rank"),
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "Content-Type": "application/json",
                      "User-Agent": "search-rank-release-benchmark/1.0",
                  },
              )
              started = time.perf_counter()
              try:
                  with urllib.request.urlopen(request, timeout=REQUEST_TIMEOUT_SECONDS) as response:
                      raw = response.read(MAX_RESPONSE_BYTES + 1)
                      status = int(response.status)
                  elapsed = (time.perf_counter() - started) * 1000.0
                  if len(raw) > MAX_RESPONSE_BYTES:
                      raise RuntimeError("response_too_large")
                  body = json.loads(raw)
                  model_ms = float(body["latency_ms"])
                  if (
                      status != 200
                      or body.get("query_id") != query_id
                      or body.get("model_id") != MODEL_ID
                      or body.get("dataset_manifest_hash") != DATASET_MANIFEST_HASH
                      or body.get("model_artifact_checksum") != MODEL_ARTIFACT_CHECKSUM
                      or body.get("candidate_count") != candidate_count
                      or body.get("top_k") != candidate_count
                      or len(body.get("results", [])) != candidate_count
                      or not math.isfinite(model_ms)
                      or model_ms < 0
                  ):
                      raise ValueError("invalid_rank_contract")
                  return {
                      "ordinal": ordinal,
                      "ok": True,
                      "http_status": status,
                      "throttled": False,
                      "end_to_end_ms": elapsed,
                      "model_ms": model_ms,
                  }
              except urllib.error.HTTPError as error:
                  elapsed = (time.perf_counter() - started) * 1000.0
                  marker = str(error.headers.get("x-amzn-ErrorType", ""))
                  throttled = error.code == 429 or "throttl" in marker.lower()
                  return {
                      "ordinal": ordinal,
                      "ok": False,
                      "http_status": int(error.code),
                      "throttled": throttled,
                      "end_to_end_ms": elapsed,
                      "error_category": "http_throttle" if throttled else "http_error",
                  }
              except (json.JSONDecodeError, KeyError, TypeError, ValueError, RuntimeError):
                  return {
                      "ordinal": ordinal,
                      "ok": False,
                      "http_status": 200,
                      "throttled": False,
                      "end_to_end_ms": (time.perf_counter() - started) * 1000.0,
                      "error_category": "invalid_response",
                  }
              except (TimeoutError, OSError, urllib.error.URLError):
                  return {
                      "ordinal": ordinal,
                      "ok": False,
                      "http_status": None,
                      "throttled": False,
                      "end_to_end_ms": (time.perf_counter() - started) * 1000.0,
                      "error_category": "transport_error",
                  }

          def run_samples(
              query_id: str, candidate_count: int, offered_concurrency: int, count: int
          ) -> list[dict[str, Any]]:
              with concurrent.futures.ThreadPoolExecutor(
                  max_workers=offered_concurrency
              ) as executor:
                  return list(
                      executor.map(
                          lambda ordinal: rank_once(query_id, candidate_count, ordinal),
                          range(1, count + 1),
                      )
                  )

          def sample_summary(samples: list[dict[str, Any]]) -> dict[str, Any]:
              successes = [sample for sample in samples if sample["ok"]]
              status_counts = Counter(
                  str(sample["http_status"])
                  if sample.get("http_status") is not None
                  else str(sample["error_category"])
                  for sample in samples
              )
              end_to_end = [float(sample["end_to_end_ms"]) for sample in successes]
              model = [float(sample["model_ms"]) for sample in successes]
              return {
                  "sample_count": len(samples),
                  "success_count": len(successes),
                  "error_count": len(samples) - len(successes),
                  "throttle_count": sum(bool(sample["throttled"]) for sample in samples),
                  "http_status_and_transport_counts": dict(sorted(status_counts.items())),
                  "end_to_end_latency_ms": latency_summary(end_to_end),
                  "model_latency_ms": latency_summary(model),
                  "samples": samples,
              }

          started_at = datetime.now(UTC).isoformat()
          observation_nonce = uuid.uuid4().hex
          health, health_ms, health_status = request_json(
              f"/healthz?benchmark={observation_nonce}"
          )
          if health_status != 200 or health.get("status") != "ok":
              raise SystemExit("first health request did not satisfy the public contract")
          ready, ready_ms, ready_status = request_json(
              f"/readyz?benchmark={observation_nonce}"
          )
          if (
              ready_status != 200
              or ready.get("status") != "ready"
              or ready.get("model_id") != MODEL_ID
              or ready.get("dataset_manifest_hash") != DATASET_MANIFEST_HASH
          ):
              raise SystemExit("public readiness does not bind the requested promoted model")
          models, models_ms, models_status = request_json("/api/v1/models")
          selected_models = (
              [item for item in models if item.get("model_id") == MODEL_ID]
              if isinstance(models, list)
              else []
          )
          if (
              models_status != 200
              or len(selected_models) != 1
              or selected_models[0].get("artifact_checksum") != MODEL_ARTIFACT_CHECKSUM
          ):
              raise SystemExit("requested model is absent from the public model registry")
          queries, queries_ms, queries_status = request_json("/api/v1/queries?limit=50")
          if queries_status != 200 or not isinstance(queries, list):
              raise SystemExit("public curated-query registry is unavailable")
          run_path = "/api/v1/runs/" + urllib.parse.quote(PUBLIC_RUN_ID, safe="")
          run_evidence, run_ms, run_status = request_json(run_path)
          if (
              run_status != 200
              or run_evidence.get("schema_version") != "1.0.0"
              or run_evidence.get("evidence_mode") != EVIDENCE_MODE
              or run_evidence.get("run", {}).get("run_id") != PUBLIC_RUN_ID
              or run_evidence.get("run", {}).get("dataset_manifest_hash")
              != DATASET_MANIFEST_HASH
              or run_evidence.get("run", {}).get("split_manifest_hash")
              != SPLIT_MANIFEST_HASH
              or run_evidence.get("run", {}).get("model_artifact_checksum")
              != MODEL_ARTIFACT_CHECKSUM
          ):
              raise SystemExit("public run endpoint is not bound to the promoted release")
          if EVIDENCE_MODE == "validation_only":
              if (
                  run_evidence.get("run", {}).get("selected_model_id") != MODEL_ID
                  or run_evidence.get("run", {}).get("held_out_claims_allowed") is not False
              ):
                  raise SystemExit("validation-only run endpoint semantics are invalid")
          else:
              evaluation = run_evidence.get("evaluation", {})
              status = evaluation.get("release_status")
              verified_semantics = (
                  status == "passed"
                  and evaluation.get("candidate_model_id") == MODEL_ID
              ) or (
                  status == "failed"
                  and evaluation.get("strongest_baseline_model_id") == MODEL_ID
                  and evaluation.get("candidate_model_id") != MODEL_ID
              )
              if not verified_semantics:
                  raise SystemExit("verified run endpoint semantics are invalid")
          by_count: dict[int, str] = {}
          for count in CANDIDATE_COUNTS:
              candidates = sorted(
                  str(item["query_id"])
                  for item in queries
                  if int(item.get("candidate_count", -1)) == count
              )
              if not candidates:
                  raise SystemExit(f"no curated public query has candidate_count={count}")
              by_count[count] = candidates[0]

          first_rank = rank_once(by_count[40], 40, 1)
          if not first_rank["ok"]:
              raise SystemExit("the separately recorded first rank request failed")

          conditions: list[dict[str, Any]] = []
          for candidate_count in CANDIDATE_COUNTS:
              query_id = by_count[candidate_count]
              for offered_concurrency in OFFERED_CONCURRENCY:
                  print(
                      f"candidate_count={candidate_count}, offered_concurrency={offered_concurrency}: "
                      f"{WARMUP_REQUESTS} warmups then {MEASURED_REQUESTS} measured requests",
                      flush=True,
                  )
                  warmups = run_samples(
                      query_id, candidate_count, offered_concurrency, WARMUP_REQUESTS
                  )
                  measured = run_samples(
                      query_id, candidate_count, offered_concurrency, MEASURED_REQUESTS
                  )
                  conditions.append(
                      {
                          "candidate_count": candidate_count,
                          "query_id": query_id,
                          "offered_concurrency": offered_concurrency,
                          "warmup": sample_summary(warmups),
                          "measured": sample_summary(measured),
                      }
                  )

          primary_condition = next(
              condition
              for condition in conditions
              if condition["candidate_count"] == 40
              and condition["offered_concurrency"] == 1
          )
          for condition in conditions:
              if condition["warmup"]["success_count"] < 1:
                  raise SystemExit(
                      "every benchmark condition requires at least one successful warmup"
                  )
              minimum_successes = 199 if condition is primary_condition else 20
              if condition["measured"]["success_count"] < minimum_successes:
                  raise SystemExit(
                      "benchmark success floor failed for "
                      f"candidate_count={condition['candidate_count']}, "
                      f"offered_concurrency={condition['offered_concurrency']}: "
                      f"{condition['measured']['success_count']} < {minimum_successes}"
                  )

          lambda_config = json.loads(
              Path(".benchmark-evidence/lambda-configuration.json").read_text(encoding="utf-8")
          )
          pointer = json.loads(Path("current-pointer.json").read_text(encoding="utf-8"))
          pointer_head = json.loads(Path("current-pointer-head.json").read_text(encoding="utf-8"))
          manifest_bytes = Path("release-manifest.json").read_bytes()
          manifest = json.loads(manifest_bytes)
          public_evidence_bytes = Path("public-evidence.json").read_bytes()
          bundle_checksums_bytes = Path("bundle-checksums.json").read_bytes()
          deployment_evidence_bytes = Path("deployment-evidence.json").read_bytes()
          deployment_evidence = json.loads(deployment_evidence_bytes)
          deployment_evidence_head = json.loads(
              Path("deployment-evidence-head.json").read_text(encoding="utf-8")
          )
          controlled_cold_start = deployment_evidence["controlled_cold_start"]
          measured_samples = [
              sample for condition in conditions for sample in condition["measured"]["samples"]
          ]
          warmup_samples = [
              sample for condition in conditions for sample in condition["warmup"]["samples"]
          ]
          report = {
              "schema_version": "1.0.0",
              "artifact_type": "serving_performance_report",
              "status": "completed",
              "scope": "manual_post_deployment_lambda_performance_protocol",
              "started_at": started_at,
              "completed_at": datetime.now(UTC).isoformat(),
              "identifiers": {
                  "benchmark_run_id": os.environ["BENCHMARK_RUN_ID"],
                  "release_id": os.environ["RELEASE_ID"],
                  "public_run_id": PUBLIC_RUN_ID,
                  "model_id": MODEL_ID,
                  "evidence_mode": EVIDENCE_MODE,
                  "release_git_sha": pointer["git_sha"],
                  "benchmark_harness_git_sha": os.environ["GITHUB_SHA"],
                  "dataset_manifest_hash": manifest["dataset_manifest_hash"],
                  "model_artifact_checksum": MODEL_ARTIFACT_CHECKSUM,
                  "region": os.environ["AWS_REGION"],
                  "public_origin": BASE_URL,
              },
              "release_binding": {
                  "promotion_pointer_version_id": pointer_head.get("VersionId"),
                  "promotion_pointer_etag": pointer_head.get("ETag"),
                  "bundle_s3_key": pointer["bundle_s3_key"],
                  "release_manifest_sha256": "sha256:"
                  + __import__("hashlib").sha256(manifest_bytes).hexdigest(),
                  "public_evidence_sha256": "sha256:"
                  + __import__("hashlib").sha256(public_evidence_bytes).hexdigest(),
                  "bundle_checksums_sha256": "sha256:"
                  + __import__("hashlib").sha256(bundle_checksums_bytes).hexdigest(),
                  "deployment_evidence_version_id": deployment_evidence_head.get("VersionId"),
                  "deployment_evidence_etag": deployment_evidence_head.get("ETag"),
                  "deployment_evidence_sha256": "sha256:"
                  + __import__("hashlib").sha256(deployment_evidence_bytes).hexdigest(),
              },
              "lambda_configuration": lambda_config,
              "controlled_cold_start": controlled_cold_start,
              "protocol": {
                  "measurement_class": "warm_after_explicit_per_condition_warmups",
                  "candidate_counts": list(CANDIDATE_COUNTS),
                  "offered_concurrency_levels": list(OFFERED_CONCURRENCY),
                  "warmup_requests_per_condition": WARMUP_REQUESTS,
                  "measured_requests_per_condition": MEASURED_REQUESTS,
                  "condition_count": len(conditions),
                  "request_timeout_seconds": REQUEST_TIMEOUT_SECONDS,
                  "response_size_limit_bytes": MAX_RESPONSE_BYTES,
                  "minimum_warmup_successes_per_condition": 1,
                  "primary_latency_candidate_count": 40,
                  "primary_latency_offered_concurrency": 1,
                  "primary_latency_minimum_successes": 199,
                  "secondary_latency_minimum_successes": 20,
                  "controlled_cold_sample_included": False,
                  "pre_benchmark_observations_included": False,
              },
              "pre_benchmark_observations": {
                  "cold_start_controlled": False,
                  "health": {
                      "http_status": health_status,
                      "end_to_end_ms": health_ms,
                      "service_status": health["status"],
                  },
                  "ready": {"http_status": ready_status, "end_to_end_ms": ready_ms},
                  "models": {"http_status": models_status, "end_to_end_ms": models_ms},
                  "queries": {"http_status": queries_status, "end_to_end_ms": queries_ms},
                  "run_evidence": {"http_status": run_status, "end_to_end_ms": run_ms},
                  "first_rank": first_rank,
                  "excluded_from_warm_latency_percentiles": True,
              },
              "conditions": conditions,
              "totals": {
                  "warmup_request_count": len(warmup_samples),
                  "measured_request_count": len(measured_samples),
                  "measured_success_count": sum(bool(sample["ok"]) for sample in measured_samples),
                  "measured_error_count": sum(not bool(sample["ok"]) for sample in measured_samples),
                  "measured_throttle_count": sum(
                      bool(sample["throttled"]) for sample in measured_samples
                  ),
              },
              "interpretation": {
                  "latency_claim": (
                      "Warm public CloudFront end-to-end and model latency over successful "
                      "responses after explicit warmups. The primary 40-candidate, concurrency-one "
                      "condition has at least 199 successes from 200 attempts (error rate below "
                      "one percent); every secondary condition has at least 20 successes. The "
                      "controlled candidate cold start is reported separately."
                  ),
                  "throughput_claim_eligible": False,
                  "scaling_claim_eligible": False,
                  "concurrency_above_reserved_expected_to_expose_bound": [4, 8],
                  "reserved_concurrency_is_a_cost_and_capacity_bound": True,
              },
              "limitations": [
                  "Offered client concurrency is not a throughput or autoscaling measurement.",
                  "Concurrency four and eight exceed reserved Lambda concurrency two and may throttle by design.",
                  "Pre-benchmark observations are not treated as cold or warm latency samples.",
                  "The controlled cold-start section is one observation, not a distribution.",
                   "Client timing includes CloudFront, API Gateway, network, serialization, and model work.",
                   "Latency percentiles are emitted only after the explicit per-condition success floors pass.",
                   "No hidden or held-out evaluation data is accessed by this public serving benchmark.",
              ],
          }
          Path(".benchmark-evidence/performance-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Validate and checksum the complete evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          import statistics
          from collections import Counter
          from datetime import UTC, datetime
          from pathlib import Path

          root = Path(".benchmark-evidence")
          report_path = root / "performance-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          config = json.loads((root / "lambda-configuration.json").read_text(encoding="utf-8"))
          cost = json.loads((root / "cost-preflight.json").read_text(encoding="utf-8"))
          if (
              cost.get("schema_version") != "1.0.0"
              or cost.get("artifact_type") != "benchmark_cost_preflight"
              or cost.get("status") != "passed"
              or cost.get("maximum_out_of_pocket_usd") != "0"
              or cost.get("heldout_access_enabled") is not False
              or cost.get("sensitive_balance_values_recorded") is not False
          ):
              raise SystemExit("benchmark cost preflight contract is invalid")
          if (
              report.get("schema_version") != "1.0.0"
              or report.get("artifact_type") != "serving_performance_report"
              or report.get("status") != "completed"
          ):
              raise SystemExit("benchmark report is not complete")
          identifiers = report.get("identifiers", {})
          if identifiers.get("release_id") != os.environ["RELEASE_ID"]:
              raise SystemExit("benchmark release identifier changed")
          if identifiers.get("model_id") != os.environ["MODEL_ID"]:
              raise SystemExit("benchmark model identifier changed")
          if identifiers.get("public_run_id") != os.environ["PUBLIC_RUN_ID"]:
              raise SystemExit("benchmark public run identifier changed")
          if identifiers.get("evidence_mode") != os.environ["EVIDENCE_MODE"]:
              raise SystemExit("benchmark evidence mode changed")
          if identifiers.get("dataset_manifest_hash") != os.environ["DATASET_MANIFEST_HASH"]:
              raise SystemExit("benchmark dataset identity changed")
          if identifiers.get("region") != "us-east-1":
              raise SystemExit("benchmark region changed")
          if identifiers.get("benchmark_harness_git_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("benchmark harness commit changed")
          binding = report.get("release_binding", {})
          for name in (
              "release_manifest_sha256",
              "public_evidence_sha256",
              "bundle_checksums_sha256",
              "deployment_evidence_sha256",
          ):
              value = binding.get(name)
              if not isinstance(value, str) or len(value) != 71 or not value.startswith("sha256:"):
                  raise SystemExit(f"benchmark release binding is invalid: {name}")
          if (
              config.get("memory_mb") != 4096
              or config.get("architecture") != "x86_64"
              or config.get("reserved_concurrency") != 2
              or config.get("provisioned_concurrency") != 0
          ):
              raise SystemExit("bounded Lambda configuration is not exact")
          if not isinstance(binding.get("deployment_evidence_version_id"), str) or not binding[
              "deployment_evidence_version_id"
          ]:
              raise SystemExit("deployment evidence must be read from a versioned S3 object")

          controlled_cold = report.get("controlled_cold_start")
          if not isinstance(controlled_cold, dict):
              raise SystemExit("controlled cold-start evidence is absent")
          cold_ids = controlled_cold.get("identifiers", {})
          proof = controlled_cold.get("control_proof", {})
          first_request = controlled_cold.get("first_request", {})
          lambda_report = controlled_cold.get("lambda_report", {})
          structured_startup = controlled_cold.get("structured_startup", {})
          structured_request = controlled_cold.get("structured_request", {})
          if (
              controlled_cold.get("status") != "measured"
              or controlled_cold.get("measurement_class")
              != "controlled_on_demand_lambda_cold_start"
              or controlled_cold.get("controlled_cold_start") is not True
              or controlled_cold.get("sample_count") != 1
              or controlled_cold.get("excluded_from_warm_samples") is not True
              or cold_ids.get("release_id") != os.environ["RELEASE_ID"]
              or cold_ids.get("model_id") != os.environ["MODEL_ID"]
              or cold_ids.get("dataset_manifest_hash")
              != os.environ["DATASET_MANIFEST_HASH"]
              or cold_ids.get("model_artifact_checksum")
              != os.environ["MODEL_ARTIFACT_CHECKSUM"]
              or cold_ids.get("function_name") != config.get("function_name")
              or cold_ids.get("function_version") != config.get("function_version")
              or cold_ids.get("region") != "us-east-1"
              or proof
              != {
                  **{
                      "newly_published_after_apply_started": True,
                      "candidate_version_changed": True,
                      "new_version_prior_cloudwatch_event_count": 0,
                      "on_demand_execution": True,
                      "reserved_concurrency": 2,
                      "provisioned_concurrency": 0,
                  },
                  "previous_candidate_version": proof.get("previous_candidate_version"),
              }
              or not isinstance(proof.get("previous_candidate_version"), str)
              or proof.get("previous_candidate_version") == cold_ids.get("function_version")
              or first_request.get("route") != "/api/v1/rank"
              or first_request.get("http_status") != 200
              or first_request.get("candidate_count") != 40
              or structured_startup.get("startup_succeeded") is not True
          ):
              raise SystemExit("controlled cold-start identity or control proof is invalid")
          for label, value in {
              "first request end-to-end": first_request.get("end_to_end_latency_ms"),
              "first request model": first_request.get("model_latency_ms"),
              "CloudWatch Init Duration": lambda_report.get("init_duration_ms"),
              "Lambda invocation duration": lambda_report.get("invocation_duration_ms"),
              "Lambda billed duration": lambda_report.get("billed_duration_ms"),
              "Lambda max memory": lambda_report.get("max_memory_used_mb"),
              "structured model load": structured_startup.get("model_load_duration_ms"),
              "structured process memory": structured_request.get("process_peak_memory_mb"),
          }.items():
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise SystemExit(f"controlled cold-start {label} is not numeric")
              if not math.isfinite(float(value)) or float(value) <= 0:
                  raise SystemExit(f"controlled cold-start {label} is not positive and finite")
          if (
              lambda_report.get("configured_memory_mb") != 4096
              or float(lambda_report["max_memory_used_mb"]) > 4096
              or float(structured_request["process_peak_memory_mb"]) > 4096
          ):
              raise SystemExit("controlled cold-start memory evidence exceeds the fixed bound")
          (root / "controlled-cold-start.json").write_text(
              json.dumps(controlled_cold, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          expected_conditions = {(count, concurrency) for count in (10, 20, 40) for concurrency in (1, 4, 8)}
          conditions = report.get("conditions", [])
          observed_conditions = {
              (condition.get("candidate_count"), condition.get("offered_concurrency"))
              for condition in conditions
          }
          if len(conditions) != 9 or observed_conditions != expected_conditions:
              raise SystemExit("benchmark condition matrix is incomplete or duplicated")
          protocol = report.get("protocol", {})
          if (
              protocol.get("measurement_class")
              != "warm_after_explicit_per_condition_warmups"
              or protocol.get("minimum_warmup_successes_per_condition") != 1
              or protocol.get("primary_latency_candidate_count") != 40
              or protocol.get("primary_latency_offered_concurrency") != 1
              or protocol.get("primary_latency_minimum_successes") != 199
              or protocol.get("secondary_latency_minimum_successes") != 20
              or protocol.get("controlled_cold_sample_included") is not False
              or protocol.get("pre_benchmark_observations_included") is not False
          ):
              raise SystemExit("warm protocol or its success floors are not exact")

          def percentile(values: list[float], probability: float) -> float:
              ordered = sorted(values)
              position = (len(ordered) - 1) * probability
              lower = math.floor(position)
              upper = math.ceil(position)
              if lower == upper:
                  return ordered[lower]
              fraction = position - lower
              return ordered[lower] * (1.0 - fraction) + ordered[upper] * fraction

          def validate_latency_summary(
              name: str, summary: object, values: list[float]
          ) -> None:
              if not values:
                  if summary is not None:
                      raise SystemExit(f"{name} must be null when there are no successful samples")
                  return
              if not isinstance(summary, dict):
                  raise SystemExit(f"{name} is absent for successful samples")
              expected = {
                  "p50": percentile(values, 0.50),
                  "p95": percentile(values, 0.95),
                  "p99": percentile(values, 0.99),
                  "mean": statistics.fmean(values),
                  "minimum": min(values),
                  "maximum": max(values),
              }
              for key, value in expected.items():
                  observed = float(summary.get(key, float("nan")))
                  if not math.isfinite(observed) or not math.isclose(
                      observed, value, rel_tol=1e-12, abs_tol=1e-9
                  ):
                      raise SystemExit(f"{name}.{key} does not match raw successful samples")

          all_measured = []
          all_warmups = []
          warmup_condition_success_counts = []
          secondary_condition_success_counts = []
          primary_condition_success_count = None
          for condition in conditions:
              for phase_name, expected_count in (("warmup", 10), ("measured", 200)):
                  phase = condition[phase_name]
                  samples = phase.get("samples", [])
                  if len(samples) != expected_count or phase.get("sample_count") != expected_count:
                      raise SystemExit(f"{phase_name} request count is not exact")
                  if [sample.get("ordinal") for sample in samples] != list(range(1, expected_count + 1)):
                      raise SystemExit(f"{phase_name} request ordinals are incomplete")
                  success_count = sum(bool(sample.get("ok")) for sample in samples)
                  error_count = expected_count - success_count
                  throttle_count = sum(bool(sample.get("throttled")) for sample in samples)
                  if (
                      phase.get("success_count") != success_count
                      or phase.get("error_count") != error_count
                      or phase.get("throttle_count") != throttle_count
                  ):
                      raise SystemExit(f"{phase_name} aggregate counts do not match raw samples")
                  statuses = Counter(
                      str(sample["http_status"])
                      if sample.get("http_status") is not None
                      else str(sample.get("error_category"))
                      for sample in samples
                  )
                  if phase.get("http_status_and_transport_counts") != dict(sorted(statuses.items())):
                      raise SystemExit(f"{phase_name} status counts do not match raw samples")
                  for sample in samples:
                      latency = float(sample.get("end_to_end_ms", -1))
                      if not math.isfinite(latency) or latency < 0:
                          raise SystemExit("a request has an invalid end-to-end latency")
                      if sample.get("ok"):
                          model_latency = float(sample.get("model_ms", -1))
                          if not math.isfinite(model_latency) or model_latency < 0:
                              raise SystemExit("a successful request has invalid model latency")
                          if sample.get("http_status") != 200 or sample.get("throttled") is not False:
                              raise SystemExit("a successful request has an inconsistent status")
                      elif sample.get("error_category") not in {
                          "http_throttle",
                          "http_error",
                          "invalid_response",
                          "transport_error",
                      }:
                          raise SystemExit("a failed request has an invalid error category")
                  successful = [sample for sample in samples if sample.get("ok")]
                  validate_latency_summary(
                      f"{phase_name}.end_to_end_latency_ms",
                      phase.get("end_to_end_latency_ms"),
                      [float(sample["end_to_end_ms"]) for sample in successful],
                  )
                  validate_latency_summary(
                      f"{phase_name}.model_latency_ms",
                      phase.get("model_latency_ms"),
                      [float(sample["model_ms"]) for sample in successful],
                  )
                  (all_warmups if phase_name == "warmup" else all_measured).extend(samples)

              warmup_successes = int(condition["warmup"]["success_count"])
              measured_successes = int(condition["measured"]["success_count"])
              warmup_condition_success_counts.append(warmup_successes)
              if warmup_successes < 1:
                  raise SystemExit("a benchmark condition has no successful warmup")
              if (
                  condition.get("candidate_count") == 40
                  and condition.get("offered_concurrency") == 1
              ):
                  primary_condition_success_count = measured_successes
                  if measured_successes < 199:
                      raise SystemExit(
                          "primary latency condition requires at least 199 successes"
                      )
              else:
                  secondary_condition_success_counts.append(measured_successes)
                  if measured_successes < 20:
                      raise SystemExit(
                          "every secondary latency condition requires at least 20 successes"
                      )

          if primary_condition_success_count is None:
              raise SystemExit("primary latency condition is absent")

          totals = report.get("totals", {})
          if totals.get("warmup_request_count") != 90 or len(all_warmups) != 90:
              raise SystemExit("total warmup count must be exactly 90")
          if totals.get("measured_request_count") != 1800 or len(all_measured) != 1800:
              raise SystemExit("total measured count must be exactly 1800")
          if totals.get("measured_success_count") != sum(bool(sample["ok"]) for sample in all_measured):
              raise SystemExit("total success count is inconsistent")
          if totals.get("measured_error_count") != sum(not bool(sample["ok"]) for sample in all_measured):
              raise SystemExit("total error count is inconsistent")
          if totals.get("measured_throttle_count") != sum(
              bool(sample["throttled"]) for sample in all_measured
          ):
              raise SystemExit("total throttle count is inconsistent")
          interpretation = report.get("interpretation", {})
          expected_latency_claim = (
              "Warm public CloudFront end-to-end and model latency over successful responses "
              "after explicit warmups. The primary 40-candidate, concurrency-one condition "
              "has at least 199 successes from 200 attempts (error rate below one percent); "
              "every secondary condition has at least 20 successes. The controlled candidate "
              "cold start is reported separately."
          )
          if interpretation.get("latency_claim") != expected_latency_claim:
              raise SystemExit("benchmark latency claim does not state the exact success floors")
          if interpretation.get("throughput_claim_eligible") is not False:
              raise SystemExit("benchmark must not make a throughput claim")
          if interpretation.get("scaling_claim_eligible") is not False:
              raise SystemExit("benchmark must not make a scaling claim")
          if report.get("pre_benchmark_observations", {}).get("cold_start_controlled") is not False:
              raise SystemExit("pre-benchmark observations must not claim a cold start")

          validation = {
              "schema_version": "1.0.0",
              "status": "passed",
              "validated_at": datetime.now(UTC).isoformat(),
              "benchmark_run_id": os.environ["BENCHMARK_RUN_ID"],
              "release_id": os.environ["RELEASE_ID"],
              "model_id": os.environ["MODEL_ID"],
              "performance_report_sha256": "sha256:"
              + hashlib.sha256(report_path.read_bytes()).hexdigest(),
              "evidence_file_count": 5,
              "condition_count": 9,
              "controlled_cold_start_sample_count": 1,
              "warmup_request_count": 90,
              "measured_request_count": 1800,
              "success_thresholds_enforced": True,
              "minimum_warmup_condition_success_count": min(
                  warmup_condition_success_counts
              ),
              "primary_latency_condition_success_count": primary_condition_success_count,
              "minimum_secondary_condition_success_count": min(
                  secondary_condition_success_counts
              ),
              "immutability_required": True,
          }
          (root / "validation.json").write_text(
              json.dumps(validation, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          files = {}
          for path in sorted(root.glob("*.json")):
              if path.name == "evidence-checksums.json":
                  continue
              files[path.name] = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          checksum_manifest = {"schema_version": "1.0.0", "files": files}
          (root / "evidence-checksums.json").write_text(
              json.dumps(checksum_manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          reloaded = json.loads((root / "evidence-checksums.json").read_text(encoding="utf-8"))
          for relative, expected in reloaded["files"].items():
              path = root / relative
              actual = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              if not path.is_file() or actual != expected:
                  raise SystemExit(f"evidence checksum validation failed: {relative}")
          PY
          bundle_digest="$(sha256sum .benchmark-evidence/evidence-checksums.json | cut -d' ' -f1)"
          publication_prefix="public/${RELEASE_ID}/performance/runs/${BENCHMARK_RUN_ID}/sha256-${bundle_digest}/"
          PYTHONPATH=src python scripts/validate_benchmark_contracts.py \
            --evidence-dir .benchmark-evidence \
            --promotion-pointer current-pointer.json \
            --promotion-pointer-head current-pointer-head.json \
            --release-manifest release-manifest.json \
            --release-checksums bundle-checksums.json \
            --public-evidence public-evidence.json \
            --deployment-evidence deployment-evidence.json \
            --deployment-evidence-head deployment-evidence-head.json \
            --benchmark-run-id "${BENCHMARK_RUN_ID}" \
            --release-id "${RELEASE_ID}" \
            --model-id "${MODEL_ID}" \
            --public-run-id "${PUBLIC_RUN_ID}" \
            --evidence-mode "${EVIDENCE_MODE}" \
            --dataset-manifest-hash "${DATASET_MANIFEST_HASH}" \
            --model-artifact-checksum "${MODEL_ARTIFACT_CHECKSUM}" \
            --benchmark-harness-git-sha "${GITHUB_SHA}" \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --public-origin "${BENCHMARK_BASE_URL}" \
            --publication-prefix "${publication_prefix}"
      - name: Publish the immutable validated performance evidence
        shell: bash
        run: |
          set -euo pipefail
          bundle_digest="$(sha256sum .benchmark-evidence/evidence-checksums.json | cut -d' ' -f1)"
          prefix="public/${RELEASE_ID}/performance/runs/${BENCHMARK_RUN_ID}/sha256-${bundle_digest}/"
          readback_dir="$(mktemp -d)"
          trap 'rm -rf -- "${readback_dir}"' EXIT

          # Re-attest the exact release and immutable serving revision immediately before the
          # first publication. Shared concurrency prevents normal deploy/rollback overlap; these
          # comparisons also fail closed on any out-of-band control-plane change.
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json > "${readback_dir}/current-pointer-head.json"
          test "$(jq -er '.VersionId' "${readback_dir}/current-pointer-head.json")" = \
            "$(jq -er '.VersionId' current-pointer-head.json)"
          test "$(jq -er '.ETag' "${readback_dir}/current-pointer-head.json")" = \
            "$(jq -er '.ETag' current-pointer-head.json)"
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "public/${RELEASE_ID}/deployment-evidence.json" \
            > "${readback_dir}/deployment-evidence-head.json"
          test "$(jq -er '.VersionId' "${readback_dir}/deployment-evidence-head.json")" = \
            "$(jq -er '.VersionId' deployment-evidence-head.json)"
          test "$(jq -er '.ETag' "${readback_dir}/deployment-evidence-head.json")" = \
            "$(jq -er '.ETag' deployment-evidence-head.json)"
          aws lambda get-alias \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --name production > "${readback_dir}/lambda-alias.json"
          jq -e --slurpfile expected lambda-alias-raw.json '
            .FunctionVersion == $expected[0].FunctionVersion and
            .RevisionId == $expected[0].RevisionId
          ' "${readback_dir}/lambda-alias.json" >/dev/null
          aws lambda get-function \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --qualifier production > "${readback_dir}/lambda-function.json"
          jq -e --slurpfile expected lambda-function-private.json '
            (.Configuration | {
              FunctionName, Version, RevisionId, CodeSha256, LastModified,
              MemorySize, Timeout, Architectures, PackageType
            }) == ($expected[0].Configuration | {
              FunctionName, Version, RevisionId, CodeSha256, LastModified,
              MemorySize, Timeout, Architectures, PackageType
            }) and .Code.ResolvedImageUri == $expected[0].Code.ResolvedImageUri
          ' "${readback_dir}/lambda-function.json" >/dev/null

          put_immutable_or_verify_identical() {
            local source_file="$1"
            local object_key="$2"
            local put_error="${readback_dir}/put-error.txt"
            local existing_file="${readback_dir}/existing-object"
            PYTHONPATH=src python scripts/validate_financial_snapshot.py verify \
              --cost-preflight .benchmark-evidence/cost-preflight.json
            if aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --body "${source_file}" \
              --content-type application/json \
              --checksum-algorithm SHA256 \
              --tagging "RetentionClass=public" \
              --if-none-match '*' >/dev/null 2>"${put_error}"; then
              return 0
            fi
            if aws s3api get-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --checksum-mode ENABLED \
              "${existing_file}" >/dev/null 2>&1 \
              && cmp -s "${source_file}" "${existing_file}"; then
              return 0
            fi
            cat "${put_error}" >&2
            echo "Immutable benchmark object exists with different bytes or could not be verified." >&2
            return 1
          }

          while IFS= read -r -d '' file; do
            relative="${file#.benchmark-evidence/}"
            put_immutable_or_verify_identical "${file}" "${prefix}${relative}"
            aws s3api get-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${prefix}${relative}" \
              --checksum-mode ENABLED \
              "${readback_dir}/${relative}" >/dev/null
            cmp -s "${file}" "${readback_dir}/${relative}"
          done < <(find .benchmark-evidence -maxdepth 1 -type f -name '*.json' -print0 | sort -z)
          aws s3api list-objects-v2 \
            --bucket "${ARTIFACT_BUCKET}" \
            --prefix "${prefix}" \
            --no-paginate > published-benchmark-objects.json
          PYTHONPATH=src python scripts/validate_benchmark_contracts.py \
            --evidence-dir "${readback_dir}" \
            --promotion-pointer current-pointer.json \
            --promotion-pointer-head current-pointer-head.json \
            --release-manifest release-manifest.json \
            --release-checksums bundle-checksums.json \
            --public-evidence public-evidence.json \
            --deployment-evidence deployment-evidence.json \
            --deployment-evidence-head deployment-evidence-head.json \
            --benchmark-run-id "${BENCHMARK_RUN_ID}" \
            --release-id "${RELEASE_ID}" \
            --model-id "${MODEL_ID}" \
            --public-run-id "${PUBLIC_RUN_ID}" \
            --evidence-mode "${EVIDENCE_MODE}" \
            --dataset-manifest-hash "${DATASET_MANIFEST_HASH}" \
            --model-artifact-checksum "${MODEL_ARTIFACT_CHECKSUM}" \
            --benchmark-harness-git-sha "${GITHUB_SHA}" \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --public-origin "${BENCHMARK_BASE_URL}" \
            --published-objects published-benchmark-objects.json \
            --publication-prefix "${prefix}"
          printf '%s' "${prefix}" > .benchmark-evidence/published-prefix.txt
          echo "Validated immutable evidence was published under the release's immutable performance prefix." >> "${GITHUB_STEP_SUMMARY}"
          echo "No throughput or scaling claim is made; offered concurrency above two exercises the configured bound." >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: serving-performance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmark-evidence/
          if-no-files-found: warn
          retention-days: 90
