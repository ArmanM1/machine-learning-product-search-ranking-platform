name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ALLOW_HELDOUT_EVAL: "0"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --dev
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/search_rank
      - name: Unit, contract, and integration tests without held-out access
        run: uv run pytest -m "not heldout" tests
      - name: Refuse held-out enablement in CI
        shell: bash
        run: |
          test "${ALLOW_HELDOUT_EVAL}" = "0"
          python - <<'PY'
          from pathlib import Path

          forbidden = (
              "ALLOW_HELDOUT_EVAL=" + str(1),
              "ALLOW_HELDOUT_EVAL:" + ' "' + str(1) + '"',
          )
          path = Path(".github/workflows/pull-request.yml")
          workflow = path.read_text(encoding="utf-8")
          violations = [f"{path}: {needle}" for needle in forbidden if needle in workflow]
          if violations:
              raise SystemExit("Held-out enablement is forbidden in CI: " + ", ".join(violations))
          PY

  web:
    name: Web quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate bootstrap
        working-directory: infra/terraform/environments/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate dev
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate prod
        working-directory: infra/terraform/environments/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

  containers:
    name: Build and scan containers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [train, eval, serve]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build without pushing
        run: docker build --file "Dockerfile.${{ matrix.image }}" --tag "local/${{ matrix.image }}:${GITHUB_SHA}" .
      - name: Run container contract probe
        shell: bash
        env:
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          image="local/${IMAGE_KIND}:${GITHUB_SHA}"
          case "${IMAGE_KIND}" in
            train)
              docker run --rm --entrypoint python "${image}" -m search_rank.cli --help
              ;;
            eval)
              docker run --rm "${image}" --help
              ;;
            serve)
              docker run --rm --entrypoint python "${image}" -c \
                'import os, search_rank.serving.app; assert os.geteuid() != 0'
              ;;
            *)
              echo "Unsupported image kind" >&2
              exit 1
              ;;
          esac
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:${{ github.sha }}
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          timeout: 15m

  dependency-scan:
    name: Dependency and IaC scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Python dependency audit
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: JavaScript dependency audit
        working-directory: web
        run: npm audit --audit-level=high
      - name: Repository secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          timeout: 10m
      - name: Terraform configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
