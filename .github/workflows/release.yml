              path.relative_to(root).as_posix(): "sha256:" + sha256_file(path)
              for path in sorted(root.rglob("*"))
              if path.is_file() and path.name != "bundle-checksums.json"
          }
          bundle_checksums = BundleChecksums.model_validate_json(
              (root / "bundle-checksums.json").read_text(encoding="utf-8")
          )
          if bundle_checksums.files != actual_files:
              raise SystemExit("bundle checksum inventory does not exactly cover the release")
          artifact_checksums = release.get("artifact_checksums")
          required = {
              "public-evidence.json",
              "candidate-model-artifact.json",
              "curated-queries.json",
              "evaluation-report.json",
              "evaluation-provenance.json",
              "LICENSE",
              "NOTICE",
          }
          if not isinstance(artifact_checksums, dict) or set(artifact_checksums) != required:
              raise SystemExit("release manifest does not bind every public evidence artifact")
          for name in required:
              if artifact_checksums[name] != actual_files[name]:
                  raise SystemExit(f"release manifest checksum differs for {name}")
          PY
          prefix="promoted/releases/${REPORT_ID}/"
          uv run python scripts/validate_release_artifacts.py bundle "${bundle}"
          promoted_readback="$(mktemp -d)"
          trap 'rm -rf -- "${promoted_readback}"' EXIT
          put_promoted_immutable_or_verify_identical() {
            local source_file="$1"
            local object_key="$2"
            local content_type="$3"
            local local_sha stem existing head put_error
            local_sha="sha256:$(sha256sum "${source_file}" | cut -d' ' -f1)"
            stem="$(printf '%s' "${object_key}" | sha256sum | cut -d' ' -f1)"
            existing="${promoted_readback}/${stem}.object"
            head="${promoted_readback}/${stem}.head.json"
            put_error="${promoted_readback}/${stem}.put-error.txt"
            PYTHONPATH=src uv run python scripts/validate_financial_snapshot.py verify \
              --cost-preflight cost-preflight.json
            if ! aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --body "${source_file}" \
              --content-type "${content_type}" \
              --checksum-algorithm SHA256 \
              --metadata "sha256=${local_sha},retention-class=promoted" \
              --tagging "RetentionClass=promoted" \
              --if-none-match '*' >/dev/null 2>"${put_error}"; then
              : # An exact partial publication is recoverable.
            fi
            if ! aws s3api get-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --checksum-mode ENABLED \
              "${existing}" >/dev/null 2>&1 \
              || ! cmp -s "${source_file}" "${existing}"; then
              cat "${put_error}" >&2
              echo "Immutable promoted object differs: ${object_key}" >&2
              return 1
            fi
            aws s3api head-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --checksum-mode ENABLED > "${head}"
            jq -e --arg content_type "${content_type}" --arg sha "${local_sha}" '
              .ContentType == $content_type and
              (.ChecksumSHA256 | type == "string" and length > 0) and
              .TagCount == 1 and
              .Metadata == {"retention-class": "promoted", sha256: $sha}' \
              "${head}" >/dev/null
          }
          while IFS= read -r -d '' file; do
            relative="${file#"${bundle}/"}"
            case "${relative}" in
              *.json) content_type=application/json ;;
              *.txt|LICENSE|NOTICE) content_type=text/plain ;;
              *) content_type=application/octet-stream ;;
            esac
            put_promoted_immutable_or_verify_identical \
              "${file}" "${prefix}${relative}" "${content_type}"
          done < <(find "${bundle}" -type f -print0)
          aws s3api list-objects-v2 \
            --bucket "${ARTIFACT_BUCKET}" \
            --prefix "${prefix}" \
            --no-paginate > published-promoted-bundle.json
          export RELEASE_BUNDLE_ROOT="${bundle}"
          export RELEASE_PUBLICATION_PREFIX="${prefix}"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RELEASE_BUNDLE_ROOT"])
          prefix = os.environ["RELEASE_PUBLICATION_PREFIX"]
          expected = {
              prefix + path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          }
          payload = json.loads(Path("published-promoted-bundle.json").read_text(encoding="utf-8"))
          if payload.get("IsTruncated") is True:
              raise SystemExit("promoted bundle object listing is truncated")
          observed = {
              item.get("Key")
              for item in payload.get("Contents", [])
              if isinstance(item, dict) and isinstance(item.get("Key"), str)
          }
          if observed != expected:
              raise SystemExit("promoted bundle S3 inventory is not exact")
          PY
          active_model_id="$(jq -r '.promoted_model_id' "${bundle}/release-manifest.json")"
          release_decision="$(jq -r '.release_gate_results.decision' evaluation-report.json)"
          gate_passed="$(jq -r '.release_gate_results.passed' evaluation-report.json)"
          test "${release_decision}" = "${{ steps.release_gate.outputs.decision }}"
          if [[ "${release_decision}" == "promote_candidate" ]]; then
            test "${active_model_id}" = "${CANDIDATE_MODEL_ID}"
            test "${gate_passed}" = "true"
          else
            test "${release_decision}" = "retain_baseline"
            test "${active_model_id}" = "${STRONGEST_BASELINE_ID}"
            test "${active_model_id}" = "$(jq -r '.model_id' previous-pointer.json)"
            test "${gate_passed}" = "false"
          fi
          jq -n \
            --arg release "${REPORT_ID}" \
            --arg model "${active_model_id}" \
            --arg bundle_key "${prefix}" \
            --arg report "${REPORT_ID}" \
            --arg commit "${GITHUB_SHA}" \
            --arg decision "${release_decision}" \
            --argjson gate_passed "${gate_passed}" \
            --arg candidate "${CANDIDATE_MODEL_ID}" \
            --arg previous_release "$(jq -r '.release_id' previous-pointer.json)" \
            --arg previous_model "$(jq -r '.model_id' previous-pointer.json)" \
            --arg previous_version "$(cat previous-pointer-version.txt)" \
            '{schema_version: "1.0.0", release_id: $release, model_id: $model,
              bundle_s3_key: $bundle_key, evaluation_report_id: $report, git_sha: $commit,
              evidence_mode: "verified", release_decision: $decision,
              gate_passed: $gate_passed, evaluated_candidate_model_id: $candidate,
              previous: {release_id: $previous_release, model_id: $previous_model,
                pointer_version_id: $previous_version}}' > promotion-pointer.json
          uv run python - <<'PY'
          from pathlib import Path

          from search_rank.schemas.release import PromotionPointer

          PromotionPointer.model_validate_json(
              Path("promotion-pointer.json").read_text(encoding="utf-8")
          )
          PY
          decision_key="promoted/decisions/${REPORT_ID}.json"
          put_promoted_immutable_or_verify_identical \
            promotion-pointer.json "${decision_key}" application/json
          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${decision_key}" \
            --checksum-mode ENABLED > promotion-put-result.private.json
          aws s3api list-objects-v2 \
            --bucket "${ARTIFACT_BUCKET}" \
            --prefix "${decision_key}" \
            --no-paginate > published-decision-objects.json
          jq -e --arg key "${decision_key}" '
            .IsTruncated != true and ([.Contents[].Key] | sort) == [$key]' \
            published-decision-objects.json >/dev/null
          jq '{schema_version: "1.0.0", artifact_type: "object_publication_evidence",
            status: "published", version_id_present: (.VersionId != null),
            etag_present: (.ETag != null)}' \
            promotion-put-result.private.json > promotion-publication-evidence.json
          uv run python scripts/validate_release_artifacts.py file \
            --kind publication-evidence promotion-publication-evidence.json
          uv run python scripts/validate_release_artifacts.py file \
            --kind evaluation-cost-preflight cost-preflight.json
          if [[ "${release_decision}" == "promote_candidate" ]]; then
            echo "Promotion gate passed; the immutable candidate bundle and deployment decision were staged. The live pointer remains unchanged until verified production activation." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Promotion gate failed; the immutable negative decision was staged while the prior live pointer remained unchanged." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: heldout-release-evidence-${{ github.run_id }}
          path: |
            access-counter-clean-1.json
            access-counter-clean-2.json
            clean-1/command-summary.json
            clean-1/evaluation-report.json
            clean-1/evaluation-provenance.json
            clean-2/command-summary.json
            clean-2/evaluation-report.json
            clean-2/evaluation-provenance.json
            command-summary.json
            cost-preflight.json
            curated-queries.json
            evaluation-report.json
            evaluation-provenance.json
            previous-pointer.json
            promotion-pointer.json
            promotion-publication-evidence.json
            processing-quota-preflight.json
            processing-job-evidence-clean-1.json
            processing-job-evidence-clean-2.json
            release-summary.json
            trial-selection-binding.json
            trial-selection-verification.json
            artifacts/releases/${{ steps.release_gate.outputs.report_id }}/candidate-model-artifact.json
          if-no-files-found: warn
          retention-days: 90
