          publish_public_json() {
            local source_file="$1"
            local relative_key="$2"
            local artifact_kind="$3"
            local object_key="public/${report_id}/${relative_key}"
            local local_sha stem existing head put_error
            test -s "${source_file}"
            uv run python scripts/validate_release_artifacts.py file \
              --kind "${artifact_kind}" "${source_file}"
            local_sha="sha256:$(sha256sum "${source_file}" | cut -d' ' -f1)"
            stem="$(printf '%s' "${relative_key}" | sha256sum | cut -d' ' -f1)"
            existing="${public_readback}/${stem}.object"
            head="${public_readback}/${stem}.head.json"
            put_error="${public_readback}/${stem}.put-error.txt"
            PYTHONPATH=src uv run python scripts/validate_financial_snapshot.py verify \
              --cost-preflight cost-preflight.json
            if ! aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --body "${source_file}" \
              --content-type application/json \
              --checksum-algorithm SHA256 \
              --metadata "sha256=${local_sha},retention-class=public" \
              --tagging "RetentionClass=public" \
              --if-none-match '*' >/dev/null 2>"${put_error}"; then
              : # Retry-safe verification follows.
            fi
            if ! aws s3api get-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --checksum-mode ENABLED \
              "${existing}" >/dev/null 2>&1 \
              || ! cmp -s "${source_file}" "${existing}"; then
              cat "${put_error}" >&2
              echo "Immutable public release artifact differs: ${object_key}" >&2
              return 1
            fi
            aws s3api head-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --checksum-mode ENABLED > "${head}"
            jq -e --arg sha "${local_sha}" '
              .ContentType == "application/json" and
              (.ChecksumSHA256 | type == "string" and length > 0) and
              .TagCount == 1 and
              .Metadata == {"retention-class": "public", sha256: $sha}' \
              "${head}" >/dev/null
