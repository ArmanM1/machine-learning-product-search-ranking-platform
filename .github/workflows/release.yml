name: Guarded held-out evaluation and promotion

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Immutable candidate training run ID
        required: true
        type: string
      candidate_model_id:
        description: Candidate model ID recorded by the successful training summary
        required: true
        type: string
      candidate_artifact_s3_key:
        description: Immutable runs/.../model.tar.gz key in the private artifact bucket
        required: true
        type: string
      candidate_artifact_sha256:
        description: SHA-256 hex digest of the downloaded model.tar.gz transport object
        required: true
        type: string
      candidate_checkpoint_sha256:
        description: SHA-256 hex digest of the uncompressed checkpoint directory
        required: true
        type: string
      candidate_training_config_sha256:
        description: SHA-256 config hash recorded by the frozen candidate training summary
        required: true
        type: string
      candidate_training_config_path:
        description: Committed frozen candidate training YAML used by the SageMaker job
        required: true
        type: string
      frozen_evaluation_config_path:
        description: Frozen evaluation-method configuration committed before held-out access
        required: true
        default: configs/experiments/release-v1.yaml
        type: string
      frozen_evaluation_config_sha256:
        description: SHA-256 hex digest of the committed evaluation-method configuration
        required: true
        type: string
      dataset_manifest_hash:
        description: Content identity from DatasetManifest.processed_checksum (sha256:...)
        required: true
        type: string
      heldout_data_s3_prefix:
        description: Immutable data/processed/... prefix containing one manifest.json and split files
        required: true
        type: string
      baseline_ids:
        description: Comma-separated declared unchanged baseline IDs
        required: true
        type: string
      strongest_baseline_id:
        description: Strongest unchanged baseline frozen on validation before test access
        required: true
        type: string
      baseline_run_summary_s3_key:
        description: Immutable runs/... successful baseline-run summary.json key
        required: true
        type: string
      baseline_run_summary_sha256:
        description: SHA-256 hex digest of the baseline run summary object
        required: true
        type: string
      baseline_selection_s3_key:
        description: Immutable runs/... validation baseline-summary.json key
        required: true
        type: string
      baseline_selection_sha256:
        description: SHA-256 hex digest of the validation baseline selection object
        required: true
        type: string
      evaluation_image_digest:
        description: Immutable evaluation image digest in sha256:... form
        required: true
        type: string
      test_access_counter:
        description: First clean-run access count; the second independent job reserves the next count
        required: true
        type: string
      maximum_timeout_seconds:
        description: Hard runtime limit per clean Processing job, at most two hours
        required: true
        default: "7200"
        type: string
      declared_job_cost_cap_usd:
        description: Must cover the current on-demand upper-bound estimate
        required: true
        default: "2.00"
        type: string
      estimated_remaining_non_job_usd:
        description: Conservative remaining storage, serving, logs, and transfer estimate
        required: true
        default: "8.00"
        type: string
      cpu_hours_used_to_date:
        description: Paid CPU instance-hours already consumed by the campaign
        required: true
        default: "0"
        type: string
      allow_heldout_eval:
        description: Type 1 only after all hashes and the access count are frozen
        required: true
        type: string
      authorization:
        description: Type RUN TWO CLEAN HELDOUT EVALUATIONS after reviewing the locked inputs
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: heldout-evaluation
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CAMPAIGN_BUDGET_USD: "40"
  REQUIRED_CREDIT_RESERVE_USD: "40"
  MAXIMUM_OUT_OF_POCKET_USD: "0"

jobs:
  evaluate-and-promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: heldout-release
    env:
      ALLOW_HELDOUT_EVAL: ${{ inputs.allow_heldout_eval }}
      AUTHORIZATION: ${{ inputs.authorization }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_MODEL_ID: ${{ inputs.candidate_model_id }}
      CANDIDATE_ARTIFACT_S3_KEY: ${{ inputs.candidate_artifact_s3_key }}
      CANDIDATE_ARTIFACT_S3_URI: s3://${{ vars.AWS_ARTIFACT_BUCKET }}/${{ inputs.candidate_artifact_s3_key }}
      CANDIDATE_ARTIFACT_SHA256: ${{ inputs.candidate_artifact_sha256 }}
      CANDIDATE_CHECKPOINT_SHA256: ${{ inputs.candidate_checkpoint_sha256 }}
      CANDIDATE_CONFIG_SHA256: ${{ inputs.candidate_training_config_sha256 }}
      CANDIDATE_CONFIG_PATH: ${{ inputs.candidate_training_config_path }}
      FROZEN_CONFIG_PATH: ${{ inputs.frozen_evaluation_config_path }}
      FROZEN_CONFIG_SHA256: ${{ inputs.frozen_evaluation_config_sha256 }}
      DATASET_MANIFEST_HASH: ${{ inputs.dataset_manifest_hash }}
      HELDOUT_DATA_S3_PREFIX: ${{ inputs.heldout_data_s3_prefix }}
      HELDOUT_DATA_S3_URI: s3://${{ vars.AWS_ARTIFACT_BUCKET }}/${{ inputs.heldout_data_s3_prefix }}
      BASELINE_IDS: ${{ inputs.baseline_ids }}
      STRONGEST_BASELINE_ID: ${{ inputs.strongest_baseline_id }}
      BASELINE_RUN_SUMMARY_S3_KEY: ${{ inputs.baseline_run_summary_s3_key }}
      BASELINE_RUN_SUMMARY_S3_URI: s3://${{ vars.AWS_ARTIFACT_BUCKET }}/${{ inputs.baseline_run_summary_s3_key }}
      BASELINE_RUN_SUMMARY_SHA256: ${{ inputs.baseline_run_summary_sha256 }}
      BASELINE_SELECTION_S3_KEY: ${{ inputs.baseline_selection_s3_key }}
      BASELINE_SELECTION_S3_URI: s3://${{ vars.AWS_ARTIFACT_BUCKET }}/${{ inputs.baseline_selection_s3_key }}
      BASELINE_SELECTION_SHA256: ${{ inputs.baseline_selection_sha256 }}
      EVALUATION_IMAGE_DIGEST: ${{ inputs.evaluation_image_digest }}
      EVALUATION_IMAGE_URI: ${{ vars.AWS_EVAL_ECR_REPOSITORY_URL }}@${{ inputs.evaluation_image_digest }}
      TEST_ACCESS_COUNTER: ${{ inputs.test_access_counter }}
      MAX_TIMEOUT_SECONDS: ${{ inputs.maximum_timeout_seconds }}
      DECLARED_JOB_COST_CAP_USD: ${{ inputs.declared_job_cost_cap_usd }}
      CAMPAIGN_SPEND_TO_DATE_USD: ${{ secrets.AWS_CAMPAIGN_SPEND_TO_DATE_USD }}
      REMAINING_APPLICABLE_CREDIT_USD: ${{ secrets.AWS_REMAINING_APPLICABLE_CREDIT_USD }}
      ESTIMATED_REMAINING_NON_JOB_USD: ${{ inputs.estimated_remaining_non_job_usd }}
      CPU_HOURS_USED_TO_DATE: ${{ inputs.cpu_hours_used_to_date }}
      ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      PROCESSING_ROLE_ARN: ${{ vars.AWS_SAGEMAKER_PROCESSING_ROLE_ARN }}
      EVAL_REPOSITORY: ${{ vars.AWS_EVAL_ECR_REPOSITORY_URL }}
      INSTANCE_TYPE: ml.m5.xlarge
      PROJECT_NAME: product-search-ranking
      ENVIRONMENT_NAME: prod
      OWNER_ALIAS: ${{ vars.TF_OWNER_ALIAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Validate frozen release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${AUTHORIZATION}" = "RUN TWO CLEAN HELDOUT EVALUATIONS"
          test "${ALLOW_HELDOUT_EVAL}" = "1"
          test "${AWS_REGION}" = "us-east-1"
          [[ "${FROZEN_CONFIG_PATH}" =~ ^configs/experiments/[A-Za-z0-9._/-]+\.ya?ml$ ]]
          [[ "${FROZEN_CONFIG_PATH}" != *".."* ]]
          test -f "${FROZEN_CONFIG_PATH}"
          [[ "${CANDIDATE_CONFIG_PATH}" =~ ^configs/experiments/[A-Za-z0-9._/-]+\.ya?ml$ ]]
          [[ "${CANDIDATE_CONFIG_PATH}" != *".."* ]]
          test -f "${CANDIDATE_CONFIG_PATH}"
          [[ "${CANDIDATE_RUN_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,62}$ ]]
          [[ "${CANDIDATE_MODEL_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]{2,99}$ ]]
          [[ "${CANDIDATE_ARTIFACT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${CANDIDATE_CHECKPOINT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${CANDIDATE_CONFIG_SHA256}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${FROZEN_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${DATASET_MANIFEST_HASH}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${BASELINE_RUN_SUMMARY_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${BASELINE_SELECTION_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${EVALUATION_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${EVALUATION_IMAGE_URI}" = "${EVAL_REPOSITORY}@${EVALUATION_IMAGE_DIGEST}"
          [[ "${CANDIDATE_ARTIFACT_S3_KEY}" == runs/* ]]
          [[ "${BASELINE_RUN_SUMMARY_S3_KEY}" == runs/* ]]
          [[ "${BASELINE_SELECTION_S3_KEY}" == runs/* ]]
          [[ "${HELDOUT_DATA_S3_PREFIX}" == data/processed/* ]]
          [[ "${CANDIDATE_ARTIFACT_S3_URI}" =~ ^s3://[a-z0-9.-]+/[A-Za-z0-9._/-]+$ ]]
          [[ "${HELDOUT_DATA_S3_URI}" =~ ^s3://[a-z0-9.-]+/[A-Za-z0-9._/-]+$ ]]
          [[ "${BASELINE_RUN_SUMMARY_S3_URI}" =~ ^s3://[a-z0-9.-]+/[A-Za-z0-9._/-]+\.json$ ]]
          [[ "${BASELINE_SELECTION_S3_URI}" =~ ^s3://[a-z0-9.-]+/[A-Za-z0-9._/-]+\.json$ ]]
          [[ "${CANDIDATE_ARTIFACT_S3_URI}" != *".."* ]]
          [[ "${HELDOUT_DATA_S3_URI}" != *".."* ]]
          [[ "${BASELINE_RUN_SUMMARY_S3_URI}" != *".."* ]]
          [[ "${BASELINE_SELECTION_S3_URI}" != *".."* ]]
          [[ "${CANDIDATE_ARTIFACT_S3_URI}" == *.tar.gz ]]
          [[ "${BASELINE_IDS}" =~ ^[A-Za-z0-9._@-]+(,[A-Za-z0-9._@-]+)+$ ]]
          [[ "${STRONGEST_BASELINE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]{2,99}$ ]]
          case ",${BASELINE_IDS}," in
            *",${STRONGEST_BASELINE_ID},"*) ;;
            *) echo "Strongest baseline is absent from the frozen baseline declaration" >&2; exit 1 ;;
          esac
          actual_config_hash="$(sha256sum "${FROZEN_CONFIG_PATH}" | cut -d' ' -f1)"
          test "${actual_config_hash}" = "${FROZEN_CONFIG_SHA256}"
          [[ "${TEST_ACCESS_COUNTER}" =~ ^[1-9][0-9]*$ ]]
          : "${PROCESSING_ROLE_ARN:?Missing AWS_SAGEMAKER_PROCESSING_ROLE_ARN variable}"
          : "${EVAL_REPOSITORY:?Missing AWS_EVAL_ECR_REPOSITORY_URL variable}"
          [[ "${OWNER_ALIAS}" =~ ^[A-Za-z0-9_.-]{2,32}$ ]]
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-heldout-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Bind the evaluation digest to the evaluated Git commit
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${EVAL_REPOSITORY#*/}"
          tagged_digest="$(aws ecr describe-images \
            --repository-name "${repository_name}" \
            --image-ids "imageTag=sha-${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "${tagged_digest}" = "${EVALUATION_IMAGE_DIGEST}"
      - name: Retrieve current processing price and enforce the zero-spend guard
        shell: bash
        run: |
          set -euo pipefail
          aws pricing get-products \
            --region us-east-1 \
            --service-code AmazonSageMaker \
            --filters \
              "Type=TERM_MATCH,Field=regionCode,Value=${AWS_REGION}" \
              "Type=TERM_MATCH,Field=instanceType,Value=${INSTANCE_TYPE}" \
            --max-results 100 > pricing.json
          python - <<'PY'
          import json
          import os
          from decimal import Decimal, InvalidOperation, ROUND_UP

          def amount(name: str) -> Decimal:
              try:
                  value = Decimal(os.environ[name])
              except (InvalidOperation, KeyError) as exc:
                  raise SystemExit(f"{name} must be a decimal number") from exc
              if value < 0:
                  raise SystemExit(f"{name} may not be negative")
              return value

          with open("pricing.json", encoding="utf-8") as handle:
              response = json.load(handle)
          prices = []
          for encoded in response.get("PriceList", []):
              product = json.loads(encoded)
              for term in product.get("terms", {}).get("OnDemand", {}).values():
                  for dimension in term.get("priceDimensions", {}).values():
                      if dimension.get("unit") in {"Hrs", "Hours"}:
                          price = Decimal(dimension.get("pricePerUnit", {}).get("USD", "0"))
                          if price > 0:
                              prices.append(price)
          if not prices:
              raise SystemExit("No current SageMaker processing price found; refusing held-out access")
          timeout = int(os.environ["MAX_TIMEOUT_SECONDS"])
          if timeout <= 0 or timeout > 7200:
              raise SystemExit("Each of the two Processing jobs must be capped at two hours")
          hours = (Decimal(timeout) / Decimal(3600)).quantize(Decimal("0.0001"), rounding=ROUND_UP)
          unit_price = max(prices)
          total_hours = hours * 2
          estimate = (total_hours * unit_price).quantize(Decimal("0.01"), rounding=ROUND_UP)
          spent = amount("CAMPAIGN_SPEND_TO_DATE_USD")
          remaining = amount("ESTIMATED_REMAINING_NON_JOB_USD")
          credit = amount("REMAINING_APPLICABLE_CREDIT_USD")
          reserve = amount("REQUIRED_CREDIT_RESERVE_USD")
          if amount("MAXIMUM_OUT_OF_POCKET_USD") != 0:
              raise SystemExit("Owner-approved out-of-pocket limit must be exactly zero")
          if estimate > amount("DECLARED_JOB_COST_CAP_USD"):
              raise SystemExit("Live upper-bound estimate exceeds the declared job cap")
          if spent + estimate + remaining > amount("CAMPAIGN_BUDGET_USD"):
              raise SystemExit("Processing would breach the USD 40 campaign envelope")
          if credit < estimate + remaining + reserve:
              raise SystemExit("Applicable credit cannot cover processing, the remaining plan, and reserve")
          if amount("CPU_HOURS_USED_TO_DATE") + total_hours > 10:
              raise SystemExit("Two clean Processing jobs would breach the 10 paid CPU-instance-hour campaign cap")
          evidence = {
              "guard_passed": True,
              "region": os.environ["AWS_REGION"],
              "instance_type": os.environ["INSTANCE_TYPE"],
              "independent_processing_job_count": 2,
              "maximum_runtime_seconds_per_job": timeout,
              "maximum_total_instance_hours": str(total_hours),
              "on_demand_hourly_upper_bound_usd": str(unit_price),
              "maximum_job_estimate_usd": str(estimate),
              "required_credit_reserve_usd": str(reserve),
              "maximum_out_of_pocket_usd": "0",
          }
          with open("cost-preflight.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
          print(f"Guard passed; the two-job upper-bound processing estimate is ${estimate}.")
          PY
      - name: Download and verify the frozen candidate and baseline artifacts
        shell: bash
        run: |
          set -euo pipefail
          without_scheme="${CANDIDATE_ARTIFACT_S3_URI#s3://}"
          bucket="${without_scheme%%/*}"
          key="${without_scheme#*/}"
          test "${bucket}" = "${ARTIFACT_BUCKET}"
          aws s3api head-object --bucket "${bucket}" --key "${key}" --checksum-mode ENABLED > candidate-head.json
          aws s3 cp "${CANDIDATE_ARTIFACT_S3_URI}" candidate-model.tar.gz --no-progress
          actual_archive_hash="$(sha256sum candidate-model.tar.gz | cut -d' ' -f1)"
          test "${actual_archive_hash}" = "${CANDIDATE_ARTIFACT_SHA256}"
          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path

          destination = Path("candidate-preflight")
          destination.mkdir()
          root = destination.resolve()
          with tarfile.open("candidate-model.tar.gz", "r:gz") as handle:
              for member in handle.getmembers():
                  target = (destination / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"unsafe candidate archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"candidate archive link rejected: {member.name}")
              handle.extractall(destination, filter="data")

          summaries = []
          for path in sorted(destination.rglob("summary.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("command") == "train" and payload.get("status") == "succeeded":
                  summaries.append(payload)
          if len(summaries) != 1:
              raise SystemExit("candidate archive must contain one successful training summary")
          result = summaries[0]["result"]
          expected = {
              "candidate_model_id": os.environ["CANDIDATE_MODEL_ID"],
              "checkpoint_checksum": "sha256:" + os.environ["CANDIDATE_CHECKPOINT_SHA256"],
              "config_hash": os.environ["CANDIDATE_CONFIG_SHA256"],
              "dataset_manifest_hash": os.environ["DATASET_MANIFEST_HASH"],
          }
          for field, value in expected.items():
              if result.get(field) != value:
                  raise SystemExit(f"candidate training summary {field} differs from frozen input")

          def file_hash(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  while chunk := stream.read(1024 * 1024):
                      digest.update(chunk)
              return digest.hexdigest()

          def directory_hash(path: Path) -> str:
              digest = hashlib.sha256()
              for item in sorted(candidate for candidate in path.rglob("*") if candidate.is_file()):
                  digest.update(item.relative_to(path).as_posix().encode())
                  digest.update(b"\0")
                  digest.update(file_hash(item).encode("ascii"))
                  digest.update(b"\n")
              return digest.hexdigest()

          matches = [
              path for path in destination.rglob("best")
              if path.is_dir() and directory_hash(path) == os.environ["CANDIDATE_CHECKPOINT_SHA256"]
          ]
          if len(matches) != 1:
              raise SystemExit("candidate checkpoint directory hash is not unique and valid")
          frozen_configs = list(destination.rglob("frozen-experiment.yaml"))
          if len(frozen_configs) != 1:
              raise SystemExit("candidate archive must contain one frozen experiment configuration")
          committed = Path(os.environ["CANDIDATE_CONFIG_PATH"])
          if frozen_configs[0].read_bytes() != committed.read_bytes():
              raise SystemExit("candidate archive configuration differs from the committed frozen file")
          PY
          aws s3 cp "${BASELINE_RUN_SUMMARY_S3_URI}" baseline-run-summary.json --no-progress
          aws s3 cp "${BASELINE_SELECTION_S3_URI}" baseline-selection.json --no-progress
          test "$(sha256sum baseline-run-summary.json | cut -d' ' -f1)" = "${BASELINE_RUN_SUMMARY_SHA256}"
          test "$(sha256sum baseline-selection.json | cut -d' ' -f1)" = "${BASELINE_SELECTION_SHA256}"
          declared_baselines="$(jq -cn --arg value "${BASELINE_IDS}" '$value | split(",") | sort')"
          jq -e \
            --arg strongest "${STRONGEST_BASELINE_ID}" \
            --arg selection_hash "sha256:${BASELINE_SELECTION_SHA256}" \
            '.command == "baseline-run" and .status == "succeeded" and
             .result.strongest_baseline_id == $strongest and
             .artifact_hashes.baseline_summary == $selection_hash' \
            baseline-run-summary.json >/dev/null
          jq -e \
            --arg strongest "${STRONGEST_BASELINE_ID}" \
            --arg dataset_hash "${DATASET_MANIFEST_HASH}" \
            --argjson declared "${declared_baselines}" \
            '.split == "validation" and .strongest_baseline_id == $strongest and
             .dataset_manifest_hash == $dataset_hash and (.metrics | keys | sort) == $declared' \
            baseline-selection.json >/dev/null
          aws s3 cp "${HELDOUT_DATA_S3_URI%/}/manifest.json" heldout-manifest.json --no-progress
          jq -e --arg dataset_hash "${DATASET_MANIFEST_HASH}" \
            '.processed_checksum == $dataset_hash and
             (.split_counts.test.query_count | type == "number") and
             (.split_query_id_hashes.test | startswith("sha256:"))' \
            heldout-manifest.json >/dev/null
      - name: Capture the required rollback-safe baseline promotion
        shell: bash
        run: |
          set -euo pipefail
          pointer_key="promoted/current.json"
          aws s3api head-object --bucket "${ARTIFACT_BUCKET}" --key "${pointer_key}" > previous-pointer-head.json
          aws s3api get-object --bucket "${ARTIFACT_BUCKET}" --key "${pointer_key}" previous-pointer.json >/dev/null
          jq -e --arg baseline "${STRONGEST_BASELINE_ID}" \
            '.model_id == $baseline and
             (.release_id | type == "string" and length > 0) and
             (.bundle_s3_key | startswith("promoted/"))' \
            previous-pointer.json >/dev/null
          jq -r '.ETag' previous-pointer-head.json > previous-pointer-etag.txt
          jq -r '.VersionId // ""' previous-pointer-head.json > previous-pointer-version.txt
      - name: Run two separately counted clean held-out Processing jobs
        shell: bash
        run: |
          set -euo pipefail
          base_name="${PROJECT_NAME}-${ENVIRONMENT_NAME}-release-${GITHUB_RUN_ID}"
          base_name="${base_name:0:55}"
          shared_prefix="s3://${ARTIFACT_BUCKET}/runs/${base_name}/shared/"
          config_prefix="${shared_prefix}evaluation/"
          candidate_config_prefix="${shared_prefix}candidate-config/"
          baseline_prefix="${shared_prefix}baseline/"
          aws s3 cp "${FROZEN_CONFIG_PATH}" "${config_prefix}release.yaml" --checksum-algorithm SHA256 --no-progress
          aws s3 cp "${CANDIDATE_CONFIG_PATH}" "${candidate_config_prefix}frozen-candidate.yaml" --checksum-algorithm SHA256 --no-progress
          aws s3 cp baseline-run-summary.json "${baseline_prefix}summary.json" --checksum-algorithm SHA256 --no-progress
          aws s3 cp baseline-selection.json "${baseline_prefix}baseline-summary.json" --checksum-algorithm SHA256 --no-progress

          increment_counter() {
            local expected="$1"
            local clean_run="$2"
            local counter_key="heldout/access-counter.json"
            local previous current_etag
            local write_condition=()
            if aws s3api head-object --bucket "${ARTIFACT_BUCKET}" --key "${counter_key}" > "counter-head-${clean_run}.json" 2>/dev/null; then
              aws s3api get-object --bucket "${ARTIFACT_BUCKET}" --key "${counter_key}" "previous-counter-${clean_run}.json" >/dev/null
              previous="$(jq -r '.count' "previous-counter-${clean_run}.json")"
              current_etag="$(jq -r '.ETag' "counter-head-${clean_run}.json")"
              write_condition=(--if-match "${current_etag}")
            else
              previous=0
              write_condition=(--if-none-match '*')
            fi
            [[ "${previous}" =~ ^[0-9]+$ ]]
            test "${expected}" -eq "$((previous + 1))"
            jq -n \
              --argjson count "${expected}" \
              --argjson clean_run "${clean_run}" \
              --arg run "${CANDIDATE_RUN_ID}" \
              --arg commit "${GITHUB_SHA}" \
              --arg workflow_run "${GITHUB_RUN_ID}" \
              '{count: $count, clean_run: $clean_run, candidate_run_id: $run,
                code_commit: $commit, workflow_run_id: $workflow_run}' \
              > "access-counter-clean-${clean_run}.json"
            aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${counter_key}" \
              --body "access-counter-clean-${clean_run}.json" \
              --content-type application/json \
              --checksum-algorithm SHA256 \
              "${write_condition[@]}" >/dev/null
          }

          submit_and_wait() {
            local clean_run="$1"
            local counter="$2"
            local job_name="${base_name}-clean-${clean_run}"
            local output_uri="s3://${ARTIFACT_BUCKET}/runs/${job_name}/reports/"
            local image_digest="${EVALUATION_IMAGE_URI##*@}"
            jq -n \
              --arg job "${job_name}" \
              --arg role "${PROCESSING_ROLE_ARN}" \
              --arg image "${EVALUATION_IMAGE_URI}" \
              --arg image_digest "${image_digest}" \
              --arg instance "${INSTANCE_TYPE}" \
              --arg config "${config_prefix}" \
              --arg candidate_config "${candidate_config_prefix}" \
              --arg baseline "${baseline_prefix}" \
              --arg data "${HELDOUT_DATA_S3_URI}" \
              --arg model "${CANDIDATE_ARTIFACT_S3_URI}" \
              --arg output "${output_uri}" \
              --arg candidate_run "${CANDIDATE_RUN_ID}" \
              --arg candidate_model "${CANDIDATE_MODEL_ID}" \
              --arg candidate_hash "${CANDIDATE_CHECKPOINT_SHA256}" \
              --arg candidate_config_hash "${CANDIDATE_CONFIG_SHA256}" \
              --arg config_hash "${FROZEN_CONFIG_SHA256}" \
              --arg dataset_hash "${DATASET_MANIFEST_HASH}" \
              --arg baselines "${BASELINE_IDS}" \
              --arg strongest_baseline "${STRONGEST_BASELINE_ID}" \
              --arg counter "${counter}" \
              --arg clean_run "${clean_run}" \
              --arg commit "${GITHUB_SHA}" \
              --arg region "${AWS_REGION}" \
              --arg project "${PROJECT_NAME}" \
              --arg environment "${ENVIRONMENT_NAME}" \
              --arg owner "${OWNER_ALIAS}" \
              --argjson timeout "${MAX_TIMEOUT_SECONDS}" \
              '{
                ProcessingJobName: $job,
                RoleArn: $role,
                AppSpecification: {
                  ImageUri: $image,
                  ContainerEntrypoint: ["python", "/app/scripts/container_eval.py"],
                  ContainerArguments: [
                    "--config", "/opt/ml/processing/input/config/release.yaml",
                    "--heldout",
                    "--candidate-bundle", "/opt/ml/processing/input/candidate",
                    "--candidate-config", "/opt/ml/processing/input/candidate-config/frozen-candidate.yaml",
                    "--heldout-input", "/opt/ml/processing/input/heldout",
                    "--baseline-summary", "/opt/ml/processing/input/baseline",
                    "--strongest-baseline-id", $strongest_baseline,
                    "--test-access-counter", $counter,
                    "--candidate-checkpoint-sha256", $candidate_hash,
                    "--candidate-config-sha256", $candidate_config_hash,
                    "--dataset-processed-sha256", $dataset_hash
                  ]
                },
                ProcessingResources: {ClusterConfig: {InstanceCount: 1, InstanceType: $instance, VolumeSizeInGB: 30}},
                StoppingCondition: {MaxRuntimeInSeconds: $timeout},
                ProcessingInputs: [
                  {InputName: "config", S3Input: {S3Uri: $config, LocalPath: "/opt/ml/processing/input/config", S3DataType: "S3Prefix", S3InputMode: "File"}},
                  {InputName: "candidate-config", S3Input: {S3Uri: $candidate_config, LocalPath: "/opt/ml/processing/input/candidate-config", S3DataType: "S3Prefix", S3InputMode: "File"}},
                  {InputName: "baseline", S3Input: {S3Uri: $baseline, LocalPath: "/opt/ml/processing/input/baseline", S3DataType: "S3Prefix", S3InputMode: "File"}},
                  {InputName: "heldout", S3Input: {S3Uri: $data, LocalPath: "/opt/ml/processing/input/heldout", S3DataType: "S3Prefix", S3InputMode: "File"}},
                  {InputName: "candidate", S3Input: {S3Uri: $model, LocalPath: "/opt/ml/processing/input/candidate", S3DataType: "S3Prefix", S3InputMode: "File"}}
                ],
                ProcessingOutputConfig: {Outputs: [{OutputName: "reports", S3Output: {S3Uri: $output, LocalPath: "/opt/ml/processing/output", S3UploadMode: "EndOfJob"}}]},
                Environment: {
                  ALLOW_HELDOUT_EVAL: "1",
                  CANDIDATE_RUN_ID: $candidate_run,
                  CANDIDATE_MODEL_ID: $candidate_model,
                  CANDIDATE_CHECKPOINT_SHA256: $candidate_hash,
                  CANDIDATE_CONFIG_SHA256: $candidate_config_hash,
                  FROZEN_CONFIG_SHA256: $config_hash,
                  DATASET_MANIFEST_HASH: $dataset_hash,
                  BASELINE_IDS: $baselines,
                  STRONGEST_BASELINE_ID: $strongest_baseline,
                  TEST_ACCESS_COUNTER: $counter,
                  CLEAN_RUN_ORDINAL: $clean_run,
                  CODE_COMMIT: $commit,
                  SEARCH_RANK_EVALUATION_IMAGE_DIGEST: $image_digest,
                  SEARCH_RANK_HARDWARE_CLASS: $instance,
                  SEARCH_RANK_GIT_SHA: $commit,
                  AWS_REGION: $region
                },
                Tags: [
                  {Key: "Project", Value: $project},
                  {Key: "Environment", Value: $environment},
                  {Key: "Owner", Value: $owner},
                  {Key: "RunId", Value: $job},
                  {Key: "CleanRun", Value: $clean_run},
                  {Key: "HeldoutAccessCounter", Value: $counter}
                ]
              }' > "processing-job-clean-${clean_run}.json"
            aws sagemaker create-processing-job --cli-input-json "file://processing-job-clean-${clean_run}.json" >/dev/null
            printf '%s' "${job_name}" > "job-name-clean-${clean_run}.txt"
            printf '%s' "${output_uri}" > "output-uri-clean-${clean_run}.txt"
            set +e
            aws sagemaker wait processing-job-completed-or-stopped --processing-job-name "${job_name}"
            local waiter_status=$?
            set -e
            aws sagemaker describe-processing-job --processing-job-name "${job_name}" > "processing-job-description-clean-${clean_run}-private.json"
            jq '{
              processing_job_name: .ProcessingJobName,
              status: .ProcessingJobStatus,
              instance_type: .ProcessingResources.ClusterConfig.InstanceType,
              instance_count: .ProcessingResources.ClusterConfig.InstanceCount,
              creation_time: .CreationTime,
              end_time: .ProcessingEndTime,
              image_digest: (.AppSpecification.ImageUri | split("@") | .[-1]),
              exit_message_present: (.ExitMessage != null)
            }' "processing-job-description-clean-${clean_run}-private.json" > "processing-job-evidence-clean-${clean_run}.json"
            local status
            status="$(jq -r '.status' "processing-job-evidence-clean-${clean_run}.json")"
            if [[ "${waiter_status}" -ne 0 || "${status}" != "Completed" ]]; then
              echo "Clean held-out Processing job ${clean_run} did not complete; previous promotion remains unchanged." >&2
              return 1
            fi
          }

          first_counter="${TEST_ACCESS_COUNTER}"
          second_counter="$((TEST_ACCESS_COUNTER + 1))"
          increment_counter "${first_counter}" 1
          submit_and_wait 1 "${first_counter}"
          increment_counter "${second_counter}" 2
          submit_and_wait 2 "${second_counter}"
      - name: Verify both clean outputs, bind them, and apply the promotion decision
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          expected_baselines="$(jq -cn --arg value "${BASELINE_IDS}" '$value | split(",") | sort')"
          for clean_run in 1 2; do
            mkdir -p "clean-${clean_run}"
            output_uri="$(cat "output-uri-clean-${clean_run}.txt")"
            for artifact in evaluation-report.json curated-queries.json evaluation-provenance.json command-summary.json; do
              aws s3 cp "${output_uri}${artifact}" "clean-${clean_run}/${artifact}" --no-progress
            done
            counter="$((TEST_ACCESS_COUNTER + clean_run - 1))"
            jq -e \
              --arg candidate "${CANDIDATE_MODEL_ID}" \
              --arg strongest "${STRONGEST_BASELINE_ID}" \
              --argjson counter "${counter}" \
              --argjson baselines "${expected_baselines}" \
              '.split == "test" and .test_access_count == $counter and
               .candidate_model_id == $candidate and
               .primary_metric.strongest_baseline_id == $strongest and
               (.baseline_model_ids | sort) == $baselines and
               .release_gate_results.candidate_model_id == $candidate and
               .release_gate_results.baseline_model_id == $strongest' \
              "clean-${clean_run}/evaluation-report.json" >/dev/null
            jq -e \
              --arg candidate "${CANDIDATE_MODEL_ID}" \
              --arg checkpoint "sha256:${CANDIDATE_CHECKPOINT_SHA256}" \
              --arg config "${CANDIDATE_CONFIG_SHA256}" \
              --arg dataset "${DATASET_MANIFEST_HASH}" \
              '.command == "evaluate" and .status == "succeeded" and
               .result.candidate_model_id == $candidate and
               .result.checkpoint_checksum == $checkpoint and
               .result.config_hash == $config and
               .result.dataset_manifest_hash == $dataset' \
              "clean-${clean_run}/command-summary.json" >/dev/null
            jq -e \
              --arg candidate_config "${CANDIDATE_CONFIG_SHA256}" \
              --arg evaluation_config "sha256:${FROZEN_CONFIG_SHA256}" \
              --arg checkpoint "sha256:${CANDIDATE_CHECKPOINT_SHA256}" \
              --arg dataset "${DATASET_MANIFEST_HASH}" \
              --arg strongest "${STRONGEST_BASELINE_ID}" \
               --arg image "${EVALUATION_IMAGE_URI##*@}" \
               --arg git "${GITHUB_SHA}" \
               --arg hardware "${INSTANCE_TYPE}" \
               --arg region "${AWS_REGION}" \
               --argjson counter "${counter}" \
              '.split == "test" and .test_access_count == $counter and
               .config_hash == $candidate_config and
               .evaluation_config_checksum == $evaluation_config and
               .checkpoint_checksum == $checkpoint and
               .dataset_manifest_hash == $dataset and
                .strongest_baseline_id == $strongest and
                .evaluation_image_digest == $image and
                .evaluation_git_sha == $git and .hardware_class == $hardware and
                .region == $region and
               .independent_evaluation_count == 1 and
               (.clean_run_metric_values | length == 1) and
               (.clean_ranking_hashes | length == 1)' \
              "clean-${clean_run}/evaluation-provenance.json" >/dev/null
            for artifact in evaluation_report curated_queries evaluation_provenance; do
              case "${artifact}" in
                evaluation_report) file=evaluation-report.json ;;
                curated_queries) file=curated-queries.json ;;
                evaluation_provenance) file=evaluation-provenance.json ;;
              esac
              expected_hash="$(jq -r --arg name "${artifact}" '.artifact_hashes[$name] // empty' "clean-${clean_run}/command-summary.json")"
              test "${expected_hash}" = "sha256:$(sha256sum "clean-${clean_run}/${file}" | cut -d' ' -f1)"
            done
            jq -e \
              --arg image "${EVALUATION_IMAGE_URI##*@}" \
              --arg hardware "${INSTANCE_TYPE}" \
              '.status == "Completed" and .image_digest == $image and
               .instance_type == $hardware and .instance_count == 1' \
              "processing-job-evidence-clean-${clean_run}.json" >/dev/null
          done

          test "$(sha256sum clean-1/curated-queries.json | cut -d' ' -f1)" = \
            "$(sha256sum clean-2/curated-queries.json | cut -d' ' -f1)"
          uv sync --frozen --all-extras
          marker="$(mktemp)"
          uv run python -m search_rank.cli bind-clean-evaluations \
            --first-summary clean-1/command-summary.json \
            --second-summary clean-2/command-summary.json
          export BIND_MARKER="${marker}"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = Path(os.environ["BIND_MARKER"])
          candidates = []
          for path in Path("artifacts/runs").glob("*/summary.json"):
              if path.stat().st_mtime_ns < marker.stat().st_mtime_ns:
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("command") == "bind-clean-evaluations" and payload.get("status") == "succeeded":
                  candidates.append(path)
          if len(candidates) != 1:
              raise SystemExit(f"expected one successful bound summary, found {len(candidates)}")
          Path("bound-summary-path.txt").write_text(str(candidates[0]), encoding="utf-8")
          PY
          bound_summary="$(cat bound-summary-path.txt)"
          bound_dir="$(dirname "${bound_summary}")"
          cp "${bound_summary}" command-summary.json
          cp "${bound_dir}/evaluation-report.json" evaluation-report.json
          cp "${bound_dir}/evaluation-provenance.json" evaluation-provenance.json
          cp "${bound_dir}/curated-queries.json" curated-queries.json
          second_counter="$((TEST_ACCESS_COUNTER + 1))"
          jq -e \
            --arg candidate "${CANDIDATE_MODEL_ID}" \
            --arg strongest "${STRONGEST_BASELINE_ID}" \
            --argjson counter "${second_counter}" \
            --argjson baselines "${expected_baselines}" \
            '.split == "test" and .test_access_count == $counter and
             .candidate_model_id == $candidate and
             .primary_metric.strongest_baseline_id == $strongest and
             (.baseline_model_ids | sort) == $baselines and
             .release_gate_results.candidate_model_id == $candidate and
             .release_gate_results.baseline_model_id == $strongest and
             ((.release_gate_results.passed == true and
               .release_gate_results.decision == "promote_candidate" and
               .release_gate_results.promoted_model_id == $candidate) or
              (.release_gate_results.passed == false and
               .release_gate_results.decision == "retain_baseline" and
               .release_gate_results.promoted_model_id == $strongest))' \
            evaluation-report.json >/dev/null
          jq -e \
             --arg image "${EVALUATION_IMAGE_URI##*@}" \
             --arg git "${GITHUB_SHA}" \
             --arg hardware "${INSTANCE_TYPE}" \
             --arg region "${AWS_REGION}" \
            --argjson first "${TEST_ACCESS_COUNTER}" \
            --argjson second "${second_counter}" \
             '.independent_evaluation_count == 2 and
              .evaluation_image_digest == $image and .evaluation_git_sha == $git and
              .hardware_class == $hardware and .region == $region and
              .test_access_count == $second and
             (.clean_run_metric_values | length == 2) and
             ([.source_evaluations[].test_access_count] == [$first, $second])' \
            evaluation-provenance.json >/dev/null
          jq -e '.command == "bind-clean-evaluations" and .status == "succeeded" and
            .result.clean_evaluation_count == 2' command-summary.json >/dev/null
          for artifact in evaluation_report curated_queries evaluation_provenance; do
            case "${artifact}" in
              evaluation_report) file=evaluation-report.json ;;
              curated_queries) file=curated-queries.json ;;
              evaluation_provenance) file=evaluation-provenance.json ;;
            esac
            expected_hash="$(jq -r --arg name "${artifact}" '.artifact_hashes[$name] // empty' command-summary.json)"
            test "${expected_hash}" = "sha256:$(sha256sum "${file}" | cut -d' ' -f1)"
          done
          report_id="$(jq -r '.report_id' evaluation-report.json)"
          [[ "${report_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,99}$ ]]
          decision="$(jq -r '.release_gate_results.decision' evaluation-report.json)"
          evaluation_image_digest="${EVALUATION_IMAGE_URI##*@}"
          clean_sources="$(jq -c '.source_evaluations' evaluation-provenance.json)"
          jq \
            --arg code_commit "${GITHUB_SHA}" \
            --arg evaluation_image_digest "${evaluation_image_digest}" \
            --arg evaluation_config_hash "sha256:${FROZEN_CONFIG_SHA256}" \
            --argjson clean_sources "${clean_sources}" \
            '{
              schema_version,
              report_id,
              run_id,
              candidate_model_id,
              baseline_model_ids,
              promoted_model_id: .release_gate_results.promoted_model_id,
              promotion_decision: .release_gate_results.decision,
              gate_passed: .release_gate_results.passed,
              test_access_count,
              clean_evaluation_count: 2,
              source_evaluations: $clean_sources,
              primary_metric,
              paired_differences,
              code_commit: $code_commit,
              evaluation_image_digest: $evaluation_image_digest,
              evaluation_config_hash: $evaluation_config_hash
            }' evaluation-report.json > release-summary.json
          publish_public_json() {
            local source_file="$1"
            local relative_key="$2"
            test -s "${source_file}"
            aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "public/${report_id}/${relative_key}" \
              --body "${source_file}" \
              --content-type application/json \
              --checksum-algorithm SHA256 \
              --tagging "RetentionClass=public" \
              --if-none-match '*' >/dev/null
          }

          publish_public_json evaluation-report.json evaluation-report.json
          publish_public_json evaluation-provenance.json evaluation-provenance.json
          publish_public_json command-summary.json command-summary.json
          publish_public_json curated-queries.json curated-queries.json
          publish_public_json release-summary.json release-summary.json
          publish_public_json access-counter-clean-1.json access-counter-1.json
          publish_public_json access-counter-clean-2.json access-counter-2.json
          for clean_run in 1 2; do
            publish_public_json \
              "clean-${clean_run}/command-summary.json" \
              "clean-${clean_run}/command-summary.json"
            publish_public_json \
              "clean-${clean_run}/evaluation-report.json" \
              "clean-${clean_run}/evaluation-report.json"
            publish_public_json \
              "clean-${clean_run}/evaluation-provenance.json" \
              "clean-${clean_run}/evaluation-provenance.json"
            publish_public_json \
              "processing-job-evidence-clean-${clean_run}.json" \
              "clean-${clean_run}/processing-job-evidence.json"
          done
          echo "decision=${decision}" >> "${GITHUB_OUTPUT}"
          echo "report_id=${report_id}" >> "${GITHUB_OUTPUT}"
          if [[ "${decision}" == "retain_baseline" ]]; then
            echo "Promotion gate retained the frozen baseline; the prior pointer was not changed." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Build and publish the checksummed candidate release bundle
        if: steps.release_gate.outputs.decision == 'promote_candidate'
        env:
          REPORT_ID: ${{ steps.release_gate.outputs.report_id }}
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          mkdir -p .release/evaluation .release/candidate
          cp evaluation-report.json .release/evaluation/evaluation-report.json
          cp curated-queries.json .release/evaluation/curated-queries.json
          cp evaluation-provenance.json .release/evaluation/evaluation-provenance.json
          cp command-summary.json .release/evaluation/summary.json
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.container_eval import _candidate_root, _checkpoint, _training_summary
          from search_rank.artifacts.checksums import sha256_file

          root = _candidate_root(Path("candidate-model.tar.gz"), Path(".release/candidate"))
          training, _ = _training_summary(root)
          result = training["result"]
          checkpoint = _checkpoint(root, str(result["checkpoint_checksum"]))
          if str(result["candidate_model_id"]) != os.environ["CANDIDATE_MODEL_ID"]:
              raise SystemExit("candidate model ID differs from the frozen release input")

          work = Path(".release/evaluation").resolve()
          summary_path = work / "summary.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          provenance_path = work / "evaluation-provenance.json"
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          provenance["frozen_config"] = str(Path(os.environ["CANDIDATE_CONFIG_PATH"]).resolve())
          provenance_path.write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          replacements = {
              "evaluation_report": work / "evaluation-report.json",
              "curated_queries": work / "curated-queries.json",
              "evaluation_provenance": provenance_path,
          }
          summary["result"]["checkpoint"] = str(checkpoint)
          for name, path in replacements.items():
              summary["result"][name] = str(path)
              summary["artifact_paths"][name] = str(path)
              summary["artifact_hashes"][name] = "sha256:" + sha256_file(path)
          summary_path.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          uv run python -m search_rank.cli promote \
            --report-id "$(pwd)/.release/evaluation/evaluation-report.json"
          bundle="artifacts/releases/${REPORT_ID}"
          test -f "${bundle}/release-manifest.json"
          test -f "${bundle}/curated-queries.json"
          test -f "${bundle}/evaluation-report.json"
          test -f "${bundle}/public-evidence.json"
          test -f "${bundle}/bundle-checksums.json"
          test ! -e "${bundle}/public-run-summary.json"
          uv run python - "${bundle}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from search_rank.artifacts.checksums import sha256_file
          from search_rank.schemas.api import PublicEvidenceEnvelope

          root = Path(sys.argv[1]).resolve()
          release = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          evidence = PublicEvidenceEnvelope.model_validate_json(
              (root / "public-evidence.json").read_text(encoding="utf-8")
          )
          if release.get("release_id") != os.environ["REPORT_ID"]:
              raise SystemExit("release manifest ID differs from the bound report")
          if release.get("promoted_model_id") != os.environ["CANDIDATE_MODEL_ID"]:
              raise SystemExit("release manifest did not promote the gated candidate")
          if release.get("dataset_manifest_hash") != os.environ["DATASET_MANIFEST_HASH"]:
              raise SystemExit("release manifest dataset identity differs from the frozen input")
          if evidence.evidence_mode != "verified":
              raise SystemExit("candidate release requires verified public evidence")
          if release.get("evidence_mode") != "verified":
              raise SystemExit("candidate release manifest must be explicitly verified")
          if evidence.evaluation.report_id != os.environ["REPORT_ID"]:
              raise SystemExit("public evidence is not bound to the evaluation report")
          if evidence.evaluation.release_status != "passed":
              raise SystemExit("candidate release evidence does not record a passed gate")
          if evidence.evaluation.candidate_model_id != os.environ["CANDIDATE_MODEL_ID"]:
              raise SystemExit("public evidence candidate differs from the frozen input")

          actual_files = {
              path.relative_to(root).as_posix(): "sha256:" + sha256_file(path)
              for path in sorted(root.rglob("*"))
              if path.is_file() and path.name != "bundle-checksums.json"
          }
          bundle_checksums = json.loads(
              (root / "bundle-checksums.json").read_text(encoding="utf-8")
          )
          if bundle_checksums.get("schema_version") != "1.0.0":
              raise SystemExit("bundle checksum manifest has an unsupported schema")
          if bundle_checksums.get("files") != actual_files:
              raise SystemExit("bundle checksum inventory does not exactly cover the release")
          artifact_checksums = release.get("artifact_checksums")
          required = {
              "public-evidence.json",
              "curated-queries.json",
              "evaluation-report.json",
          }
          if not isinstance(artifact_checksums, dict) or not required <= artifact_checksums.keys():
              raise SystemExit("release manifest does not bind every public evidence artifact")
          for name in required:
              if artifact_checksums[name] != actual_files[name]:
                  raise SystemExit(f"release manifest checksum differs for {name}")
          PY
          prefix="promoted/${CANDIDATE_MODEL_ID}/"
          existing="$(aws s3api list-objects-v2 --bucket "${ARTIFACT_BUCKET}" --prefix "${prefix}" --max-items 1 --query 'KeyCount' --output text)"
          test "${existing}" = "0"
          while IFS= read -r -d '' file; do
            relative="${file#${bundle}/}"
            aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${prefix}${relative}" \
              --body "${file}" \
              --checksum-algorithm SHA256 \
              --tagging "RetentionClass=promoted" \
              --if-none-match '*' >/dev/null
          done < <(find "${bundle}" -type f -print0)
          jq -n \
            --arg release "${REPORT_ID}" \
            --arg model "${CANDIDATE_MODEL_ID}" \
            --arg bundle_key "${prefix}" \
            --arg report "${REPORT_ID}" \
            --arg commit "${GITHUB_SHA}" \
            --arg previous_release "$(jq -r '.release_id' previous-pointer.json)" \
            --arg previous_model "$(jq -r '.model_id' previous-pointer.json)" \
            --arg previous_version "$(cat previous-pointer-version.txt)" \
            '{schema_version: "1.0.0", release_id: $release, model_id: $model,
              bundle_s3_key: $bundle_key, evaluation_report_id: $report, git_sha: $commit,
              evidence_mode: "verified",
              previous: {release_id: $previous_release, model_id: $previous_model,
                pointer_version_id: $previous_version}}' > promotion-pointer.json
          aws s3api put-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            --body promotion-pointer.json \
            --content-type application/json \
            --checksum-algorithm SHA256 \
            --tagging "RetentionClass=promoted" \
            --if-match "$(cat previous-pointer-etag.txt)" > promotion-put-result.json
          echo "Promotion gate passed; immutable bundle and versioned pointer were published." >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: heldout-release-evidence-${{ github.run_id }}
