          fi
      - name: Build and publish the checksummed held-out outcome bundle
        env:
          REPORT_ID: ${{ steps.release_gate.outputs.report_id }}
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          mkdir -p .release/evaluation .release/candidate
          cp evaluation-report.json .release/evaluation/evaluation-report.json
          cp curated-queries.json .release/evaluation/curated-queries.json
          cp evaluation-provenance.json .release/evaluation/evaluation-provenance.json
          cp command-summary.json .release/evaluation/summary.json
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.container_eval import _candidate_root, _checkpoint, _training_summary
          from search_rank.artifacts.checksums import sha256_file
          from search_rank.schemas.model import ModelArtifact

          root = _candidate_root(Path("candidate-model.tar.gz"), Path(".release/candidate"))
          training, _ = _training_summary(root)
          result = training["result"]
          checkpoint = _checkpoint(root, str(result["checkpoint_checksum"]))
          if str(result["candidate_model_id"]) != os.environ["CANDIDATE_MODEL_ID"]:
              raise SystemExit("candidate model ID differs from the frozen release input")
          model_artifact_paths = list(root.rglob("model-manifest.json"))
          if len(model_artifact_paths) != 1:
              raise SystemExit("candidate archive must contain exactly one ModelArtifact")
          source_model_artifact_path = model_artifact_paths[0]
          source_model_artifact = ModelArtifact.model_validate_json(
              source_model_artifact_path.read_text(encoding="utf-8")
          )
          if not (
              source_model_artifact.model_id == os.environ["CANDIDATE_MODEL_ID"]
              and source_model_artifact.artifact_checksum == result["checkpoint_checksum"]
              and source_model_artifact.evaluation_report_id == "not_evaluated"
              and source_model_artifact.promoted is False
          ):
              raise SystemExit("candidate ModelArtifact differs from the training summary")
          Path(".release/training-model-artifact.json").write_bytes(
              source_model_artifact_path.read_bytes()
          )

          work = Path(".release/evaluation").resolve()
          summary_path = work / "summary.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          provenance_path = work / "evaluation-provenance.json"
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          provenance["frozen_config"] = str(Path(os.environ["CANDIDATE_CONFIG_PATH"]).resolve())
          provenance_path.write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          replacements = {
              "evaluation_report": work / "evaluation-report.json",
              "curated_queries": work / "curated-queries.json",
              "evaluation_provenance": provenance_path,
          }
          summary["result"]["checkpoint"] = str(checkpoint)
          for name, path in replacements.items():
              summary["result"][name] = str(path)
              summary["artifact_paths"][name] = str(path)
              summary["artifact_hashes"][name] = "sha256:" + sha256_file(path)
          summary_path.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          evaluation_runtime_seconds="$(uv run python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          total = 0.0
          for ordinal in (1, 2):
              payload = json.loads(
                  Path(f"processing-job-evidence-clean-{ordinal}.json").read_text(
                      encoding="utf-8"
                  )
              )
              started = datetime.fromisoformat(
                  str(payload["creation_time"]).replace("Z", "+00:00")
              )
              ended = datetime.fromisoformat(
                  str(payload["end_time"]).replace("Z", "+00:00")
              )
              duration = (ended - started).total_seconds()
              if duration < 0:
                  raise SystemExit("Processing job ended before it was created")
              total += duration
          print(total)
          PY
          )"
          evaluation_estimated_cost_usd="$(jq -er '.maximum_job_estimate_usd' cost-preflight.json)"
          uv run python -m search_rank.cli promote \
            --report-id "$(pwd)/.release/evaluation/evaluation-report.json" \
            --trial-selection "$(pwd)/trial-selection.json" \
            --selected-training-run-manifest \
              "$(pwd)/.trial-selection-manifests/candidate_treatment.json" \
            --selected-training-model-artifact \
              "$(pwd)/.release/training-model-artifact.json" \
            --evaluation-runtime-seconds "${evaluation_runtime_seconds}" \
            --evaluation-estimated-cost-usd "${evaluation_estimated_cost_usd}"
          bundle="artifacts/releases/${REPORT_ID}"
          test -f "${bundle}/release-manifest.json"
          test -f "${bundle}/curated-queries.json"
          test -f "${bundle}/evaluation-report.json"
          test -f "${bundle}/candidate-model-artifact.json"
          test -f "${bundle}/public-evidence.json"
          test -f "${bundle}/bundle-checksums.json"
          test -f "${bundle}/LICENSE"
          test -f "${bundle}/NOTICE"
          test ! -e "${bundle}/public-run-summary.json"
          uv run python - "${bundle}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from search_rank.artifacts.checksums import sha256_file
          from search_rank.schemas.api import PublicEvidenceEnvelope
          from search_rank.schemas.evidence import BundleChecksums, ReleaseManifest
          from search_rank.schemas.model import ModelArtifact
          from search_rank.schemas.run import RunManifest
          from search_rank.schemas.trial import TrialSelection

          root = Path(sys.argv[1]).resolve()
          release = ReleaseManifest.model_validate_json(
              (root / "release-manifest.json").read_text(encoding="utf-8")
          ).model_dump(mode="json", exclude_none=True)
          evidence = PublicEvidenceEnvelope.model_validate_json(
              (root / "public-evidence.json").read_text(encoding="utf-8")
          )
          if release.get("release_id") != os.environ["REPORT_ID"]:
              raise SystemExit("release manifest ID differs from the bound report")
          decision = evidence.evaluation.release_status
          expected_model = (
              os.environ["CANDIDATE_MODEL_ID"]
              if decision == "passed"
              else evidence.evaluation.strongest_baseline_model_id
          )
          if release.get("promoted_model_id") != expected_model:
              raise SystemExit("release manifest does not name the gate-selected active model")
          if release.get("dataset_manifest_hash") != os.environ["DATASET_MANIFEST_HASH"]:
              raise SystemExit("release manifest dataset identity differs from the frozen input")
          source_manifest = json.loads(Path("heldout-manifest.json").read_text(encoding="utf-8"))
          internal_provenance = json.loads(
              (root / "evaluation-provenance.json").read_text(encoding="utf-8")
          )
          split_hashes = {
              source_manifest.get("split_manifest_hash"),
              internal_provenance.get("split_manifest_hash"),
              release.get("split_manifest_hash"),
              evidence.run.split_manifest_hash,
              os.environ["SPLIT_MANIFEST_HASH"],
          }
          if len(split_hashes) != 1:
              raise SystemExit("source, evaluation, release, and public split identities differ")
          if evidence.evidence_mode != "verified":
              raise SystemExit("candidate release requires verified public evidence")
          if release.get("evidence_mode") != "verified":
              raise SystemExit("candidate release manifest must be explicitly verified")
          if evidence.evaluation.report_id != os.environ["REPORT_ID"]:
              raise SystemExit("public evidence is not bound to the evaluation report")
          if evidence.evaluation.release_status not in {"passed", "failed"}:
              raise SystemExit("release evidence has no terminal held-out decision")
          if evidence.evaluation.candidate_model_id != os.environ["CANDIDATE_MODEL_ID"]:
              raise SystemExit("public evidence candidate differs from the frozen input")
          if evidence.evaluation.release_status == "failed" and expected_model == os.environ["CANDIDATE_MODEL_ID"]:
              raise SystemExit("failed candidate must never be named as the active model")

          selection_path = Path("trial-selection.json")
          selection = TrialSelection.model_validate_json(
              selection_path.read_text(encoding="utf-8")
          )
          training_manifest_path = Path(
              ".trial-selection-manifests/candidate_treatment.json"
          )
          training_manifest = RunManifest.model_validate_json(
              training_manifest_path.read_text(encoding="utf-8")
          )
          source_model_artifact_path = Path(".release/training-model-artifact.json")
          source_model_artifact = ModelArtifact.model_validate_json(
              source_model_artifact_path.read_text(encoding="utf-8")
          )
          final_model_artifact_path = root / "candidate-model-artifact.json"
          final_model_artifact = ModelArtifact.model_validate_json(
              final_model_artifact_path.read_text(encoding="utf-8")
          )
          treatment = next(
              trial for trial in selection.trials if trial.role == "candidate_treatment"
          )
          training = evidence.run.training_provenance
          evaluation = evidence.run.evaluation_provenance
          if (
              training.trial_selection_id != selection.selection_id
              or training.trial_selection_sha256
              != "sha256:" + sha256_file(selection_path)
              or training.run_id != training_manifest.run_id
              or training.run_manifest_sha256
              != "sha256:" + sha256_file(training_manifest_path)
              or training.selected_model_artifact_checksum
              != treatment.candidate_checkpoint_sha256
              or evaluation.candidate_model_artifact_checksum
              != treatment.candidate_checkpoint_sha256
              or evaluation.clean_execution_count != 2
              or final_model_artifact.model_id != source_model_artifact.model_id
              or final_model_artifact.run_id != training_manifest.run_id
              or final_model_artifact.artifact_checksum
              != source_model_artifact.artifact_checksum
              or final_model_artifact.source_model_artifact_sha256
              != "sha256:" + sha256_file(source_model_artifact_path)
              or final_model_artifact.selected_training_run_manifest_sha256
              != "sha256:" + sha256_file(training_manifest_path)
              or final_model_artifact.evaluation_report_sha256
              != "sha256:" + sha256_file(root / "evaluation-report.json")
              or final_model_artifact.evaluation_report_id != os.environ["REPORT_ID"]
              or final_model_artifact.promoted
              != (expected_model == os.environ["CANDIDATE_MODEL_ID"])
