          publish_public_json evaluation-provenance.json evaluation-provenance.json evaluation-provenance
          publish_public_json command-summary.json command-summary.json command-summary
          publish_public_json curated-queries.json curated-queries.json curated-queries
          publish_public_json release-summary.json release-summary.json release-summary
          publish_public_json access-counter-clean-1.json access-counter-1.json access-counter
          publish_public_json access-counter-clean-2.json access-counter-2.json access-counter
          uv run python - <<'PY'
          from pathlib import Path

          from search_rank.schemas.workflow import SageMakerProcessingQuotaPreflight

          SageMakerProcessingQuotaPreflight.model_validate_json(
              Path("processing-quota-preflight.json").read_text(encoding="utf-8")
          )
          PY
          publish_public_json processing-quota-preflight.json \
            processing-quota-preflight.json processing-quota-preflight
          for clean_run in 1 2; do
            publish_public_json \
              "clean-${clean_run}/command-summary.json" \
              "clean-${clean_run}/command-summary.json" \
              command-summary
            publish_public_json \
              "clean-${clean_run}/evaluation-report.json" \
              "clean-${clean_run}/evaluation-report.json" \
              evaluation-report
            publish_public_json \
              "clean-${clean_run}/evaluation-provenance.json" \
              "clean-${clean_run}/evaluation-provenance.json" \
              evaluation-provenance
            publish_public_json \
              "processing-job-evidence-clean-${clean_run}.json" \
              "clean-${clean_run}/processing-job-evidence.json" \
              processing-job-evidence
          done
          aws s3api list-objects-v2 \
            --bucket "${ARTIFACT_BUCKET}" \
            --prefix "public/${report_id}/" \
            --no-paginate > published-public-release-objects.json
          jq -e --arg prefix "public/${report_id}/" '
            .IsTruncated != true and
            ([.Contents[].Key] | sort) == ([
              "access-counter-1.json",
              "access-counter-2.json",
              "command-summary.json",
              "curated-queries.json",
              "evaluation-provenance.json",
              "evaluation-report.json",
              "processing-quota-preflight.json",
              "release-summary.json",
              "clean-1/command-summary.json",
              "clean-1/evaluation-provenance.json",
              "clean-1/evaluation-report.json",
              "clean-1/processing-job-evidence.json",
              "clean-2/command-summary.json",
              "clean-2/evaluation-provenance.json",
              "clean-2/evaluation-report.json",
              "clean-2/processing-job-evidence.json"
            ] | map($prefix + .) | sort)' published-public-release-objects.json >/dev/null
          echo "decision=${decision}" >> "${GITHUB_OUTPUT}"
          echo "report_id=${report_id}" >> "${GITHUB_OUTPUT}"
          if [[ "${decision}" == "retain_baseline" ]]; then
