name: Guarded held-out evaluation and promotion

on:
  workflow_dispatch:
    inputs:
      dispatch_config:
        description: Exact JSON; copy docs/workflow-inputs/release.example.json and replace every frozen value
        required: true
        type: string
      allow_heldout_eval:
        description: Type 1 only after all hashes and the access count are frozen
        required: true
        type: string
      authorization:
        description: Type RUN TWO CLEAN HELDOUT EVALUATIONS after reviewing the locked inputs
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-financial-operations
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CAMPAIGN_BUDGET_USD: "40"
  REQUIRED_CREDIT_RESERVE_USD: "40"
  MAXIMUM_OUT_OF_POCKET_USD: "0"

jobs:
  evaluate-and-promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: heldout-release
    env:
      ALLOW_HELDOUT_EVAL: ${{ inputs.allow_heldout_eval }}
      AUTHORIZATION: ${{ inputs.authorization }}
      CAMPAIGN_SPEND_TO_DATE_USD: ${{ secrets.AWS_CAMPAIGN_SPEND_TO_DATE_USD }}
      REMAINING_APPLICABLE_CREDIT_USD: ${{ secrets.AWS_REMAINING_APPLICABLE_CREDIT_USD }}
      FINANCIAL_SNAPSHOT_OBSERVED_AT: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_OBSERVED_AT }}
      FINANCIAL_SNAPSHOT_RECEIPT_SHA256: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_RECEIPT_SHA256 }}
      FINANCIAL_SNAPSHOT_HMAC_KEY: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_HMAC_KEY }}
      FINANCIAL_RESERVATION_MAX_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_MAX_USD }}
      FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD }}
      FINANCIAL_RESERVATION_CPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_CPU_HOURS }}
      FINANCIAL_RESERVATION_GPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_GPU_HOURS }}
      FINANCIAL_CPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_CPU_HOURS_USED_TO_DATE }}
      FINANCIAL_GPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_GPU_HOURS_USED_TO_DATE }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_WORKFLOW: release
      FINANCIAL_SNAPSHOT_AUTHORIZATION_INPUTS_JSON: ${{ toJSON(inputs) }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_COMMIT_SHA: ${{ github.sha }}
      FINANCIAL_SNAPSHOT_SOURCE: "aws_billing_and_cost_management_console"
      FINANCIAL_SNAPSHOT_MAX_AGE_SECONDS: "21600"
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      PROCESSING_ROLE_ARN: ${{ vars.AWS_SAGEMAKER_PROCESSING_ROLE_ARN }}
      EVAL_REPOSITORY: ${{ vars.AWS_EVAL_ECR_REPOSITORY_URL }}
      INSTANCE_TYPE: ml.m5.xlarge
      PROJECT_NAME: product-search-ranking
      ENVIRONMENT_NAME: prod
      OWNER_ALIAS: ${{ vars.TF_OWNER_ALIAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Validate and unpack the exact dispatch configuration
        env:
          DISPATCH_CONFIG_JSON: ${{ inputs.dispatch_config }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_workflow_dispatch.py --workflow release
      - name: Validate frozen release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${AUTHORIZATION}" = "RUN TWO CLEAN HELDOUT EVALUATIONS"
          test "${ALLOW_HELDOUT_EVAL}" = "1"
          test "${AWS_REGION}" = "us-east-1"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          [[ "${FROZEN_CONFIG_PATH}" =~ ^configs/experiments/[A-Za-z0-9._/-]+\.ya?ml$ ]]
          [[ "${FROZEN_CONFIG_PATH}" != *".."* ]]
          test -f "${FROZEN_CONFIG_PATH}"
          [[ "${CANDIDATE_CONFIG_PATH}" =~ ^configs/experiments/[A-Za-z0-9._/-]+\.ya?ml$ ]]
          [[ "${CANDIDATE_CONFIG_PATH}" != *".."* ]]
          test -f "${CANDIDATE_CONFIG_PATH}"
          [[ "${CANDIDATE_RUN_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,62}$ ]]
          [[ "${CANDIDATE_MODEL_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]{2,99}$ ]]
          [[ "${CANDIDATE_ARTIFACT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${CANDIDATE_CHECKPOINT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${CANDIDATE_CONFIG_SHA256}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${TRIAL_SELECTION_S3_KEY}" =~ ^runs/trial-selection/trial-selection-[0-9a-f]{20}/trial-selection\.json$ ]]
          [[ "${TRIAL_SELECTION_S3_KEY}" != *".."* ]]
          [[ "${TRIAL_SELECTION_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${FROZEN_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${DATASET_MANIFEST_HASH}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${BASELINE_RUN_SUMMARY_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${BASELINE_SELECTION_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${BASELINE_CONFIG_PATH}" = "configs/experiments/baselines-v1.yaml"
          [[ "${BASELINE_CONFIG_FILE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test -f "${BASELINE_CONFIG_PATH}"
          test "$(sha256sum "${BASELINE_CONFIG_PATH}" | cut -d' ' -f1)" = \
            "${BASELINE_CONFIG_FILE_SHA256}"
          [[ "${EVALUATION_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${EVALUATION_IMAGE_URI}" = "${EVAL_REPOSITORY}@${EVALUATION_IMAGE_DIGEST}"
          [[ "${CANDIDATE_ARTIFACT_S3_KEY}" == runs/* ]]
          [[ "${BASELINE_RUN_SUMMARY_S3_KEY}" == runs/* ]]
          [[ "${BASELINE_SELECTION_S3_KEY}" == runs/* ]]
          [[ "${HELDOUT_DATA_S3_PREFIX}" == data/processed/* ]]
          [[ "${CANDIDATE_ARTIFACT_S3_URI}" =~ ^s3://[a-z0-9.-]+/[A-Za-z0-9._/-]+$ ]]
          [[ "${HELDOUT_DATA_S3_URI}" =~ ^s3://[a-z0-9.-]+/[A-Za-z0-9._/-]+$ ]]
          [[ "${BASELINE_RUN_SUMMARY_S3_URI}" =~ ^s3://[a-z0-9.-]+/[A-Za-z0-9._/-]+\.json$ ]]
          [[ "${BASELINE_SELECTION_S3_URI}" =~ ^s3://[a-z0-9.-]+/[A-Za-z0-9._/-]+\.json$ ]]
          [[ "${CANDIDATE_ARTIFACT_S3_URI}" != *".."* ]]
          [[ "${HELDOUT_DATA_S3_URI}" != *".."* ]]
          [[ "${BASELINE_RUN_SUMMARY_S3_URI}" != *".."* ]]
          [[ "${BASELINE_SELECTION_S3_URI}" != *".."* ]]
          [[ "${CANDIDATE_ARTIFACT_S3_URI}" == *.tar.gz ]]
          [[ "${BASELINE_IDS}" =~ ^[A-Za-z0-9._@-]+(,[A-Za-z0-9._@-]+)+$ ]]
          [[ "${STRONGEST_BASELINE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]{2,99}$ ]]
          case ",${BASELINE_IDS}," in
            *",${STRONGEST_BASELINE_ID},"*) ;;
            *) echo "Strongest baseline is absent from the frozen baseline declaration" >&2; exit 1 ;;
          esac
          actual_config_hash="$(sha256sum "${FROZEN_CONFIG_PATH}" | cut -d' ' -f1)"
          test "${actual_config_hash}" = "${FROZEN_CONFIG_SHA256}"
          [[ "${TEST_ACCESS_COUNTER}" =~ ^[1-9][0-9]*$ ]]
          : "${PROCESSING_ROLE_ARN:?Missing AWS_SAGEMAKER_PROCESSING_ROLE_ARN variable}"
          : "${EVAL_REPOSITORY:?Missing AWS_EVAL_ECR_REPOSITORY_URL variable}"
          [[ "${OWNER_ALIAS}" =~ ^[A-Za-z0-9_.-]{2,32}$ ]]
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-heldout-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Prove one ml.m5.xlarge Processing instance is available
        shell: bash
        run: |
          set -euo pipefail
          test "${AWS_REGION}" = "us-east-1"
          test "${INSTANCE_TYPE}" = "ml.m5.xlarge"
          aws service-quotas get-service-quota \
            --region "${AWS_REGION}" \
            --service-code sagemaker \
            --quota-code L-0307F515 \
            --output json > processing-quota-response.private.json
          uv sync --frozen --all-extras
          uv run python - <<'PY'
          import json
          import math
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from search_rank.schemas.workflow import SageMakerProcessingQuotaPreflight

          response = json.loads(
              Path("processing-quota-response.private.json").read_text(encoding="utf-8")
          )
          quota = response.get("Quota")
          if not isinstance(quota, dict):
              raise SystemExit("Service Quotas returned no Processing quota; refusing held-out access")
          expected = {
              "ServiceCode": "sagemaker",
              "QuotaCode": "L-0307F515",
              "QuotaName": "ml.m5.xlarge for processing job usage",
          }
          if any(quota.get(field) != value for field, value in expected.items()):
              raise SystemExit("Service Quotas returned a different Processing quota")
          raw_value = quota.get("Value")
          if isinstance(raw_value, bool) or not isinstance(raw_value, (int, float)):
              raise SystemExit("Processing quota applied value is not numeric")
          applied_value = float(raw_value)
          if not math.isfinite(applied_value) or applied_value < 1:
              raise SystemExit(
                  "Applied ml.m5.xlarge Processing quota is below one; refusing held-out access"
              )
          evidence = SageMakerProcessingQuotaPreflight.model_validate(
              {
                  "schema_version": "1.0.0",
                  "artifact_type": "sagemaker_processing_quota_preflight",
                  "checked_at": datetime.now(timezone.utc),
                  "region": os.environ["AWS_REGION"],
                  "service_code": quota["ServiceCode"],
                  "instance_type": os.environ["INSTANCE_TYPE"],
                  "quota_code": quota["QuotaCode"],
                  "quota_name": quota["QuotaName"],
                  "applied_value": applied_value,
                  "required_value": 1,
                  "quota_guard_passed": True,
              }
          )
          Path("processing-quota-preflight.json").write_text(
              evidence.model_dump_json(indent=2) + "\n", encoding="utf-8"
          )
          PY
          rm processing-quota-response.private.json
      - name: Bind the evaluation digest to the evaluated Git commit
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${EVAL_REPOSITORY#*/}"
          tagged_digest="$(aws ecr describe-images \
            --repository-name "${repository_name}" \
            --image-ids "imageTag=sha-${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "${tagged_digest}" = "${EVALUATION_IMAGE_DIGEST}"
      - name: Retrieve current processing price and enforce the zero-spend guard
        shell: bash
        run: |
          set -euo pipefail
          aws pricing get-products \
            --region us-east-1 \
            --service-code AmazonSageMaker \
            --filters \
              "Type=TERM_MATCH,Field=regionCode,Value=${AWS_REGION}" \
              "Type=TERM_MATCH,Field=instanceType,Value=${INSTANCE_TYPE}" \
            --max-results 100 > pricing.json
          PYTHONPATH=src uv run python scripts/validate_financial_snapshot.py emit \
            --output financial-snapshot.json
          python - <<'PY'
          import json
          import os
          from decimal import Decimal, InvalidOperation, ROUND_UP

          from scripts.validate_financial_reservation import validate_reservation_coverage

          with open("financial-snapshot.json", encoding="utf-8") as handle:
              financial_snapshot = json.load(handle)

          def amount(name: str) -> Decimal:
              try:
                  value = Decimal(os.environ[name])
              except (InvalidOperation, KeyError) as exc:
                  raise SystemExit(f"{name} must be a decimal number") from exc
              if not value.is_finite() or value < 0:
                  raise SystemExit(f"{name} must be finite and non-negative")
              return value

          with open("pricing.json", encoding="utf-8") as handle:
              response = json.load(handle)
          prices = []
          for encoded in response.get("PriceList", []):
              product = json.loads(encoded)
              for term in product.get("terms", {}).get("OnDemand", {}).values():
                  for dimension in term.get("priceDimensions", {}).values():
                      if dimension.get("unit") in {"Hrs", "Hours"}:
                          price = Decimal(dimension.get("pricePerUnit", {}).get("USD", "0"))
                          if price > 0:
                              prices.append(price)
          if not prices:
              raise SystemExit("No current SageMaker processing price found; refusing held-out access")
          timeout = int(os.environ["MAX_TIMEOUT_SECONDS"])
          if timeout <= 0 or timeout > 7200:
              raise SystemExit("Each of the two Processing jobs must be capped at two hours")
          hours = (Decimal(timeout) / Decimal(3600)).quantize(Decimal("0.0001"), rounding=ROUND_UP)
          unit_price = max(prices)
          total_hours = hours * 2
          estimate = (total_hours * unit_price).quantize(Decimal("0.01"), rounding=ROUND_UP)
          spent = amount("CAMPAIGN_SPEND_TO_DATE_USD")
          remaining = amount("ESTIMATED_REMAINING_NON_JOB_USD")
          credit = amount("REMAINING_APPLICABLE_CREDIT_USD")
          reserve = amount("REQUIRED_CREDIT_RESERVE_USD")
          if amount("MAXIMUM_OUT_OF_POCKET_USD") != 0:
              raise SystemExit("Owner-approved out-of-pocket limit must be exactly zero")
          if estimate > amount("DECLARED_JOB_COST_CAP_USD"):
              raise SystemExit("Live upper-bound estimate exceeds the declared job cap")
          if spent + estimate + remaining > amount("CAMPAIGN_BUDGET_USD"):
              raise SystemExit("Processing would breach the USD 40 campaign envelope")
          if credit < estimate + remaining + reserve:
              raise SystemExit("Applicable credit cannot cover processing, the remaining plan, and reserve")
          if amount("CPU_HOURS_USED_TO_DATE") + total_hours > 10:
              raise SystemExit("Two clean Processing jobs would breach the 10 paid CPU-instance-hour campaign cap")
          validate_reservation_coverage(
              os.environ,
              required_max_usd=estimate,
              required_remaining_committed_usd=remaining,
              required_cpu_hours=total_hours,
              required_gpu_hours=0,
          )
          evidence = {
              "schema_version": "1.0.0",
              "artifact_type": "evaluation_cost_preflight",
              "guard_passed": True,
              "region": os.environ["AWS_REGION"],
              "instance_type": os.environ["INSTANCE_TYPE"],
              "independent_processing_job_count": 2,
              "maximum_runtime_seconds_per_job": timeout,
              "maximum_total_instance_hours": str(total_hours),
              "on_demand_hourly_upper_bound_usd": str(unit_price),
              "maximum_job_estimate_usd": str(estimate),
              "required_credit_reserve_usd": str(reserve),
              "maximum_out_of_pocket_usd": "0",
              "financial_snapshot": financial_snapshot,
          }
          with open("cost-preflight.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
          print(f"Guard passed; the two-job upper-bound processing estimate is ${estimate}.")
          PY
          rm financial-snapshot.json
      - name: Download and verify the frozen candidate and baseline artifacts
        shell: bash
        run: |
          set -euo pipefail
          without_scheme="${CANDIDATE_ARTIFACT_S3_URI#s3://}"
          bucket="${without_scheme%%/*}"
          key="${without_scheme#*/}"
          test "${bucket}" = "${ARTIFACT_BUCKET}"
          aws s3api head-object --bucket "${bucket}" --key "${key}" --checksum-mode ENABLED > candidate-head.json
          aws s3 cp "${CANDIDATE_ARTIFACT_S3_URI}" candidate-model.tar.gz --no-progress
          actual_archive_hash="$(sha256sum candidate-model.tar.gz | cut -d' ' -f1)"
          test "${actual_archive_hash}" = "${CANDIDATE_ARTIFACT_SHA256}"
          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path

          destination = Path("candidate-preflight")
          destination.mkdir()
          root = destination.resolve()
          with tarfile.open("candidate-model.tar.gz", "r:gz") as handle:
              for member in handle.getmembers():
                  target = (destination / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"unsafe candidate archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"candidate archive link rejected: {member.name}")
              handle.extractall(destination, filter="data")

          summaries = []
          for path in sorted(destination.rglob("summary.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("command") == "train" and payload.get("status") == "succeeded":
                  summaries.append(payload)
          if len(summaries) != 1:
              raise SystemExit("candidate archive must contain one successful training summary")
          result = summaries[0]["result"]
          expected = {
              "candidate_model_id": os.environ["CANDIDATE_MODEL_ID"],
              "checkpoint_checksum": "sha256:" + os.environ["CANDIDATE_CHECKPOINT_SHA256"],
              "config_hash": os.environ["CANDIDATE_CONFIG_SHA256"],
              "dataset_manifest_hash": os.environ["DATASET_MANIFEST_HASH"],
          }
          for field, value in expected.items():
              if result.get(field) != value:
                  raise SystemExit(f"candidate training summary {field} differs from frozen input")

          def file_hash(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  while chunk := stream.read(1024 * 1024):
                      digest.update(chunk)
              return digest.hexdigest()

          def directory_hash(path: Path) -> str:
              digest = hashlib.sha256()
              for item in sorted(candidate for candidate in path.rglob("*") if candidate.is_file()):
                  digest.update(item.relative_to(path).as_posix().encode())
                  digest.update(b"\0")
                  digest.update(file_hash(item).encode("ascii"))
                  digest.update(b"\n")
              return digest.hexdigest()

          matches = [
              path for path in destination.rglob("best")
              if path.is_dir() and directory_hash(path) == os.environ["CANDIDATE_CHECKPOINT_SHA256"]
          ]
          if len(matches) != 1:
              raise SystemExit("candidate checkpoint directory hash is not unique and valid")
          frozen_configs = list(destination.rglob("frozen-experiment.yaml"))
          if len(frozen_configs) != 1:
              raise SystemExit("candidate archive must contain one frozen experiment configuration")
          committed = Path(os.environ["CANDIDATE_CONFIG_PATH"])
          if frozen_configs[0].read_bytes() != committed.read_bytes():
              raise SystemExit("candidate archive configuration differs from the committed frozen file")
          PY
          aws s3 cp "${BASELINE_RUN_SUMMARY_S3_URI}" baseline-run-summary.json --no-progress
          aws s3 cp "${BASELINE_SELECTION_S3_URI}" baseline-selection.json --no-progress
          test "$(sha256sum baseline-run-summary.json | cut -d' ' -f1)" = "${BASELINE_RUN_SUMMARY_SHA256}"
          test "$(sha256sum baseline-selection.json | cut -d' ' -f1)" = "${BASELINE_SELECTION_SHA256}"
          baseline_config_hash="$(uv run python scripts/validate_release_artifacts.py \
            baseline-evidence \
            --command-summary baseline-run-summary.json \
            --baseline-summary baseline-selection.json \
            --baseline-config "${BASELINE_CONFIG_PATH}" \
            --baseline-config-file-sha256 "${BASELINE_CONFIG_FILE_SHA256}" \
            --baseline-summary-sha256 "${BASELINE_SELECTION_SHA256}" \
            --expected-git-sha "${GITHUB_SHA}" \
            --dataset-manifest-hash "${DATASET_MANIFEST_HASH}" \
            --strongest-baseline-id "${STRONGEST_BASELINE_ID}" \
            --baseline-ids "${BASELINE_IDS}")"
          [[ "${baseline_config_hash}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'BASELINE_CONFIG_HASH=%s\n' "${baseline_config_hash}" >> "${GITHUB_ENV}"
          aws s3 cp "${HELDOUT_DATA_S3_URI%/}/manifest.json" heldout-manifest.json --no-progress
          split_manifest_hash="$(jq -er '.split_manifest_hash | select(test("^sha256:[0-9a-f]{64}$"))' heldout-manifest.json)"
          printf 'SPLIT_MANIFEST_HASH=%s\n' "${split_manifest_hash}" >> "${GITHUB_ENV}"
          jq -e --arg dataset_hash "${DATASET_MANIFEST_HASH}" \
            --arg split_hash "${split_manifest_hash}" \
            '.processed_checksum == $dataset_hash and .split_manifest_hash == $split_hash and
             (.split_counts.test.query_count | type == "number") and
             (.split_query_id_hashes.test | startswith("sha256:"))' \
            heldout-manifest.json >/dev/null
      - name: Require the immutable treatment and both validation-only controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trial-selection-sources .trial-selection-manifests
          aws s3 cp "s3://${ARTIFACT_BUCKET}/${TRIAL_SELECTION_S3_KEY}" \
            trial-selection.json --no-progress
          test "$(sha256sum trial-selection.json | cut -d' ' -f1)" = "${TRIAL_SELECTION_SHA256}"
          for role in candidate_treatment random_negative_control title_only_control; do
            source_key="$(jq -er --arg role "${role}" \
              '.trials[] | select(.role == $role) | .candidate_release_inputs_s3_key' \
              trial-selection.json)"
            source_hash="$(jq -er --arg role "${role}" \
              '.trials[] | select(.role == $role) | .candidate_release_inputs_sha256' \
              trial-selection.json)"
            manifest_key="$(jq -er --arg role "${role}" \
              '.trials[] | select(.role == $role) | .training_run_manifest_s3_key' \
              trial-selection.json)"
            manifest_hash="$(jq -er --arg role "${role}" \
              '.trials[] | select(.role == $role) | .training_run_manifest_sha256' \
              trial-selection.json)"
            [[ "${source_key}" =~ ^runs/[A-Za-z0-9._/-]+/reports/candidate-release-inputs\.json$ ]]
            [[ "${manifest_key}" =~ ^runs/[A-Za-z0-9._/-]+/reports/run-manifest\.json$ ]]
            [[ "${source_key}" != *".."* && "${manifest_key}" != *".."* ]]
            [[ "${source_hash}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${manifest_hash}" =~ ^sha256:[0-9a-f]{64}$ ]]
            aws s3 cp "s3://${ARTIFACT_BUCKET}/${source_key}" \
              ".trial-selection-sources/${role}.json" --no-progress
            aws s3 cp "s3://${ARTIFACT_BUCKET}/${manifest_key}" \
              ".trial-selection-manifests/${role}.json" --no-progress
            source_actual="sha256:$(sha256sum ".trial-selection-sources/${role}.json" | cut -d' ' -f1)"
            manifest_actual="sha256:$(sha256sum ".trial-selection-manifests/${role}.json" | cut -d' ' -f1)"
            test "${source_actual}" = "${source_hash}"
            test "${manifest_actual}" = "${manifest_hash}"
          done
          uv sync --frozen --all-extras
          uv run python scripts/trial_selection.py verify \
            --selection trial-selection.json \
            --repository-root . \
            --git-sha "${GITHUB_SHA}" \
            --dataset-manifest-hash "${DATASET_MANIFEST_HASH}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-model-id "${CANDIDATE_MODEL_ID}" \
            --candidate-config-sha256 "${CANDIDATE_CONFIG_SHA256}" \
            --candidate-artifact-s3-key "${CANDIDATE_ARTIFACT_S3_KEY}" \
            --candidate-artifact-sha256 "${CANDIDATE_ARTIFACT_SHA256}" \
            --source-dir .trial-selection-sources \
            --run-manifest-dir .trial-selection-manifests \
            > trial-selection-verification.json
          jq -e \
            '.status == "verified" and (.selection_id | test("^trial-selection-[0-9a-f]{20}$"))' \
            trial-selection-verification.json >/dev/null
          jq -n \
            --arg schema_version "1.0.0" \
            --arg key "${TRIAL_SELECTION_S3_KEY}" \
            --arg sha256 "sha256:${TRIAL_SELECTION_SHA256}" \
            --arg selection_id "$(jq -r '.selection_id' trial-selection.json)" \
            '{schema_version: $schema_version, artifact_type: "trial_selection_binding",
              selection_id: $selection_id, s3_key: $key, sha256: $sha256,
              split: "validation", trial_count: 3, test_access_count: 0}' \
            > trial-selection-binding.json
          uv run python scripts/validate_release_artifacts.py file \
            --kind trial-selection-verification trial-selection-verification.json
          uv run python scripts/validate_release_artifacts.py file \
            --kind trial-selection-binding trial-selection-binding.json
      - name: Capture the required rollback-safe baseline pointer
        shell: bash
        run: |
          set -euo pipefail
          pointer_key="promoted/current.json"
          aws s3api head-object --bucket "${ARTIFACT_BUCKET}" --key "${pointer_key}" > previous-pointer-head.json
          previous_version_id="$(jq -er '.VersionId | select(type == "string" and length > 0)' previous-pointer-head.json)"
          printf '%s\n' "${previous_version_id}" > previous-pointer-version.txt
          aws s3api get-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${pointer_key}" \
            --version-id "${previous_version_id}" \
            previous-pointer.json >/dev/null
          jq -e --arg baseline "${STRONGEST_BASELINE_ID}" \
            '.model_id == $baseline and
             (.release_id | type == "string" and length > 0) and
             (.bundle_s3_key | startswith("promoted/"))' \
            previous-pointer.json >/dev/null
          uv run python scripts/validate_release_artifacts.py file \
            --kind promotion-pointer previous-pointer.json
      - name: Atomically reserve the signed campaign capacity
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Missing AWS_TERRAFORM_STATE_BUCKET variable}"
          python -m pip install --disable-pip-version-check pydantic==2.13.5 PyYAML==6.0.3
          PYTHONPATH=src python scripts/reserve_financial_capacity.py reserve \
            --bucket "${TF_STATE_BUCKET}" \
            --output financial-capacity-reservation.json
      - name: Run two separately counted clean held-out Processing jobs
        shell: bash
        run: |
          set -euo pipefail
          base_name="${PROJECT_NAME}-${ENVIRONMENT_NAME}-release-${GITHUB_RUN_ID}"
          base_name="${base_name:0:55}"
          shared_prefix="s3://${ARTIFACT_BUCKET}/runs/${base_name}/shared/"
          config_prefix="${shared_prefix}evaluation/"
          candidate_config_prefix="${shared_prefix}candidate-config/"
          baseline_prefix="${shared_prefix}baseline/"
          immutable_readback="$(mktemp -d)"
          trap 'rm -rf -- "${immutable_readback}"' EXIT
          put_immutable_or_verify_identical() {
            local source_file="$1"
            local object_key="$2"
            local content_type="$3"
            local retention_class="$4"
            local local_sha stem existing head put_error
            local_sha="sha256:$(sha256sum "${source_file}" | cut -d' ' -f1)"
            stem="$(printf '%s' "${object_key}" | sha256sum | cut -d' ' -f1)"
            existing="${immutable_readback}/${stem}.object"
            head="${immutable_readback}/${stem}.head.json"
            put_error="${immutable_readback}/${stem}.put-error.txt"
            PYTHONPATH=src uv run python scripts/validate_financial_snapshot.py verify \
              --cost-preflight cost-preflight.json
            if ! aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --body "${source_file}" \
              --content-type "${content_type}" \
              --checksum-algorithm SHA256 \
              --metadata "sha256=${local_sha},retention-class=${retention_class}" \
              --tagging "RetentionClass=${retention_class}" \
              --if-none-match '*' >/dev/null 2>"${put_error}"; then
              : # Retry-safe verification below distinguishes identical from divergent objects.
            fi
            if ! aws s3api get-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --checksum-mode ENABLED \
              "${existing}" >/dev/null 2>&1 \
              || ! cmp -s "${source_file}" "${existing}"; then
              cat "${put_error}" >&2
              echo "Immutable release object differs or cannot be read: ${object_key}" >&2
              return 1
            fi
            aws s3api head-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${object_key}" \
              --checksum-mode ENABLED > "${head}"
            jq -e \
              --arg content_type "${content_type}" \
              --arg sha "${local_sha}" \
              --arg retention "${retention_class}" \
              '.ContentType == $content_type and
               (.ChecksumSHA256 | type == "string" and length > 0) and
               .TagCount == 1 and
               .Metadata == {"retention-class": $retention, sha256: $sha}' \
              "${head}" >/dev/null
          }
          uv run python scripts/validate_release_artifacts.py file \
            --kind command-summary baseline-run-summary.json
          uv run python scripts/validate_release_artifacts.py file \
            --kind baseline-summary baseline-selection.json
          put_immutable_or_verify_identical "${FROZEN_CONFIG_PATH}" \
            "runs/${base_name}/shared/evaluation/release.yaml" application/yaml candidate
          put_immutable_or_verify_identical "${CANDIDATE_CONFIG_PATH}" \
            "runs/${base_name}/shared/candidate-config/frozen-candidate.yaml" \
            application/yaml candidate
          put_immutable_or_verify_identical baseline-run-summary.json \
            "runs/${base_name}/shared/baseline/summary.json" application/json candidate
          put_immutable_or_verify_identical baseline-selection.json \
            "runs/${base_name}/shared/baseline/baseline-summary.json" \
            application/json candidate
          aws s3api list-objects-v2 \
            --bucket "${ARTIFACT_BUCKET}" \
            --prefix "runs/${base_name}/shared/" \
            --no-paginate > shared-input-objects.json
          jq -e --arg prefix "runs/${base_name}/shared/" '
            .IsTruncated != true and
            ([.Contents[].Key] | sort) == ([
              "baseline/baseline-summary.json",
              "baseline/summary.json",
              "candidate-config/frozen-candidate.yaml",
              "evaluation/release.yaml"
            ] | map($prefix + .) | sort)' shared-input-objects.json >/dev/null

          reserve_counter() {
            local expected="$1"
            local clean_run="$2"
            local counter_key="heldout/access-counter.json"
            local reservation_key="runs/${base_name}/reservations/access-counter-clean-${clean_run}.json"
            local previous current_etag
            local write_condition=()
            jq -n \
              --argjson count "${expected}" \
              --argjson clean_run "${clean_run}" \
              --arg run "${CANDIDATE_RUN_ID}" \
              --arg commit "${GITHUB_SHA}" \
              --arg workflow_run "${GITHUB_RUN_ID}" \
              '{schema_version: "1.0.0", artifact_type: "heldout_access_counter",
                count: $count, clean_run: $clean_run, candidate_run_id: $run,
                code_commit: $commit, workflow_run_id: $workflow_run}' \
              > "access-counter-clean-${clean_run}.json"
            uv run python scripts/validate_release_artifacts.py file \
              --kind access-counter "access-counter-clean-${clean_run}.json"

            if aws s3api head-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${reservation_key}" > "reservation-head-${clean_run}.json" \
              2> "reservation-head-${clean_run}.error"; then
              put_immutable_or_verify_identical \
                "access-counter-clean-${clean_run}.json" "${reservation_key}" \
                application/json candidate
              return 0
            elif ! grep -Eq '(404|Not Found|NoSuchKey)' \
              "reservation-head-${clean_run}.error"; then
              cat "reservation-head-${clean_run}.error" >&2
              return 1
            fi

            if aws s3api head-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${counter_key}" > "counter-head-${clean_run}.json" \
              2> "counter-head-${clean_run}.error"; then
              aws s3api get-object \
                --bucket "${ARTIFACT_BUCKET}" \
                --key "${counter_key}" \
                "previous-counter-${clean_run}.json" >/dev/null
              previous="$(jq -er '.count' "previous-counter-${clean_run}.json")"
              current_etag="$(jq -er '.ETag' "counter-head-${clean_run}.json")"
              [[ "${previous}" =~ ^[0-9]+$ ]]
              if [[ "${previous}" -eq "${expected}" ]]; then
                cmp -s "previous-counter-${clean_run}.json" \
                  "access-counter-clean-${clean_run}.json"
                put_immutable_or_verify_identical \
                  "access-counter-clean-${clean_run}.json" "${reservation_key}" \
                  application/json candidate
                return 0
              fi
              test "${expected}" -eq "$((previous + 1))"
              write_condition=(--if-match "${current_etag}")
            elif grep -Eq '(404|Not Found|NoSuchKey)' "counter-head-${clean_run}.error"; then
              test "${expected}" -eq 1
              write_condition=(--if-none-match '*')
            else
              cat "counter-head-${clean_run}.error" >&2
              return 1
            fi

            PYTHONPATH=src uv run python scripts/validate_financial_snapshot.py verify \
              --cost-preflight cost-preflight.json
            if ! aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${counter_key}" \
              --body "access-counter-clean-${clean_run}.json" \
              --content-type application/json \
              --checksum-algorithm SHA256 \
              --metadata "workflow-run-id=${GITHUB_RUN_ID},clean-run=${clean_run}" \
              "${write_condition[@]}" >/dev/null 2> "counter-put-${clean_run}.error"; then
              aws s3api get-object \
                --bucket "${ARTIFACT_BUCKET}" \
                --key "${counter_key}" \
                "counter-after-put-${clean_run}.json" >/dev/null 2>&1 || {
                  cat "counter-put-${clean_run}.error" >&2
                  return 1
                }
              cmp -s "counter-after-put-${clean_run}.json" \
                "access-counter-clean-${clean_run}.json" || {
                  cat "counter-put-${clean_run}.error" >&2
                  echo "Held-out counter advanced to a different reservation." >&2
                  return 1
                }
            fi
            put_immutable_or_verify_identical \
              "access-counter-clean-${clean_run}.json" "${reservation_key}" \
              application/json candidate
          }

          submit_and_wait() {
            local clean_run="$1"
            local counter="$2"
            local job_name="${base_name}-clean-${clean_run}"
            local output_uri="s3://${ARTIFACT_BUCKET}/runs/${job_name}/reports/"
            local image_digest="${EVALUATION_IMAGE_URI##*@}"
            jq -n \
              --arg job "${job_name}" \
              --arg role "${PROCESSING_ROLE_ARN}" \
              --arg image "${EVALUATION_IMAGE_URI}" \
              --arg image_digest "${image_digest}" \
              --arg instance "${INSTANCE_TYPE}" \
              --arg config "${config_prefix}" \
              --arg candidate_config "${candidate_config_prefix}" \
              --arg baseline "${baseline_prefix}" \
              --arg data "${HELDOUT_DATA_S3_URI}" \
              --arg model "${CANDIDATE_ARTIFACT_S3_URI}" \
              --arg output "${output_uri}" \
              --arg candidate_run "${CANDIDATE_RUN_ID}" \
              --arg candidate_model "${CANDIDATE_MODEL_ID}" \
              --arg candidate_hash "${CANDIDATE_CHECKPOINT_SHA256}" \
              --arg candidate_config_hash "${CANDIDATE_CONFIG_SHA256}" \
              --arg config_hash "${FROZEN_CONFIG_SHA256}" \
              --arg dataset_hash "${DATASET_MANIFEST_HASH}" \
              --arg baselines "${BASELINE_IDS}" \
              --arg strongest_baseline "${STRONGEST_BASELINE_ID}" \
              --arg baseline_config_hash "${BASELINE_CONFIG_HASH}" \
              --arg counter "${counter}" \
              --arg clean_run "${clean_run}" \
              --arg commit "${GITHUB_SHA}" \
              --arg region "${AWS_REGION}" \
              --arg project "${PROJECT_NAME}" \
              --arg environment "${ENVIRONMENT_NAME}" \
              --arg owner "${OWNER_ALIAS}" \
              --argjson timeout "${MAX_TIMEOUT_SECONDS}" \
              '{
                ProcessingJobName: $job,
                RoleArn: $role,
                AppSpecification: {
                  ImageUri: $image,
                  ContainerEntrypoint: ["python", "/app/scripts/container_eval.py"],
                  ContainerArguments: [
                    "--config", "/opt/ml/processing/input/config/release.yaml",
                    "--heldout",
                    "--candidate-bundle", "/opt/ml/processing/input/candidate",
                    "--candidate-config", "/opt/ml/processing/input/candidate-config/frozen-candidate.yaml",
                    "--heldout-input", "/opt/ml/processing/input/heldout",
                    "--baseline-summary", "/opt/ml/processing/input/baseline",
                    "--strongest-baseline-id", $strongest_baseline,
                    "--test-access-counter", $counter,
                    "--candidate-checkpoint-sha256", $candidate_hash,
                    "--candidate-config-sha256", $candidate_config_hash,
                    "--dataset-processed-sha256", $dataset_hash
                  ]
                },
                ProcessingResources: {ClusterConfig: {InstanceCount: 1, InstanceType: $instance, VolumeSizeInGB: 30}},
                StoppingCondition: {MaxRuntimeInSeconds: $timeout},
                ProcessingInputs: [
                  {InputName: "config", S3Input: {S3Uri: $config, LocalPath: "/opt/ml/processing/input/config", S3DataType: "S3Prefix", S3InputMode: "File"}},
                  {InputName: "candidate-config", S3Input: {S3Uri: $candidate_config, LocalPath: "/opt/ml/processing/input/candidate-config", S3DataType: "S3Prefix", S3InputMode: "File"}},
                  {InputName: "baseline", S3Input: {S3Uri: $baseline, LocalPath: "/opt/ml/processing/input/baseline", S3DataType: "S3Prefix", S3InputMode: "File"}},
                  {InputName: "heldout", S3Input: {S3Uri: $data, LocalPath: "/opt/ml/processing/input/heldout", S3DataType: "S3Prefix", S3InputMode: "File"}},
                  {InputName: "candidate", S3Input: {S3Uri: $model, LocalPath: "/opt/ml/processing/input/candidate", S3DataType: "S3Prefix", S3InputMode: "File"}}
                ],
                ProcessingOutputConfig: {Outputs: [{OutputName: "reports", S3Output: {S3Uri: $output, LocalPath: "/opt/ml/processing/output", S3UploadMode: "EndOfJob"}}]},
                Environment: {
                  ALLOW_HELDOUT_EVAL: "1",
                  CANDIDATE_RUN_ID: $candidate_run,
                  CANDIDATE_MODEL_ID: $candidate_model,
                  CANDIDATE_CHECKPOINT_SHA256: $candidate_hash,
                  CANDIDATE_CONFIG_SHA256: $candidate_config_hash,
                  FROZEN_CONFIG_SHA256: $config_hash,
                  DATASET_MANIFEST_HASH: $dataset_hash,
                  BASELINE_IDS: $baselines,
                  STRONGEST_BASELINE_ID: $strongest_baseline,
                  VALIDATION_BASELINE_CONFIG_HASH: $baseline_config_hash,
                  TEST_ACCESS_COUNTER: $counter,
                  CLEAN_RUN_ORDINAL: $clean_run,
                  CODE_COMMIT: $commit,
                  SEARCH_RANK_EVALUATION_IMAGE_DIGEST: $image_digest,
                  SEARCH_RANK_HARDWARE_CLASS: $instance,
                  SEARCH_RANK_GIT_SHA: $commit,
                  AWS_REGION: $region
                },
                Tags: [
                  {Key: "Project", Value: $project},
                  {Key: "Environment", Value: $environment},
                  {Key: "Owner", Value: $owner},
                  {Key: "RunId", Value: $job},
                  {Key: "CleanRun", Value: $clean_run},
                  {Key: "HeldoutAccessCounter", Value: $counter}
                ]
              }' > "processing-job-clean-${clean_run}.json"
            if aws sagemaker describe-processing-job \
              --processing-job-name "${job_name}" \
              > "existing-processing-job-clean-${clean_run}.json" \
              2> "existing-processing-job-clean-${clean_run}.error"; then
              jq -e --slurpfile expected "processing-job-clean-${clean_run}.json" '
                .ProcessingJobName == $expected[0].ProcessingJobName and
                .RoleArn == $expected[0].RoleArn and
                .AppSpecification == $expected[0].AppSpecification and
                .ProcessingResources == $expected[0].ProcessingResources and
                .StoppingCondition == $expected[0].StoppingCondition and
                .ProcessingInputs == $expected[0].ProcessingInputs and
                .ProcessingOutputConfig == $expected[0].ProcessingOutputConfig and
                .Environment == $expected[0].Environment' \
                "existing-processing-job-clean-${clean_run}.json" >/dev/null
              local existing_arn existing_status
              existing_arn="$(jq -er '.ProcessingJobArn' \
                "existing-processing-job-clean-${clean_run}.json")"
              aws sagemaker list-tags --resource-arn "${existing_arn}" \
                > "existing-processing-tags-clean-${clean_run}.json"
              jq -e --slurpfile expected "processing-job-clean-${clean_run}.json" '
                (.Tags | sort_by(.Key, .Value)) ==
                ($expected[0].Tags | sort_by(.Key, .Value))' \
                "existing-processing-tags-clean-${clean_run}.json" >/dev/null
              existing_status="$(jq -er '.ProcessingJobStatus' \
                "existing-processing-job-clean-${clean_run}.json")"
              case "${existing_status}" in
                InProgress|Stopping|Completed) ;;
                Failed|Stopped)
                  echo "Existing held-out job ${clean_run} is terminal and unsuccessful: ${existing_status}" >&2
                  return 1
                  ;;
                *) echo "Unexpected Processing status: ${existing_status}" >&2; return 1 ;;
              esac
              PYTHONPATH=src uv run python scripts/validate_financial_snapshot.py verify \
                --cost-preflight cost-preflight.json
              echo "Reusing exact existing held-out Processing job ${job_name}."
            elif grep -Eq 'ValidationException.*(Requested resource not found|Could not find)' \
              "existing-processing-job-clean-${clean_run}.error"; then
              PYTHONPATH=src uv run python scripts/validate_financial_snapshot.py verify \
                --cost-preflight cost-preflight.json
              aws sagemaker create-processing-job \
                --cli-input-json "file://processing-job-clean-${clean_run}.json" >/dev/null
            else
              cat "existing-processing-job-clean-${clean_run}.error" >&2
              return 1
            fi
            printf '%s' "${job_name}" > "job-name-clean-${clean_run}.txt"
            printf '%s' "${output_uri}" > "output-uri-clean-${clean_run}.txt"
            set +e
            aws sagemaker wait processing-job-completed-or-stopped --processing-job-name "${job_name}"
            local waiter_status=$?
            set -e
            aws sagemaker describe-processing-job --processing-job-name "${job_name}" > "processing-job-description-clean-${clean_run}-private.json"
            jq --arg region "${AWS_REGION}" --argjson clean_run "${clean_run}" '{
              schema_version: "1.0.0",
              artifact_type: "heldout_processing_job_evidence",
              processing_job_name: .ProcessingJobName,
              status: .ProcessingJobStatus,
              instance_type: .ProcessingResources.ClusterConfig.InstanceType,
              instance_count: .ProcessingResources.ClusterConfig.InstanceCount,
              creation_time: .CreationTime,
              end_time: .ProcessingEndTime,
              image_digest: (.AppSpecification.ImageUri | split("@") | .[-1]),
              region: $region,
              clean_run: $clean_run,
              exit_message_present: (.ExitMessage != null)
            }' "processing-job-description-clean-${clean_run}-private.json" > "processing-job-evidence-clean-${clean_run}.json"
            local status
            status="$(jq -r '.status' "processing-job-evidence-clean-${clean_run}.json")"
            if [[ "${waiter_status}" -ne 0 || "${status}" != "Completed" ]]; then
              echo "Clean held-out Processing job ${clean_run} did not complete; previous promotion remains unchanged." >&2
              return 1
            fi
          }

          first_counter="${TEST_ACCESS_COUNTER}"
          second_counter="$((TEST_ACCESS_COUNTER + 1))"
          reserve_counter "${first_counter}" 1
          submit_and_wait 1 "${first_counter}"
          reserve_counter "${second_counter}" 2
          submit_and_wait 2 "${second_counter}"
      - name: Verify both clean outputs, bind them, and apply the promotion decision
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          expected_baselines="$(jq -cn --arg value "${BASELINE_IDS}" '$value | split(",") | sort')"
          for clean_run in 1 2; do
            mkdir -p "clean-${clean_run}"
            output_uri="$(cat "output-uri-clean-${clean_run}.txt")"
            for artifact in evaluation-report.json curated-queries.json evaluation-provenance.json command-summary.json; do
              aws s3 cp "${output_uri}${artifact}" "clean-${clean_run}/${artifact}" --no-progress
            done
            counter="$((TEST_ACCESS_COUNTER + clean_run - 1))"
            jq -e \
              --arg candidate "${CANDIDATE_MODEL_ID}" \
              --arg strongest "${STRONGEST_BASELINE_ID}" \
              --argjson counter "${counter}" \
              --argjson baselines "${expected_baselines}" \
              '.split == "test" and .test_access_count == $counter and
               .candidate_model_id == $candidate and
               .primary_metric.strongest_baseline_id == $strongest and
               (.baseline_model_ids | sort) == $baselines and
               .release_gate_results.candidate_model_id == $candidate and
               .release_gate_results.baseline_model_id == $strongest' \
              "clean-${clean_run}/evaluation-report.json" >/dev/null
            jq -e \
              --arg candidate "${CANDIDATE_MODEL_ID}" \
              --arg checkpoint "sha256:${CANDIDATE_CHECKPOINT_SHA256}" \
              --arg config "${CANDIDATE_CONFIG_SHA256}" \
              --arg dataset "${DATASET_MANIFEST_HASH}" \
              --arg split "${SPLIT_MANIFEST_HASH}" \
              --arg evaluation_config "sha256:${FROZEN_CONFIG_SHA256}" \
              --arg image "${EVALUATION_IMAGE_URI##*@}" \
              --arg git "${GITHUB_SHA}" \
              --arg hardware "${INSTANCE_TYPE}" \
              '.command == "evaluate" and .status == "succeeded" and
               .git_sha == $git and .repository_dirty == false and
               .result.candidate_model_id == $candidate and
               .result.checkpoint_checksum == $checkpoint and
               .result.config_hash == $config and
               .result.dataset_manifest_hash == $dataset and
               .result.split_manifest_hash == $split and
               .result.evaluation_config_checksum == $evaluation_config and
               .result.evaluation_image_digest == $image and
               .result.evaluation_git_sha == $git and
               .result.hardware_class == $hardware' \
              "clean-${clean_run}/command-summary.json" >/dev/null
            jq -e \
              --arg candidate_config "${CANDIDATE_CONFIG_SHA256}" \
              --arg evaluation_config "sha256:${FROZEN_CONFIG_SHA256}" \
              --arg checkpoint "sha256:${CANDIDATE_CHECKPOINT_SHA256}" \
              --arg dataset "${DATASET_MANIFEST_HASH}" \
              --arg split "${SPLIT_MANIFEST_HASH}" \
              --arg strongest "${STRONGEST_BASELINE_ID}" \
               --arg baseline_summary "sha256:${BASELINE_SELECTION_SHA256}" \
               --arg image "${EVALUATION_IMAGE_URI##*@}" \
               --arg git "${GITHUB_SHA}" \
               --arg hardware "${INSTANCE_TYPE}" \
               --arg region "${AWS_REGION}" \
               --argjson counter "${counter}" \
              '.split == "test" and .test_access_count == $counter and
               .config_hash == $candidate_config and
               .evaluation_config_checksum == $evaluation_config and
               .checkpoint_checksum == $checkpoint and
                .dataset_manifest_hash == $dataset and
                .split_manifest_hash == $split and
                .strongest_baseline_id == $strongest and
                .validation_baseline_summary_checksum == $baseline_summary and
                .evaluation_image_digest == $image and
                .evaluation_git_sha == $git and .hardware_class == $hardware and
                .region == $region and
               .independent_evaluation_count == 1 and
               (.clean_run_metric_values | length == 1) and
               (.clean_ranking_hashes | length == 1)' \
              "clean-${clean_run}/evaluation-provenance.json" >/dev/null
            for artifact in evaluation_report curated_queries evaluation_provenance; do
              case "${artifact}" in
                evaluation_report) file=evaluation-report.json ;;
                curated_queries) file=curated-queries.json ;;
                evaluation_provenance) file=evaluation-provenance.json ;;
              esac
              expected_hash="$(jq -r --arg name "${artifact}" '.artifact_hashes[$name] // empty' "clean-${clean_run}/command-summary.json")"
              test "${expected_hash}" = "sha256:$(sha256sum "clean-${clean_run}/${file}" | cut -d' ' -f1)"
            done
            jq -e \
              --arg image "${EVALUATION_IMAGE_URI##*@}" \
              --arg hardware "${INSTANCE_TYPE}" \
              '.status == "Completed" and .image_digest == $image and
               .instance_type == $hardware and .instance_count == 1' \
              "processing-job-evidence-clean-${clean_run}.json" >/dev/null
          done

