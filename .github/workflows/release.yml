          PY
          bound_summary="$(cat bound-summary-path.txt)"
          bound_dir="$(dirname "${bound_summary}")"
          cp "${bound_summary}" command-summary.json
          cp "${bound_dir}/evaluation-report.json" evaluation-report.json
          cp "${bound_dir}/evaluation-provenance.json" evaluation-provenance.json
          cp "${bound_dir}/curated-queries.json" curated-queries.json
          second_counter="$((TEST_ACCESS_COUNTER + 1))"
          jq -e \
            --arg candidate "${CANDIDATE_MODEL_ID}" \
            --arg strongest "${STRONGEST_BASELINE_ID}" \
            --argjson counter "${second_counter}" \
            --argjson baselines "${expected_baselines}" \
            '.split == "test" and .test_access_count == $counter and
             .candidate_model_id == $candidate and
             .primary_metric.strongest_baseline_id == $strongest and
             (.baseline_model_ids | sort) == $baselines and
             .release_gate_results.candidate_model_id == $candidate and
             .release_gate_results.baseline_model_id == $strongest and
             ((.release_gate_results.passed == true and
               .release_gate_results.decision == "promote_candidate" and
               .release_gate_results.promoted_model_id == $candidate) or
              (.release_gate_results.passed == false and
               .release_gate_results.decision == "retain_baseline" and
               .release_gate_results.promoted_model_id == $strongest))' \
            evaluation-report.json >/dev/null
          jq -e \
             --arg image "${EVALUATION_IMAGE_URI##*@}" \
             --arg git "${GITHUB_SHA}" \
             --arg hardware "${INSTANCE_TYPE}" \
             --arg region "${AWS_REGION}" \
             --arg split "${SPLIT_MANIFEST_HASH}" \
            --argjson first "${TEST_ACCESS_COUNTER}" \
            --argjson second "${second_counter}" \
             '.independent_evaluation_count == 2 and
              .evaluation_image_digest == $image and .evaluation_git_sha == $git and
              .hardware_class == $hardware and .region == $region and
              .split_manifest_hash == $split and
              .test_access_count == $second and
