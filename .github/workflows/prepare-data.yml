name: Prepare and publish immutable dataset artifacts

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type PUBLISH IMMUTABLE PREPARED DATA after reviewing the S3 allowance
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-data-preparation
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ALLOW_HELDOUT_EVAL: "0"
  CAMPAIGN_BUDGET_USD: "40"
  REQUIRED_CREDIT_RESERVE_USD: "40"
  MAXIMUM_OUT_OF_POCKET_USD: "0"
  DATA_PUBLICATION_ALLOWANCE_USD: "1.00"
  DATA_CONFIG_PATH: configs/data/esci-us-v1.yaml

jobs:
  prepare-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: aws-data
    env:
      AUTHORIZATION: ${{ inputs.authorization }}
      ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      CAMPAIGN_SPEND_TO_DATE_USD: ${{ secrets.AWS_CAMPAIGN_SPEND_TO_DATE_USD }}
      REMAINING_APPLICABLE_CREDIT_USD: ${{ secrets.AWS_REMAINING_APPLICABLE_CREDIT_USD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Enforce authorization and the zero-out-of-pocket boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${AUTHORIZATION}" = "PUBLISH IMMUTABLE PREPARED DATA"
          test "${ALLOW_HELDOUT_EVAL}" = "0"
          test "${AWS_REGION}" = "us-east-1"
          test "${DATA_CONFIG_PATH}" = "configs/data/esci-us-v1.yaml"
          test -f "${DATA_CONFIG_PATH}"
          : "${ARTIFACT_BUCKET:?Missing AWS_ARTIFACT_BUCKET variable}"
          python - <<'PY'
          import os
          from decimal import Decimal, InvalidOperation

          def amount(name: str) -> Decimal:
              try:
                  value = Decimal(os.environ[name])
              except (InvalidOperation, KeyError) as exc:
                  raise SystemExit(f"{name} must be a decimal number") from exc
              if not value.is_finite() or value < 0:
                  raise SystemExit(f"{name} must be finite and non-negative")
              return value

          allowance = amount("DATA_PUBLICATION_ALLOWANCE_USD")
          spent = amount("CAMPAIGN_SPEND_TO_DATE_USD")
          credit = amount("REMAINING_APPLICABLE_CREDIT_USD")
          campaign = amount("CAMPAIGN_BUDGET_USD")
          reserve = amount("REQUIRED_CREDIT_RESERVE_USD")
          if amount("MAXIMUM_OUT_OF_POCKET_USD") != 0:
              raise SystemExit("Owner-approved out-of-pocket limit must be exactly zero")
          if campaign != Decimal("40") or reserve < Decimal("40"):
              raise SystemExit("The approved campaign envelope or applicable-credit reserve changed")
          if allowance != Decimal("1.00"):
              raise SystemExit("The prepared-data S3 allowance must remain exactly USD 1")
          if spent + allowance > campaign:
              raise SystemExit("Prepared-data publication would breach the USD 40 campaign envelope")
          if credit < reserve + allowance:
              raise SystemExit("Applicable credit cannot cover the S3 allowance and required reserve")
          print("Prepared-data publication guard passed with the bounded USD 1 S3 allowance.")
          PY
      - name: Install the locked project environment
        run: uv sync --frozen --all-extras
      - name: Run the pinned preparation command and validate its evidence
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          export SEARCH_RANK_RUN_ROOT="$(pwd)/.data-prepare-command"
          export SEARCH_RANK_LATEST_ROOT="$(pwd)/.data-prepare-latest"
          uv run python -m search_rank.cli data prepare --config "${DATA_CONFIG_PATH}" \
            > "${RUNNER_TEMP}/data-prepare-command.private.log"

          mapfile -t summaries < <(
            find .data-prepare-command -mindepth 2 -maxdepth 2 -type f -name summary.json | sort
          )
          test "${#summaries[@]}" -eq 1
          mkdir -p .data-prepare-evidence .data-prepare-private
          cp "${summaries[0]}" .data-prepare-private/summary.json

          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from search_rank.artifacts.checksums import sha256_file
          from search_rank.config import sha256_value
          from search_rank.data import load_data_config
          from search_rank.schemas.dataset import DatasetManifest

          config_path = Path(os.environ["DATA_CONFIG_PATH"]).resolve()
          config = load_data_config(config_path)
          summary_path = Path(".data-prepare-private/summary.json")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          if summary.get("command") != "data-prepare" or summary.get("status") != "succeeded":
              raise SystemExit("expected exactly one successful data-prepare command summary")
          if summary.get("git_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("data preparation summary is not bound to the workflow commit")
          if summary.get("repository_dirty") is not False:
              raise SystemExit("data preparation must run from a clean checkout")
          if Path(str(summary.get("config_path", ""))).resolve() != config_path:
              raise SystemExit("data preparation summary used a different configuration")

          processed_checksum = str(summary.get("result", {}).get("processed_checksum", ""))
          if (
              len(processed_checksum) != 71
              or not processed_checksum.startswith("sha256:")
              or any(character not in "0123456789abcdef" for character in processed_checksum[7:])
          ):
              raise SystemExit("data preparation emitted no canonical semantic checksum")
          processed_hex = processed_checksum.removeprefix("sha256:")
          processed_dir = (config.processed_dir / processed_hex).resolve()
          manifest_path = processed_dir / "manifest.json"
          if Path(str(summary.get("result", {}).get("dataset_manifest", ""))).resolve() != manifest_path:
              raise SystemExit("command summary manifest path does not match the semantic directory")

          expected_files = {
              "artifact-checksums.json",
              "data-quality.json",
              "development.parquet",
              "manifest.json",
              "test.parquet",
              "train.parquet",
              "validation.parquet",
          }
          actual_files = {
              path.relative_to(processed_dir).as_posix()
              for path in processed_dir.rglob("*")
              if path.is_file()
          }
          if actual_files != expected_files:
              raise SystemExit("prepared directory does not have the exact expected artifact inventory")
          if any(path.is_symlink() for path in processed_dir.rglob("*")):
              raise SystemExit("prepared directory may not contain symbolic links")

          manifest = DatasetManifest.model_validate_json(manifest_path.read_text(encoding="utf-8"))
          if manifest.processed_checksum != processed_checksum:
              raise SystemExit("DatasetManifest semantic identity differs from its content directory")
          if (
              manifest.dataset_name != config.dataset_name
              or manifest.dataset_version != config.dataset_version
              or manifest.source_revision != config.source_revision
              or manifest.locale != config.locale
          ):
              raise SystemExit("DatasetManifest source identity differs from the pinned configuration")
          expected_raw = {
              name: f"sha256:{source.sha256}" for name, source in config.sources.items()
          }
          if manifest.raw_checksums != expected_raw:
              raise SystemExit("DatasetManifest raw checksums differ from the pinned configuration")

          checksum_path = processed_dir / "artifact-checksums.json"
          artifact_checksums = json.loads(checksum_path.read_text(encoding="utf-8"))
          indexed_files = expected_files - {"artifact-checksums.json", "manifest.json"}
          if set(artifact_checksums) != indexed_files:
              raise SystemExit("artifact checksum index does not exactly cover the generated data files")
          for relative in sorted(indexed_files):
              expected = "sha256:" + sha256_file(processed_dir / relative)
              if artifact_checksums.get(relative) != expected:
                  raise SystemExit(f"prepared artifact checksum differs: {relative}")
          recomputed = "sha256:" + sha256_value(
              {
                  "preprocessing_version": manifest.preprocessing_version,
                  "artifacts": {
                      name: value.removeprefix("sha256:")
                      for name, value in artifact_checksums.items()
                  },
              }
          )
          if recomputed != processed_checksum:
              raise SystemExit("semantic processed checksum does not recompute from the artifacts")

          summary_hashes = summary.get("artifact_hashes", {})
          summary_paths = summary.get("artifact_paths", {})
          summary_artifacts = {
              "manifest.json": manifest_path,
              "data-quality.json": processed_dir / "data-quality.json",
              "artifact-checksums.json": checksum_path,
          }
          if set(summary_hashes) != set(summary_artifacts) or set(summary_paths) != set(summary_artifacts):
              raise SystemExit("command summary artifact inventory is not exact")
          for name, path in summary_artifacts.items():
              if Path(str(summary_paths[name])).resolve() != path:
                  raise SystemExit(f"command summary path differs for {name}")
              if summary_hashes[name] != "sha256:" + sha256_file(path):
                  raise SystemExit(f"command summary checksum differs for {name}")
          if summary["result"].get("query_count") != manifest.query_count:
              raise SystemExit("command summary query count differs from the manifest")
          if summary["result"].get("row_count") != manifest.row_count:
              raise SystemExit("command summary row count differs from the manifest")

          evidence_dir = Path(".data-prepare-evidence")
          sanitized_summary = {
              "schema_version": summary["schema_version"],
              "run_id": summary["run_id"],
              "command": summary["command"],
              "status": summary["status"],
              "config_path": os.environ["DATA_CONFIG_PATH"],
              "started_at": summary["started_at"],
              "ended_at": summary["ended_at"],
              "duration_seconds": summary["duration_seconds"],
              "git_sha": summary["git_sha"],
              "repository_dirty": summary["repository_dirty"],
              "runtime": summary["runtime"],
              "artifact_hashes": summary_hashes,
              "result": {
                  "processed_checksum": processed_checksum,
                  "query_count": manifest.query_count,
                  "row_count": manifest.row_count,
                  "product_count": manifest.product_count,
              },
              "failure": None,
          }
          sanitized_summary_path = evidence_dir / "summary.json"
          sanitized_summary_path.write_text(
              json.dumps(sanitized_summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          evidence_manifest_path = evidence_dir / "manifest.json"
          evidence_manifest_path.write_bytes(manifest_path.read_bytes())

          all_hashes = {
              relative: "sha256:" + sha256_file(processed_dir / relative)
              for relative in sorted(expected_files)
          }
          run_id = str(summary["run_id"])
          handoff = {
              "schema_version": "1.0.0",
              "status": "validated_not_published",
              "allow_heldout_eval": False,
              "region": os.environ["AWS_REGION"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "preparation_run_id": run_id,
              "git_sha": os.environ["GITHUB_SHA"],
              "config": {
                  "path": os.environ["DATA_CONFIG_PATH"],
                  "sha256": "sha256:" + sha256_file(config_path),
              },
              "dataset": {
                  "name": manifest.dataset_name,
                  "version": manifest.dataset_version,
                  "source_revision": manifest.source_revision,
                  "locale": manifest.locale,
                  "processed_checksum": processed_checksum,
                  "query_count": manifest.query_count,
                  "row_count": manifest.row_count,
                  "product_count": manifest.product_count,
                  "split_counts": {
                      name: value.model_dump(mode="json")
                      for name, value in manifest.split_counts.items()
                  },
              },
              "processed_s3_key_prefix": f"data/processed/{processed_hex}/",
              "run_evidence_s3_key_prefix": f"runs/data-preparation/{run_id}/",
              "processed_file_sha256": all_hashes,
              "sanitized_summary_sha256": "sha256:" + sha256_file(sanitized_summary_path),
              "run_manifest_transport_sha256": "sha256:" + sha256_file(
                  evidence_manifest_path
              ),
              "cost_guard": {
                  "passed": True,
                  "campaign_envelope_usd": "40",
                  "required_credit_reserve_usd": "40",
                  "maximum_out_of_pocket_usd": "0",
                  "conservative_s3_allowance_usd": "1.00",
                  "private_spend_and_credit_values_withheld": True,
              },
          }
          (evidence_dir / "data-preparation-handoff.json").write_text(
              json.dumps(handoff, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".data-prepare-private/processed-directory.txt").write_text(
              processed_dir.relative_to(Path.cwd()).as_posix(), encoding="utf-8"
          )
          Path(".data-prepare-private/run-id.txt").write_text(run_id, encoding="utf-8")
          Path(".data-prepare-private/processed-checksum.txt").write_text(
              processed_checksum, encoding="utf-8"
          )
          PY

          run_id="$(cat .data-prepare-private/run-id.txt)"
          processed_checksum="$(cat .data-prepare-private/processed-checksum.txt)"
          processed_directory="$(cat .data-prepare-private/processed-directory.txt)"
          [[ "${run_id}" =~ ^data-prepare-[A-Za-z0-9TZ-]+$ ]]
          [[ "${processed_checksum}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${processed_directory}" =~ ^data/processed/esci-us-v1/[0-9a-f]{64}$ ]]
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "processed_checksum=${processed_checksum}" >> "${GITHUB_OUTPUT}"
          echo "processed_directory=${processed_directory}" >> "${GITHUB_OUTPUT}"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-data-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Publish and verify the content-addressed dataset and sanitized handoff
        env:
          PREPARATION_RUN_ID: ${{ steps.prepare.outputs.run_id }}
          PROCESSED_CHECKSUM: ${{ steps.prepare.outputs.processed_checksum }}
          PROCESSED_DIRECTORY: ${{ steps.prepare.outputs.processed_directory }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PREPARATION_RUN_ID}" =~ ^data-prepare-[A-Za-z0-9TZ-]+$ ]]
          [[ "${PROCESSED_CHECKSUM}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${PROCESSED_DIRECTORY}" =~ ^data/processed/esci-us-v1/[0-9a-f]{64}$ ]]
          test -d "${PROCESSED_DIRECTORY}"
          private_dir=".data-prepare-private/aws"
          mkdir -p "${private_dir}"
          processed_hex="${PROCESSED_CHECKSUM#sha256:}"
          processed_prefix="data/processed/${processed_hex}/"
          run_prefix="runs/data-preparation/${PREPARATION_RUN_ID}/"

          checksum_base64() {
            python - "$1" <<'PY'
          import base64
          import hashlib
          import sys

          digest = hashlib.sha256()
          with open(sys.argv[1], "rb") as stream:
              while chunk := stream.read(1024 * 1024):
                  digest.update(chunk)
          print(base64.b64encode(digest.digest()).decode("ascii"))
          PY
          }

          remote_matches() {
            local source="$1"
            local key="$2"
            local expected
            expected="$(checksum_base64 "${source}")"
            if ! aws s3api head-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${key}" \
              --checksum-mode ENABLED \
              > "${private_dir}/head-object.json" 2> "${private_dir}/head-object.err"; then
              return 1
            fi
            local observed
            observed="$(jq -er '.ChecksumSHA256 | select(type == "string" and length > 0)' \
              "${private_dir}/head-object.json")"
            test "${observed}" = "${expected}"
          }

          publish_exact() {
            local source="$1"
            local key="$2"
            local content_type="$3"
            if remote_matches "${source}" "${key}"; then
              return 0
            fi
            set +e
            aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${key}" \
              --body "${source}" \
              --content-type "${content_type}" \
              --checksum-algorithm SHA256 \
              --tagging "RetentionClass=prepared" \
              --if-none-match '*' \
              > "${private_dir}/put-object.json" 2> "${private_dir}/put-object.err"
            local put_status=$?
            set -e
            if [[ "${put_status}" -ne 0 ]] && ! remote_matches "${source}" "${key}"; then
              echo "Immutable publication failed or found different content at key ${key}." >&2
              return 1
            fi
            if ! remote_matches "${source}" "${key}"; then
              echo "Uploaded object failed SHA-256 verification at key ${key}." >&2
              return 1
            fi
          }

          publish_canonical_manifest() {
            local source="$1"
            local key="$2"
            local canonical="${private_dir}/canonical-processed-manifest.json"
            if remote_matches "${source}" "${key}"; then
              cp "${source}" "${canonical}"
              return 0
            fi
            if aws s3api head-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${key}" \
              --checksum-mode ENABLED \
              > "${private_dir}/canonical-manifest-head.json" \
              2> "${private_dir}/canonical-manifest-head.err"; then
              if ! aws s3api get-object \
                --bucket "${ARTIFACT_BUCKET}" \
                --key "${key}" \
                --checksum-mode ENABLED \
                "${canonical}" \
                > "${private_dir}/canonical-manifest-get.json" \
                2> "${private_dir}/canonical-manifest-get.err"; then
                echo "The existing canonical manifest could not be retrieved for verification." >&2
                return 1
              fi
              if ! remote_matches "${canonical}" "${key}"; then
                echo "The existing canonical manifest failed its stored SHA-256 checksum." >&2
                return 1
              fi
              export CURRENT_MANIFEST="${source}"
              export CANONICAL_MANIFEST="${canonical}"
              uv run python - <<'PY'
          import os
          from pathlib import Path

          from search_rank.schemas.dataset import DatasetManifest

          current = DatasetManifest.model_validate_json(
              Path(os.environ["CURRENT_MANIFEST"]).read_text(encoding="utf-8")
          )
          canonical = DatasetManifest.model_validate_json(
              Path(os.environ["CANONICAL_MANIFEST"]).read_text(encoding="utf-8")
          )
          if current.processed_checksum != canonical.processed_checksum:
              raise SystemExit("existing manifest has a different semantic dataset identity")
          current_values = current.model_dump(mode="json")
          canonical_values = canonical.model_dump(mode="json")
          current_values.pop("created_at", None)
          canonical_values.pop("created_at", None)
          if current_values != canonical_values:
              raise SystemExit(
                  "existing manifest differs in fields other than the transport timestamp"
              )
          PY
              return 0
            fi
            publish_exact "${source}" "${key}" application/json
            cp "${source}" "${canonical}"
          }

          mapfile -t processed_files < <(
            find "${PROCESSED_DIRECTORY}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort
          )
          expected_files=(
            artifact-checksums.json
            data-quality.json
            development.parquet
            manifest.json
            test.parquet
            train.parquet
            validation.parquet
          )
          test "${processed_files[*]}" = "${expected_files[*]}"
          for relative in "${processed_files[@]}"; do
            if [[ "${relative}" == "manifest.json" ]]; then
              continue
            fi
            content_type="application/octet-stream"
            if [[ "${relative}" == *.json ]]; then
              content_type="application/json"
            fi
            publish_exact \
              "${PROCESSED_DIRECTORY}/${relative}" \
              "${processed_prefix}${relative}" \
              "${content_type}"
          done
          publish_canonical_manifest \
            "${PROCESSED_DIRECTORY}/manifest.json" \
            "${processed_prefix}manifest.json"

          publish_exact \
            .data-prepare-evidence/summary.json \
            "${run_prefix}summary.json" \
            application/json
          publish_exact \
            .data-prepare-evidence/manifest.json \
            "${run_prefix}manifest.json" \
            application/json

          aws s3api list-objects-v2 \
            --bucket "${ARTIFACT_BUCKET}" \
            --prefix "${processed_prefix}" \
            --query 'Contents[].Key' \
            --output json > "${private_dir}/processed-keys.json"
          aws s3api list-objects-v2 \
            --bucket "${ARTIFACT_BUCKET}" \
            --prefix "${run_prefix}" \
            --query 'Contents[].Key' \
            --output json > "${private_dir}/run-keys-before-handoff.json"
          export PROCESSED_PREFIX="${processed_prefix}"
          export RUN_PREFIX="${run_prefix}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_files = {
              "artifact-checksums.json",
              "data-quality.json",
              "development.parquet",
              "manifest.json",
              "test.parquet",
              "train.parquet",
              "validation.parquet",
          }
          processed = set(
              json.loads(Path(".data-prepare-private/aws/processed-keys.json").read_text())
          )
          expected_processed = {os.environ["PROCESSED_PREFIX"] + name for name in expected_files}
          if processed != expected_processed:
              raise SystemExit("remote processed prefix does not have the exact immutable inventory")
          run_keys = set(
              json.loads(
                  Path(".data-prepare-private/aws/run-keys-before-handoff.json").read_text()
              )
          )
          expected_run = {
              os.environ["RUN_PREFIX"] + "manifest.json",
              os.environ["RUN_PREFIX"] + "summary.json",
          }
          if run_keys != expected_run:
              raise SystemExit("run evidence prefix is not empty and exact before handoff publication")
          PY

          python - <<'PY'
          import hashlib
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          path = Path(".data-prepare-evidence/data-preparation-handoff.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          canonical_manifest = Path(
              ".data-prepare-private/aws/canonical-processed-manifest.json"
          )
          canonical_manifest_sha256 = "sha256:" + hashlib.sha256(
              canonical_manifest.read_bytes()
          ).hexdigest()
          payload["processed_file_sha256"]["manifest.json"] = canonical_manifest_sha256
          payload["canonical_processed_manifest_transport_sha256"] = (
              canonical_manifest_sha256
          )
          payload["canonical_processed_manifest_reused"] = (
              canonical_manifest_sha256 != payload["run_manifest_transport_sha256"]
          )
          payload["status"] = "published"
          payload["published_at"] = datetime.now(UTC).isoformat()
          payload["remote_inventory_verified"] = True
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          publish_exact \
            .data-prepare-evidence/data-preparation-handoff.json \
            "${run_prefix}data-preparation-handoff.json" \
            application/json

          aws s3api list-objects-v2 \
            --bucket "${ARTIFACT_BUCKET}" \
            --prefix "${run_prefix}" \
            --query 'Contents[].Key' \
            --output json > "${private_dir}/run-keys.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          actual = set(json.loads(Path(".data-prepare-private/aws/run-keys.json").read_text()))
          expected = {
              os.environ["RUN_PREFIX"] + "data-preparation-handoff.json",
              os.environ["RUN_PREFIX"] + "manifest.json",
              os.environ["RUN_PREFIX"] + "summary.json",
          }
          if actual != expected:
              raise SystemExit("sanitized run evidence prefix does not have the exact inventory")
          PY
          echo "processed_checksum=${PROCESSED_CHECKSUM}" >> "${GITHUB_OUTPUT}"
          echo "processed_s3_key_prefix=${processed_prefix}" >> "${GITHUB_OUTPUT}"
          echo "run_evidence_s3_key_prefix=${run_prefix}" >> "${GITHUB_OUTPUT}"
          {
            echo "Prepared dataset ${PROCESSED_CHECKSUM} was published and SHA-256 verified."
            echo "Immutable processed key prefix: \`${processed_prefix}\`"
            echo "Sanitized handoff key prefix: \`${run_prefix}\`"
            echo "No held-out evaluation or model-selection command was enabled."
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: data-preparation-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: .data-prepare-evidence/
          if-no-files-found: warn
          retention-days: 90
