name: Publish the validation-only baseline release

on:
  workflow_dispatch:
    inputs:
      baseline_command_summary_s3_key:
        description: Immutable runs/.../summary.json key from a successful validation baseline run
        required: true
        type: string
      baseline_command_summary_sha256:
        description: SHA-256 hex digest of the command summary object
        required: true
        type: string
      baseline_summary_s3_key:
        description: Immutable runs/.../baseline-summary.json key bound by the command summary
        required: true
        type: string
      baseline_summary_sha256:
        description: SHA-256 hex digest of the baseline summary object
        required: true
        type: string
      dataset_manifest_s3_key:
        description: Immutable runs/.../manifest.json evidence copy; no prepared split objects are read
        required: true
        type: string
      dataset_manifest_sha256:
        description: SHA-256 hex digest of the transported manifest object
        required: true
        type: string
      dataset_processed_sha256:
        description: Semantic DatasetManifest.processed_checksum in sha256:... form
        required: true
        type: string
      curated_queries_s3_key:
        description: Immutable runs/.../curated-queries.json key produced from validation data
        required: true
        type: string
      curated_queries_sha256:
        description: SHA-256 hex digest of the curated-query object
        required: true
        type: string
      baseline_config_path:
        description: Committed baseline configuration used by the successful run
        required: true
        default: configs/experiments/baselines-v1.yaml
        type: string
      baseline_config_file_sha256:
        description: SHA-256 hex digest of the committed baseline YAML bytes
        required: true
        type: string
      strongest_baseline_id:
        description: Validation-selected unchanged model expected to become the initial pointer
        required: true
        type: string
      evidence_image_digest:
        description: Immutable evaluation/serving image digest in sha256:... form
        required: true
        type: string
      hardware_class:
        description: Hardware class that produced the validation evidence
        required: true
        default: github-hosted-ubuntu-x86_64
        type: string
      authorization:
        description: Type PUBLISH VALIDATION BASELINE after reviewing the immutable inputs
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: baseline-release-bootstrap
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ALLOW_HELDOUT_EVAL: "0"
  CAMPAIGN_BUDGET_USD: "40"
  REQUIRED_CREDIT_RESERVE_USD: "40"
  MAXIMUM_OUT_OF_POCKET_USD: "0"
  BASELINE_PUBLICATION_ALLOWANCE_USD: "0.50"

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: baseline-release
    env:
      AUTHORIZATION: ${{ inputs.authorization }}
      BASELINE_COMMAND_SUMMARY_S3_KEY: ${{ inputs.baseline_command_summary_s3_key }}
      BASELINE_COMMAND_SUMMARY_SHA256: ${{ inputs.baseline_command_summary_sha256 }}
      BASELINE_SUMMARY_S3_KEY: ${{ inputs.baseline_summary_s3_key }}
      BASELINE_SUMMARY_SHA256: ${{ inputs.baseline_summary_sha256 }}
      DATASET_MANIFEST_S3_KEY: ${{ inputs.dataset_manifest_s3_key }}
      DATASET_MANIFEST_SHA256: ${{ inputs.dataset_manifest_sha256 }}
      DATASET_PROCESSED_SHA256: ${{ inputs.dataset_processed_sha256 }}
      CURATED_QUERIES_S3_KEY: ${{ inputs.curated_queries_s3_key }}
      CURATED_QUERIES_SHA256: ${{ inputs.curated_queries_sha256 }}
      BASELINE_CONFIG_PATH: ${{ inputs.baseline_config_path }}
      BASELINE_CONFIG_FILE_SHA256: ${{ inputs.baseline_config_file_sha256 }}
      STRONGEST_BASELINE_ID: ${{ inputs.strongest_baseline_id }}
      EVIDENCE_IMAGE_DIGEST: ${{ inputs.evidence_image_digest }}
      HARDWARE_CLASS: ${{ inputs.hardware_class }}
      ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      EVAL_REPOSITORY: ${{ vars.AWS_EVAL_ECR_REPOSITORY_URL }}
      CAMPAIGN_SPEND_TO_DATE_USD: ${{ secrets.AWS_CAMPAIGN_SPEND_TO_DATE_USD }}
      REMAINING_APPLICABLE_CREDIT_USD: ${{ secrets.AWS_REMAINING_APPLICABLE_CREDIT_USD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Validate the non-held-out immutable inputs and cost boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${AUTHORIZATION}" = "PUBLISH VALIDATION BASELINE"
          test "${ALLOW_HELDOUT_EVAL}" = "0"
          [[ "${BASELINE_COMMAND_SUMMARY_S3_KEY}" =~ ^runs/[A-Za-z0-9._/-]+/summary\.json$ ]]
          [[ "${BASELINE_SUMMARY_S3_KEY}" =~ ^runs/[A-Za-z0-9._/-]+/baseline-summary\.json$ ]]
          [[ "${DATASET_MANIFEST_S3_KEY}" =~ ^runs/[A-Za-z0-9._/-]+/manifest\.json$ ]]
          [[ "${CURATED_QUERIES_S3_KEY}" =~ ^runs/[A-Za-z0-9._/-]+/curated-queries\.json$ ]]
          for key in \
            "${BASELINE_COMMAND_SUMMARY_S3_KEY}" \
            "${BASELINE_SUMMARY_S3_KEY}" \
            "${DATASET_MANIFEST_S3_KEY}" \
            "${CURATED_QUERIES_S3_KEY}"; do
            [[ "${key}" != *".."* ]]
          done
          for digest in \
            "${BASELINE_COMMAND_SUMMARY_SHA256}" \
            "${BASELINE_SUMMARY_SHA256}" \
            "${DATASET_MANIFEST_SHA256}" \
            "${CURATED_QUERIES_SHA256}" \
            "${BASELINE_CONFIG_FILE_SHA256}"; do
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
          done
          [[ "${DATASET_PROCESSED_SHA256}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${EVIDENCE_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${STRONGEST_BASELINE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]{2,99}$ ]]
          test "${HARDWARE_CLASS}" = "github-hosted-ubuntu-x86_64"
          [[ "${EVAL_REPOSITORY}" =~ ^[0-9]{12}\.dkr\.ecr\.us-east-1\.amazonaws\.com/[a-z0-9/_-]+$ ]]
          [[ "${BASELINE_CONFIG_PATH}" =~ ^configs/experiments/[A-Za-z0-9._/-]+\.ya?ml$ ]]
          [[ "${BASELINE_CONFIG_PATH}" != *".."* ]]
          test -f "${BASELINE_CONFIG_PATH}"
          test "$(sha256sum "${BASELINE_CONFIG_PATH}" | cut -d' ' -f1)" = \
            "${BASELINE_CONFIG_FILE_SHA256}"
          : "${ARTIFACT_BUCKET:?Missing AWS_ARTIFACT_BUCKET variable}"
          python - <<'PY'
          import os
          from decimal import Decimal, InvalidOperation

          def amount(name: str) -> Decimal:
              try:
                  value = Decimal(os.environ[name])
              except (InvalidOperation, KeyError) as exc:
                  raise SystemExit(f"{name} must be a decimal number") from exc
              if not value.is_finite() or value < 0:
                  raise SystemExit(f"{name} must be finite and non-negative")
              return value

          allowance = amount("BASELINE_PUBLICATION_ALLOWANCE_USD")
          spent = amount("CAMPAIGN_SPEND_TO_DATE_USD")
          credit = amount("REMAINING_APPLICABLE_CREDIT_USD")
          campaign = amount("CAMPAIGN_BUDGET_USD")
          reserve = amount("REQUIRED_CREDIT_RESERVE_USD")
          if amount("MAXIMUM_OUT_OF_POCKET_USD") != 0:
              raise SystemExit("Owner-approved out-of-pocket limit must be exactly zero")
          if campaign != Decimal("40") or reserve < Decimal("40"):
              raise SystemExit("Campaign and applicable-credit reserve policy changed")
          if spent + allowance > campaign:
              raise SystemExit("Baseline publication allowance would breach the campaign envelope")
          if credit < allowance + reserve:
              raise SystemExit("Applicable credit cannot cover baseline publication and reserve")
          PY
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-baseline-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Bind validation evidence to the reviewed image and commit
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${EVAL_REPOSITORY#*/}"
          tagged_digest="$(aws ecr describe-images \
            --repository-name "${repository_name}" \
            --image-ids "imageTag=sha-${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "${tagged_digest}" = "${EVIDENCE_IMAGE_DIGEST}"
      - name: Download and checksum-verify validation evidence only
        shell: bash
        run: |
          set -euo pipefail
          mkdir baseline-input
          aws s3 cp "s3://${ARTIFACT_BUCKET}/${BASELINE_COMMAND_SUMMARY_S3_KEY}" \
            baseline-input/summary.json --no-progress
          aws s3 cp "s3://${ARTIFACT_BUCKET}/${BASELINE_SUMMARY_S3_KEY}" \
            baseline-input/baseline-summary.json --no-progress
          aws s3 cp "s3://${ARTIFACT_BUCKET}/${DATASET_MANIFEST_S3_KEY}" \
            baseline-input/manifest.json --no-progress
          aws s3 cp "s3://${ARTIFACT_BUCKET}/${CURATED_QUERIES_S3_KEY}" \
            baseline-input/curated-queries.json --no-progress
          test "$(sha256sum baseline-input/summary.json | cut -d' ' -f1)" = \
            "${BASELINE_COMMAND_SUMMARY_SHA256}"
          test "$(sha256sum baseline-input/baseline-summary.json | cut -d' ' -f1)" = \
            "${BASELINE_SUMMARY_SHA256}"
          test "$(sha256sum baseline-input/manifest.json | cut -d' ' -f1)" = \
            "${DATASET_MANIFEST_SHA256}"
          test "$(sha256sum baseline-input/curated-queries.json | cut -d' ' -f1)" = \
            "${CURATED_QUERIES_SHA256}"
          jq -e \
            --arg strongest "${STRONGEST_BASELINE_ID}" \
            --arg summary_hash "sha256:${BASELINE_SUMMARY_SHA256}" \
            --arg curated_hash "sha256:${CURATED_QUERIES_SHA256}" \
            --arg git "${GITHUB_SHA}" \
            '.command == "baseline-run" and .status == "succeeded" and
             (.run_id | type == "string" and length > 0) and
             .git_sha == $git and .repository_dirty == false and
             (.runtime.platform | startswith("Linux")) and
             .result.strongest_baseline_id == $strongest and
             .artifact_hashes.baseline_summary == $summary_hash and
             .artifact_hashes.curated_queries == $curated_hash' \
            baseline-input/summary.json >/dev/null
          jq -e \
            --arg strongest "${STRONGEST_BASELINE_ID}" \
            --arg dataset "${DATASET_PROCESSED_SHA256}" \
            '.split == "validation" and .strongest_baseline_id == $strongest and
             .dataset_manifest_hash == $dataset and
             (.system_metrics[$strongest]["graded_ndcg@10"] | type == "number") and
             (.system_metric_query_counts[$strongest]["graded_ndcg@10"] | type == "number") and
             (.p95_inference_latency_ms[$strongest] | type == "number") and
             ([.system_metrics | keys[] | select(startswith("candidate-"))] | length == 0)' \
            baseline-input/baseline-summary.json >/dev/null
          jq -e --arg dataset "${DATASET_PROCESSED_SHA256}" \
            '.processed_checksum == $dataset and .dataset_name == "amazon-shopping-queries-esci" and
             (.split_counts.validation.query_count | type == "number")' \
            baseline-input/manifest.json >/dev/null
          jq -e \
            '.schema_version == "1.0.0" and (.queries | type == "array") and
             ([.queries[].products | length]) as $counts |
             (($counts | index(10)) != null and
              ($counts | index(20)) != null and
              ($counts | index(40)) != null) and
             all(.queries[];
               (.query_id | type == "string" and length > 0) and
               (.products | type == "array" and length >= 1 and length <= 40))' \
            baseline-input/curated-queries.json >/dev/null
      - name: Build and verify the typed validation-only bundle
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          baseline_git_sha="$(jq -r '.git_sha' baseline-input/summary.json)"
          export SEARCH_RANK_RUN_ROOT="$(pwd)/baseline-bootstrap-command"
          uv run python -m search_rank.cli bootstrap-baseline-release \
            --baseline-summary baseline-input/summary.json \
            --baseline-config "${BASELINE_CONFIG_PATH}" \
            --dataset-manifest baseline-input/manifest.json \
            --curated-queries baseline-input/curated-queries.json \
            --output-dir .baseline-release \
            --image-digest "${EVIDENCE_IMAGE_DIGEST}" \
            --git-sha "${baseline_git_sha}" \
            --hardware-class "${HARDWARE_CLASS}" \
            --region "${AWS_REGION}"
          summary_count="$(find baseline-bootstrap-command -mindepth 2 -maxdepth 2 -name summary.json | wc -l)"
          test "${summary_count}" -eq 1
          cp "$(find baseline-bootstrap-command -mindepth 2 -maxdepth 2 -name summary.json)" \
            baseline-bootstrap-summary.json
          test -f .baseline-release/release-manifest.json
          test -f .baseline-release/public-evidence.json
          test -f .baseline-release/baseline-summary.json
          test -f .baseline-release/curated-queries.json
          test -f .baseline-release/bundle-checksums.json
          test ! -e .baseline-release/evaluation-report.json
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from search_rank.artifacts.checksums import sha256_file
          from search_rank.schemas.api import PublicEvidenceEnvelope

          root = Path(".baseline-release").resolve()
          manifest = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          evidence = PublicEvidenceEnvelope.model_validate_json(
              (root / "public-evidence.json").read_text(encoding="utf-8")
          )
          if evidence.evidence_mode != "validation_only":
              raise SystemExit("baseline public evidence must be explicitly validation-only")
          if manifest.get("evidence_mode") != "validation_only":
              raise SystemExit("baseline release manifest must be explicitly validation-only")
          if evidence.run.test_access_count != 0 or evidence.evaluation.test_access_count != 0:
              raise SystemExit("baseline public evidence must record zero test access")
          if evidence.evaluation.held_out is not False:
              raise SystemExit("baseline evidence cannot claim held-out evaluation")
          if evidence.evaluation.selected_model_id != os.environ["STRONGEST_BASELINE_ID"]:
              raise SystemExit("public evidence selected a different baseline")
          if manifest.get("promoted_model_id") != os.environ["STRONGEST_BASELINE_ID"]:
              raise SystemExit("release manifest selected a different baseline")
          if manifest.get("dataset_manifest_hash") != os.environ["DATASET_PROCESSED_SHA256"]:
              raise SystemExit("release manifest dataset identity changed")
          if any(model.get("kind") == "fine_tuned" for model in manifest.get("models", [])):
              raise SystemExit("validation-only bundle unexpectedly contains a fine-tuned model")
          if len(manifest.get("models", [])) < 2:
              raise SystemExit("baseline release must contain the competitive unchanged systems")

          actual = {
              path.relative_to(root).as_posix(): "sha256:" + sha256_file(path)
              for path in sorted(root.rglob("*"))
              if path.is_file() and path.name != "bundle-checksums.json"
          }
          inventory = json.loads((root / "bundle-checksums.json").read_text(encoding="utf-8"))
          if inventory != {"schema_version": "1.0.0", "files": actual}:
              raise SystemExit("bundle checksum inventory is not exact")
          required = {"baseline-summary.json", "curated-queries.json", "public-evidence.json"}
          bound = manifest.get("artifact_checksums")
          if not isinstance(bound, dict) or not required <= bound.keys():
              raise SystemExit("release manifest is missing public evidence checksums")
          for relative in required:
              if bound[relative] != actual[relative]:
                  raise SystemExit(f"release manifest checksum differs for {relative}")
          PY
          jq -e \
            --arg selected "${STRONGEST_BASELINE_ID}" \
            '.command == "bootstrap-baseline-release" and .status == "succeeded" and
             .result.promoted_model_id == $selected and .result.evidence_mode == "validation_only" and
             .result.test_access_count == 0' baseline-bootstrap-summary.json >/dev/null
      - name: Publish the immutable baseline bundle and create the initial pointer
        shell: bash
        run: |
          set -euo pipefail
          if aws s3api head-object --bucket "${ARTIFACT_BUCKET}" --key promoted/current.json \
            > existing-pointer-private.json 2>/dev/null; then
            echo "The initial promotion pointer already exists; refusing baseline bootstrap." >&2
            exit 1
          fi
          release_id="$(jq -r '.release_id' .baseline-release/release-manifest.json)"
          promoted_model="$(jq -r '.promoted_model_id' .baseline-release/release-manifest.json)"
          evidence_id="$(jq -r '.evaluation_report_id' .baseline-release/release-manifest.json)"
          baseline_git_sha="$(jq -r '.git_sha' baseline-input/summary.json)"
          test "${promoted_model}" = "${STRONGEST_BASELINE_ID}"
          [[ "${release_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,99}$ ]]
          [[ "${evidence_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,199}$ ]]
          prefix="promoted/${promoted_model}/"
          existing="$(aws s3api list-objects-v2 --bucket "${ARTIFACT_BUCKET}" \
            --prefix "${prefix}" --max-keys 1 --query 'KeyCount' --output text)"
          test "${existing}" = "0"
          while IFS= read -r -d '' file; do
            relative="${file#.baseline-release/}"
            aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${prefix}${relative}" \
              --body "${file}" \
              --checksum-algorithm SHA256 \
              --tagging "RetentionClass=promoted" \
              --if-none-match '*' >/dev/null
          done < <(find .baseline-release -type f -print0 | sort -z)
          jq -n \
            --arg release "${release_id}" \
            --arg model "${promoted_model}" \
            --arg bundle_key "${prefix}" \
            --arg evidence "${evidence_id}" \
            --arg commit "${baseline_git_sha}" \
            '{schema_version: "1.0.0", release_id: $release, model_id: $model,
              bundle_s3_key: $bundle_key, evaluation_report_id: $evidence, git_sha: $commit,
              evidence_mode: "validation_only", previous: null}' > baseline-promotion-pointer.json
          aws s3api put-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key promoted/current.json \
            --body baseline-promotion-pointer.json \
            --content-type application/json \
            --checksum-algorithm SHA256 \
            --tagging "RetentionClass=promoted" \
            --if-none-match '*' > baseline-promotion-put-result.private.json
          jq '{schema_version: "1.0.0", status: "published",
            version_id_present: (.VersionId != null), etag_present: (.ETag != null)}' \
            baseline-promotion-put-result.private.json > baseline-publication-evidence.json
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"
          echo "model_id=${promoted_model}" >> "${GITHUB_OUTPUT}"
          echo "Validation-only baseline bundle and initial versioned pointer were published." \
            >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: baseline-publication-evidence-${{ github.run_id }}
          path: |
            .baseline-release/baseline-summary.json
            .baseline-release/bundle-checksums.json
            .baseline-release/public-evidence.json
            .baseline-release/release-manifest.json
            baseline-bootstrap-summary.json
            baseline-promotion-pointer.json
            baseline-publication-evidence.json
          if-no-files-found: warn
          retention-days: 90
