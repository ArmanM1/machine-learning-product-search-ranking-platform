name: Run validation-only competitive baselines

on:
  workflow_dispatch:
    inputs:
      prepared_data_s3_prefix:
        description: Immutable data/processed/<semantic-hash> prefix produced by prepare-data.yml
        required: true
        type: string
      dataset_processed_sha256:
        description: DatasetManifest.processed_checksum in sha256:... form
        required: true
        type: string
      baseline_config_path:
        description: Committed validation baseline configuration
        required: true
        default: configs/experiments/baselines-v1.yaml
        type: string
      baseline_config_file_sha256:
        description: SHA-256 hex digest of the committed baseline YAML bytes
        required: true
        type: string
      authorization:
        description: Type RUN VALIDATION BASELINES after reviewing the bounded inputs
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-financial-operations
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ALLOW_HELDOUT_EVAL: "0"
  CAMPAIGN_BUDGET_USD: "40"
  REQUIRED_CREDIT_RESERVE_USD: "40"
  MAXIMUM_OUT_OF_POCKET_USD: "0"
  BASELINE_RUN_ALLOWANCE_USD: "0.50"

jobs:
  baseline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: aws-baseline
    env:
      PREPARED_DATA_S3_PREFIX: ${{ inputs.prepared_data_s3_prefix }}
      DATASET_PROCESSED_SHA256: ${{ inputs.dataset_processed_sha256 }}
      BASELINE_CONFIG_PATH: ${{ inputs.baseline_config_path }}
      BASELINE_CONFIG_FILE_SHA256: ${{ inputs.baseline_config_file_sha256 }}
      AUTHORIZATION: ${{ inputs.authorization }}
      ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      CAMPAIGN_SPEND_TO_DATE_USD: ${{ secrets.AWS_CAMPAIGN_SPEND_TO_DATE_USD }}
      REMAINING_APPLICABLE_CREDIT_USD: ${{ secrets.AWS_REMAINING_APPLICABLE_CREDIT_USD }}
      FINANCIAL_SNAPSHOT_OBSERVED_AT: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_OBSERVED_AT }}
      FINANCIAL_SNAPSHOT_RECEIPT_SHA256: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_RECEIPT_SHA256 }}
      FINANCIAL_SNAPSHOT_HMAC_KEY: ${{ secrets.AWS_FINANCIAL_SNAPSHOT_HMAC_KEY }}
      FINANCIAL_RESERVATION_MAX_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_MAX_USD }}
      FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD: ${{ secrets.AWS_FINANCIAL_RESERVATION_REMAINING_COMMITTED_USD }}
      FINANCIAL_RESERVATION_CPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_CPU_HOURS }}
      FINANCIAL_RESERVATION_GPU_HOURS: ${{ secrets.AWS_FINANCIAL_RESERVATION_GPU_HOURS }}
      FINANCIAL_CPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_CPU_HOURS_USED_TO_DATE }}
      FINANCIAL_GPU_HOURS_USED_TO_DATE: ${{ secrets.AWS_FINANCIAL_GPU_HOURS_USED_TO_DATE }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_WORKFLOW: baseline
      FINANCIAL_SNAPSHOT_AUTHORIZATION_INPUTS_JSON: ${{ toJSON(inputs) }}
      FINANCIAL_SNAPSHOT_AUTHORIZATION_COMMIT_SHA: ${{ github.sha }}
      FINANCIAL_SNAPSHOT_SOURCE: "aws_billing_and_cost_management_console"
      FINANCIAL_SNAPSHOT_MAX_AGE_SECONDS: "21600"
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Validate authorization, immutable inputs, and zero-spend boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${AUTHORIZATION}" = "RUN VALIDATION BASELINES"
          test "${ALLOW_HELDOUT_EVAL}" = "0"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          [[ "${PREPARED_DATA_S3_PREFIX}" =~ ^data/processed/[0-9a-f]{64}/?$ ]]
          [[ "${DATASET_PROCESSED_SHA256}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${PREPARED_DATA_S3_PREFIX%/}" = \
            "data/processed/${DATASET_PROCESSED_SHA256#sha256:}"
          [[ "${BASELINE_CONFIG_PATH}" =~ ^configs/experiments/[A-Za-z0-9._/-]+\.ya?ml$ ]]
          [[ "${BASELINE_CONFIG_PATH}" != *".."* ]]
          [[ "${BASELINE_CONFIG_FILE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test -f "${BASELINE_CONFIG_PATH}"
          test "$(sha256sum "${BASELINE_CONFIG_PATH}" | cut -d' ' -f1)" = \
            "${BASELINE_CONFIG_FILE_SHA256}"
          : "${ARTIFACT_BUCKET:?Missing AWS_ARTIFACT_BUCKET variable}"
          python - <<'PY'
          import os
          from decimal import Decimal, InvalidOperation

          def amount(name: str) -> Decimal:
              try:
                  value = Decimal(os.environ[name])
              except (InvalidOperation, KeyError) as exc:
                  raise SystemExit(f"{name} must be a decimal number") from exc
              if not value.is_finite() or value < 0:
                  raise SystemExit(f"{name} must be finite and non-negative")
              return value

          allowance = amount("BASELINE_RUN_ALLOWANCE_USD")
          spent = amount("CAMPAIGN_SPEND_TO_DATE_USD")
          credit = amount("REMAINING_APPLICABLE_CREDIT_USD")
          if amount("MAXIMUM_OUT_OF_POCKET_USD") != 0:
              raise SystemExit("Owner-approved out-of-pocket limit must remain zero")
          if spent + allowance > amount("CAMPAIGN_BUDGET_USD"):
              raise SystemExit("Baseline evidence I/O would breach the campaign envelope")
          if credit < allowance + amount("REQUIRED_CREDIT_RESERVE_USD"):
              raise SystemExit("Applicable credit cannot cover baseline I/O and reserve")
          PY
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_BASELINE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-baselines-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Atomically reserve the signed campaign capacity
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Missing AWS_TERRAFORM_STATE_BUCKET variable}"
          python -m pip install --disable-pip-version-check pydantic==2.13.5
          PYTHONPATH=src python scripts/reserve_financial_capacity.py reserve \
            --bucket "${TF_STATE_BUCKET}" \
            --output financial-capacity-reservation.json
      - name: Stage validation data without the held-out object
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras
          processed_hex="${DATASET_PROCESSED_SHA256#sha256:}"
          local_root="data/processed/esci-us-v1/${processed_hex}"
          mkdir -p "${local_root}"
          for artifact in manifest.json artifact-checksums.json validation.parquet; do
            aws s3 cp \
              "s3://${ARTIFACT_BUCKET}/${PREPARED_DATA_S3_PREFIX%/}/${artifact}" \
              "${local_root}/${artifact}" \
              --no-progress
          done
          test ! -e "${local_root}/test.parquet"
          jq -n \
            --arg manifest "${processed_hex}/manifest.json" \
            --arg checksum "${DATASET_PROCESSED_SHA256}" \
            '{manifest: $manifest, processed_checksum: $checksum}' \
            > data/processed/esci-us-v1/current.json
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from search_rank.artifacts.checksums import sha256_file
          from search_rank.data.io import load_dataset_manifest

          pointer = Path("data/processed/esci-us-v1/current.json")
          manifest, path = load_dataset_manifest(pointer)
          if manifest.processed_checksum != os.environ["DATASET_PROCESSED_SHA256"]:
              raise SystemExit("staged manifest semantic identity differs from the dispatch")
          checksums = json.loads((path.parent / "artifact-checksums.json").read_text())
          expected = checksums.get("validation.parquet")
          if expected != "sha256:" + sha256_file(path.parent / "validation.parquet"):
              raise SystemExit("staged validation object differs from its checksum index")
          if (path.parent / "test.parquet").exists():
              raise SystemExit("held-out data must not enter the baseline runner")
          PY
      - name: Run and validate the unchanged competitive baselines
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_RANK_RUN_ROOT="$(pwd)/baseline-command"
          export SEARCH_RANK_RUN_ROOT
          marker="$(mktemp)"
          SEARCH_RANK_GIT_SHA="${GITHUB_SHA}" \
            uv run python -m search_rank.cli baseline run --config "${BASELINE_CONFIG_PATH}"
          export BASELINE_MARKER="${marker}"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = Path(os.environ["BASELINE_MARKER"])
          matches = []
          for path in Path("baseline-command").glob("*/summary.json"):
              payload = json.loads(path.read_text(encoding="utf-8"))
              if path.stat().st_mtime_ns >= marker.stat().st_mtime_ns and payload.get("command") == "baseline-run":
                  matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f"expected one baseline command summary, found {len(matches)}")
          Path("baseline-summary-path.txt").write_text(str(matches[0]), encoding="utf-8")
          PY
          command_summary="$(cat baseline-summary-path.txt)"
          run_dir="$(dirname "${command_summary}")"
          cp "${command_summary}" baseline-command-summary.json
          cp "${run_dir}/baseline-summary.json" baseline-summary.json
          cp "${run_dir}/curated-queries.json" curated-queries.json
          jq -e \
            --arg dataset "${DATASET_PROCESSED_SHA256}" \
            '.command == "baseline-run" and .status == "succeeded" and
             .result.dataset_checksum == $dataset and
             (.git_sha | test("^[0-9a-f]{40}$")) and .repository_dirty == false and
             (.artifact_hashes.baseline_summary | test("^sha256:[0-9a-f]{64}$")) and
             (.artifact_hashes.curated_queries | test("^sha256:[0-9a-f]{64}$"))' \
            baseline-command-summary.json >/dev/null
          test "$(jq -r '.artifact_hashes.baseline_summary' baseline-command-summary.json)" = \
            "sha256:$(sha256sum baseline-summary.json | cut -d' ' -f1)"
          test "$(jq -r '.artifact_hashes.curated_queries' baseline-command-summary.json)" = \
            "sha256:$(sha256sum curated-queries.json | cut -d' ' -f1)"
          jq -e --arg dataset "${DATASET_PROCESSED_SHA256}" \
            '.split == "validation" and .dataset_manifest_hash == $dataset and
             (.strongest_baseline_id | type == "string" and length > 0) and
             (.metrics | type == "object" and length >= 2) and
             ([.metrics | keys[] | select(startswith("candidate-"))] | length == 0)' \
            baseline-summary.json >/dev/null
          jq -e \
            '.schema_version == "1.0.0" and (.queries | type == "array") and
             ([.queries[].products | length]) as $counts |
             (($counts | index(10)) != null and ($counts | index(20)) != null and
              ($counts | index(40)) != null)' curated-queries.json >/dev/null
      - name: Publish immutable validation evidence and bootstrap handoff
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(jq -r '.run_id' baseline-command-summary.json)"
          strongest="$(jq -r '.strongest_baseline_id' baseline-summary.json)"
          [[ "${run_id}" =~ ^baseline-run-[A-Za-z0-9TZ-]+$ ]]
          [[ "${strongest}" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]{2,99}$ ]]
          manifest_path="data/processed/esci-us-v1/${DATASET_PROCESSED_SHA256#sha256:}/manifest.json"
          prefix="runs/${run_id}/"
          for mapping in \
            "baseline-command-summary.json:summary.json" \
            "baseline-summary.json:baseline-summary.json" \
            "curated-queries.json:curated-queries.json" \
            "${manifest_path}:manifest.json"; do
            local_file="${mapping%%:*}"
            remote_name="${mapping#*:}"
            PYTHONPATH=src uv run python scripts/validate_financial_snapshot.py emit \
              --output /dev/null
            aws s3api put-object \
              --bucket "${ARTIFACT_BUCKET}" \
              --key "${prefix}${remote_name}" \
              --body "${local_file}" \
              --checksum-algorithm SHA256 \
              --tagging "RetentionClass=run" \
              --if-none-match '*' >/dev/null
          done
          jq -n \
            --arg run_id "${run_id}" \
            --arg command_key "${prefix}summary.json" \
            --arg command_hash "$(sha256sum baseline-command-summary.json | cut -d' ' -f1)" \
            --arg baseline_key "${prefix}baseline-summary.json" \
            --arg baseline_hash "$(sha256sum baseline-summary.json | cut -d' ' -f1)" \
            --arg manifest_key "${prefix}manifest.json" \
            --arg manifest_hash "$(sha256sum "${manifest_path}" | cut -d' ' -f1)" \
            --arg dataset "${DATASET_PROCESSED_SHA256}" \
            --arg curated_key "${prefix}curated-queries.json" \
            --arg curated_hash "$(sha256sum curated-queries.json | cut -d' ' -f1)" \
            --arg config "${BASELINE_CONFIG_PATH}" \
            --arg config_hash "${BASELINE_CONFIG_FILE_SHA256}" \
            --arg strongest "${strongest}" \
            '{schema_version: "1.0.0", evidence_mode: "validation_only",
              baseline_run_id: $run_id,
              baseline_command_summary_s3_key: $command_key,
              baseline_command_summary_sha256: $command_hash,
              baseline_summary_s3_key: $baseline_key,
              baseline_summary_sha256: $baseline_hash,
              dataset_manifest_s3_key: $manifest_key,
              dataset_manifest_sha256: $manifest_hash,
              dataset_processed_sha256: $dataset,
              curated_queries_s3_key: $curated_key,
              curated_queries_sha256: $curated_hash,
              baseline_config_path: $config,
              baseline_config_file_sha256: $config_hash,
              strongest_baseline_id: $strongest,
              heldout_access_count: 0}' > baseline-bootstrap-inputs.json
          PYTHONPATH=src uv run python scripts/validate_financial_snapshot.py emit \
            --output /dev/null
          aws s3api put-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${prefix}baseline-bootstrap-inputs.json" \
            --body baseline-bootstrap-inputs.json \
            --checksum-algorithm SHA256 \
            --tagging "RetentionClass=run" \
            --if-none-match '*' >/dev/null
          echo "Validation-only baseline evidence is ready for the separate baseline bootstrap review." \
            >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-baseline-evidence-${{ github.run_id }}
          path: |
            baseline-bootstrap-inputs.json
            baseline-command-summary.json
            baseline-summary.json
            curated-queries.json
          if-no-files-found: warn
          retention-days: 90
