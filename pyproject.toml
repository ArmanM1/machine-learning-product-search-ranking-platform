[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "search-rank"
version = "0.1.0"
description = "Reproducible product-search reranking experiments and evidence service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "ArmanM1" }]
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.116,<1",
  "mangum>=0.19,<1",
  "numpy>=2.1,<3",
  "orjson>=3.10,<4",
  "pandas>=2.2,<3",
  "pyarrow>=19,<23",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.6,<3",
  "psutil>=7.0,<8",
  "pyyaml>=6.0,<7",
  "rank-bm25>=0.2.2,<1",
  "scikit-learn>=1.6,<2",
  "sentence-transformers>=5.0,<6",
  "torch>=2.7,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]
cloud = ["sagemaker>=2.250,<3"]

[project.scripts]
search-rank = "search_rank.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/search_rank"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: exercises multiple local components",
  "slow: uses model or dataset resources",
  "heldout: requires the explicit held-out release guard",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["search_rank"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "psutil", "pyarrow", "pyarrow.*", "rank_bm25"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["search_rank"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
